skill: write-adoption-guide
file: .agents/skills/write-adoption-guide/SKILL.md
units:
  - id: write-adoption-guide.t1
    kind: trigger
    text: "description: Writes cross-repo adoption guides (<SLUG>_ADOPTION_GUIDE.md) from an implemented pattern in the source repo. Layer-agnostic porting steps, what-is/is-not, reference file map, and target-repo checklist. Use when the user wants an adoption guide, playbook for other repos, or to document how to replicate a capability outside this codebase. Does not require the learn skill."
  - id: write-adoption-guide.i1
    kind: instruction
    text: "write-adoption-guide: **Nomenclature (doc type):** **adoption guide** — filename pattern below. (Abbreviations people use: *adoption guide* full phrase; in tables you may write *adoption guide* or *guide*; avoid confusing with *handoff*.)"
  - id: write-adoption-guide.i2
    kind: instruction
    text: "write-adoption-guide: Produce an **adoption guide** — durable documentation for **replicating a capability in other repositories**. Not a session handoff (temporary context for the next agent). Not a bilateral contract between two apps unless that is the whole topic. ---"
  - id: write-adoption-guide.i3
    kind: instruction
    text: "Section heading: Configuration (change per repo when copying this skill)"
  - id: write-adoption-guide.i4
    kind: instruction
    text: "Configuration (change per repo when copying this skill): **Slug (`SLUG`):** topic identifier in **UPPER_SNAKE** — e.g. `mobile-local-dev` → `MOBILE_LOCAL_DEV` → file `MOBILE_LOCAL_DEV_ADOPTION_GUIDE.md`."
  - id: write-adoption-guide.i5
    kind: instruction
    text: "Configuration (change per repo when copying this skill): Set these at the top of your mental model; when copying this skill to another project, edit this block in `SKILL.md`: ---"
  - id: write-adoption-guide.i6
    kind: instruction
    text: "Voice and naming (target-repo readers): **Mandatory:** follow [`references/voice-and-naming.md`](references/voice-and-naming.md)."
  - id: write-adoption-guide.i7
    kind: instruction
    text: "Voice and naming (target-repo readers): Adoption guides are read by **agents implementing the learning in another repository**. The home repo is **one illustrative instance**, not instructions to clone its tree verbatim."
  - id: write-adoption-guide.c1
    kind: table
    text: "Voice and naming (target-repo readers) — header: | Rule | Requirement | (8 row lines)"
  - id: write-adoption-guide.i8
    kind: instruction
    text: "Voice and naming (target-repo readers): Before done: search the guide body below the purpose block for the configured repo name — **must be zero matches**. ---"
  - id: write-adoption-guide.c2
    kind: table
    text: "Adoption guide vs other doc types — header: | Write an **adoption guide** when… | Write something else when… | (5 row lines)"
  - id: write-adoption-guide.i9
    kind: instruction
    text: "Adoption guide vs other doc types: Canonical example in this repo: [`documentation/handoffs/MOBILE_LOCAL_DEV_ADOPTION_GUIDE.md`](../../../documentation/handoffs/MOBILE_LOCAL_DEV_ADOPTION_GUIDE.md). ---"
  - id: write-adoption-guide.i10
    kind: instruction
    text: "Section heading: Procedure"
  - id: write-adoption-guide.i11
    kind: instruction
    text: "1. Confirm inputs: Gather from user and repo (read files; do not invent paths): - **Topic slug** and one-line capability name - **SSOT in source repo** — skill path, `DOC_*`, or script (procedure lives here; guide must not duplicate long checklists) - **Why** — problem, process gap, cost of not adopting - **What was wired** — rules, skills, plan sections, indexes (use [`references/layer-mapping.md`](references/layer-mapping.md)) - **One teaching example** in source repo (optional but recommended) - **Target audience** — TMI apps with Cursor, human-only teams, or both If SSOT does not exist ..."
  - id: write-adoption-guide.i12
    kind: instruction
    text: "2. Choose output path: Default example: `documentation/handoffs/MOBILE_LOCAL_DEV_ADOPTION_GUIDE.md`."
  - id: write-adoption-guide.i13
    kind: instruction
    text: "3. Draft the guide: 1. Purpose block — **one** `Reference implementation ({SOURCE_REPO_DISPLAY_NAME})` line; links to SSOT + workflow layers"
  - id: write-adoption-guide.i14
    kind: instruction
    text: "3. Draft the guide: 2. **What it is / what it is not** (early; prevents scope creep)"
  - id: write-adoption-guide.i15
    kind: instruction
    text: "3. Draft the guide: 3. Problem → what to introduce → **illustrative wiring (home repo only)** → **portable substance** (repo-agnostic) → teaching example (one, illustrative) → workflow → adopt steps → summary"
  - id: write-adoption-guide.i16
    kind: instruction
    text: "3. Draft the guide: **Do not include in the guide:**"
  - id: write-adoption-guide.i17
    kind: instruction
    text: "3. Draft the guide: Use [`references/adoption-guide-template.md`](references/adoption-guide-template.md) and [`references/voice-and-naming.md`](references/voice-and-naming.md). Required sections: - Git status, commit messages, “what we deleted locally” - Full duplicate of rubrics/procedures (link SSOT) - “Suggested skills for next session” - Sidecar-or-single-feature scope unless that *is* the whole topic"
  - id: write-adoption-guide.i18
    kind: instruction
    text: "4. Integrate in source repo (minimal): After writing the file:"
  - id: write-adoption-guide.c3
    kind: table
    text: "4. Integrate in source repo (minimal) — header: | Action | File | (5 row lines)"
  - id: write-adoption-guide.i19
    kind: instruction
    text: "4. Integrate in source repo (minimal): Do **not** require `learn`, `router`, or `finish` to run. No mandatory changeset for docs-only."
  - id: write-adoption-guide.i20
    kind: instruction
    text: "5. Report to user: 1. Path of the new guide (using configured folder)"
  - id: write-adoption-guide.i21
    kind: instruction
    text: "5. Report to user: 2. SSOT paths linked inside the guide"
  - id: write-adoption-guide.i22
    kind: instruction
    text: "5. Report to user: 3. What to **copy to other repos** (this skill folder + guide file, or guide alone)"
  - id: write-adoption-guide.i23
    kind: instruction
    text: "5. Report to user: 4. Reminder: adopters edit `ADOPTION_GUIDE_OUTPUT_FOLDER` in copied skill if their layout differs"
  - id: write-adoption-guide.i24
    kind: instruction
    text: "Copying this skill to another project: 1. Set `ADOPTION_GUIDE_OUTPUT_FOLDER` (e.g. `docs/guides` or `documentation/handoffs`)"
  - id: write-adoption-guide.i25
    kind: instruction
    text: "Copying this skill to another project: 2. Set `SOURCE_REPO_DISPLAY_NAME` and `WORKFLOW_LAYERS_DOC` if present"
  - id: write-adoption-guide.i26
    kind: instruction
    text: "Copying this skill to another project: 3. Add slug to that repo’s router skill index / meta list (here: `.agents/skills/router/SKILL.md`)"
  - id: write-adoption-guide.i27
    kind: instruction
    text: "Copying this skill to another project: 4. Point `layer-mapping.md` “source example” column at the new home repo"
  - id: write-adoption-guide.i28
    kind: instruction
    text: "Copying this skill to another project: **No dependency** on `learn`, `pattern-review`, or other boilerplate-specific skills."
  - id: write-adoption-guide.i29
    kind: instruction
    text: "Copying this skill to another project: Copy the whole folder: Then in the target project’s `SKILL.md`: ---"
  - id: write-adoption-guide.i30
    kind: instruction
    text: "Quality checklist (before done): - [ ] Filename matches `{SLUG}_ADOPTION_GUIDE.md` under `ADOPTION_GUIDE_OUTPUT_FOLDER`"
  - id: write-adoption-guide.i31
    kind: instruction
    text: "Quality checklist (before done): - [ ] What it is / is not table present"
  - id: write-adoption-guide.i32
    kind: instruction
    text: "Quality checklist (before done): - [ ] SSOT linked once; rubric/procedure not duplicated in full"
  - id: write-adoption-guide.i33
    kind: instruction
    text: "Quality checklist (before done): - [ ] **Voice:** `SOURCE_REPO_DISPLAY_NAME` appears **only** in purpose block; §3 has illustrative-only blockquote; §4–§9 have **zero** repo-name repeats"
  - id: write-adoption-guide.i34
    kind: instruction
    text: "Quality checklist (before done): - [ ] §7 has discovery checklist + minimum vs recommended + anti-patterns"
  - id: write-adoption-guide.i35
    kind: instruction
    text: "Quality checklist (before done): - [ ] Teaching example labeled *illustrative* / *one instance* with do-not-copy-verbatim blockquote"
  - id: write-adoption-guide.i36
    kind: instruction
    text: "Quality checklist (before done): - [ ] `{WORKFLOW_LAYERS_DOC}` Related updated"
  - id: write-adoption-guide.i37
    kind: instruction
    text: "Quality checklist (before done): - [ ] No session-handoff tone or git churn"
  - id: write-adoption-guide.i38
    kind: instruction
    text: "Related: - Template: [`references/adoption-guide-template.md`](references/adoption-guide-template.md) - Voice: [`references/voice-and-naming.md`](references/voice-and-naming.md) - Layers: [`references/layer-mapping.md`](references/layer-mapping.md) - Workflow layers: [`documentation/DOC_AGENT_WORKFLOW_LAYERS.md`](../../../documentation/DOC_AGENT_WORKFLOW_LAYERS.md) - Example output (doc runbook SSOT): [`documentation/handoffs/MOBILE_LOCAL_DEV_ADOPTION_GUIDE.md`](../../../documentation/handoffs/MOBILE_LOCAL_DEV_ADOPTION_GUIDE.md)"
