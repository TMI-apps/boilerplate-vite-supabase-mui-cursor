    text: "2.3 Required Information Gathering: **🔴 DECISION POINT:**"
  - id: feature.i55
    kind: instruction
    text: "2.3 Required Information Gathering: Categorize missing info: - **External:** Database schema, API keys, dependency docs, response formats - **App context:** Architecture, tech stack, auth patterns, adjacent functionality, state management - **Design intent:** Only aspects NOT already established in codebase - For missing info → Search codebase first - If no codebase precedent exists, or if the precedent does not clarify intended app usage → **STOP** and ask user - Format question clearly around app usage and vision: \"I need to know [specific thing]. I searched the codebase and found no prec..."
  - id: feature.i56
    kind: instruction
    text: "2.4 Concrete Implementation Approaches (Progressive Complexity): **🔴 DECISION POINT:**"
  - id: feature.i57
    kind: instruction
    text: "2.4 Concrete Implementation Approaches (Progressive Complexity): Using the existing functionality found in 2.2, present **2-4 concrete approaches** ordered from simplest to most complex. Each approach must include: - **What changes:** Specific files, components, and functions affected - **What's new vs modified vs removed:** Scope of the change - **How it uses existing code:** Which patterns, components, utilities from 2.2 - **Tradeoffs:** Effort, flexibility, maintenance implications - **Value profile:** Which product value it optimizes first (delivery speed, stability/risk reduction, UX q..."
