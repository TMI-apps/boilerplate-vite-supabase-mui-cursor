    text: "Code Smell Reference: Common indicators for each level: - Dead code, unused exports - \"Just in case\" features - Solving problems that don't exist - Nested loops that could be lookups - Repeated traversals of same data - Complex algorithms for simple problems - Re-renders without prop changes - Multiple identical API calls - Memory growing over time - Functions > 100 lines - Nesting > 4 levels - Switch statements with many cases - Functions with > 5 parameters ---"
