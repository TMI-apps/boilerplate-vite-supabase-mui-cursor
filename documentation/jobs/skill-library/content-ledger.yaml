skill: learn
file: .agents/skills/learn/SKILL.md
units:
  - id: learn.t1
    kind: trigger
    text: "description: Turns recent code changes, failures, and conversation mistakes into durable guidance. Use when the user runs /learn, asks for a retrospective or to sharpen rules, or after resolving a multi-turn struggle (e.g. 3+ failed attempts, critical CI fix)."
  - id: learn.t2
    kind: trigger
    text: "**Manual:** User invokes learn, asks for a retrospective, or “sharpen rules.”"
  - id: learn.t3
    kind: trigger
    text: "**Proactive:** After a loop (3+ failed attempts), a critical CI fix, or a non-obvious repo discovery — only when the user **confirms** debugging is resolved. **Never** run as primary in parallel with active **`debug`**."
  - id: learn.i1
    kind: instruction
    text: "Learn from changes and sharpen rules: **Related:** Rule grading/quality heuristics: `.agents/skills/rule-quality/SKILL.md`. Finish/changelog flow: `.agents/skills/finish/SKILL.md`."
  - id: learn.i2
    kind: instruction
    text: "Learn from changes and sharpen rules: **This project:** In-repo skills live under `.agents/skills/<name>/SKILL.md` (whitelisted in `projectStructure.config.cjs`). Add new skills as new folders with a `SKILL.md`; do not create other file types under `skills/` unless the whitelist is extended."
  - id: learn.i3
    kind: instruction
    text: "Learn from changes and sharpen rules: Extract lessons from **what just happened** (diffs, errors, retries) and persist them where the assistant will see them **before** the same mistake repeats. This includes **adding** new guidance *and* **removing or narrowing** existing guidance that contributed to the problem. Prefer **one primary home** per lesson; cross-link instead of duplicating. ---"
  - id: learn.i4
    kind: instruction
    text: "Goal: Durable, discoverable guidance with minimal duplication. ---"
  - id: learn.t4
    kind: trigger
    text: "**Manual:** User invokes learn, asks for a retrospective, or “sharpen rules.”"
  - id: learn.t5
    kind: trigger
    text: "**Proactive:** After a loop (3+ failed attempts), a critical CI fix, or a non-obvious repo discovery — only when the user **confirms** debugging is resolved. **Never** run as primary in parallel with active **`debug`**."
  - id: learn.i5
    kind: instruction
    text: "Section heading: Steps"
  - id: learn.i6
    kind: instruction
    text: "0. Context audit: - Read `.cursor/rules/INDEX.md` and any rule files that match the lesson domain. - **Deduplicate:** Update an existing subsection if the lesson fits; add new only when no home fits."
  - id: learn.i7
    kind: instruction
    text: "1. Inspect what happened: - **The loop:** What broke the cycle (the “aha” moment)? - **Git:** `git diff`, `git log` (full messages if needed) for intent and scope. - **Conversation:** User corrections, wrong assumptions, failed tool calls. - **CI / checks:** Failing job names; snippets from `pnpm lint`, `pnpm validate:structure`, `pnpm arch:check`, etc. Summarize in 3–7 bullets: **symptom → root cause → fix** (facts only)."
  - id: learn.i8
    kind: instruction
    text: "1b. Reverse Audit — trace the cause to existing guidance: Using the root cause from Step 1, check whether existing guidance **steered the assistant toward** the mistake. - **Scan:** Search `.cursor/rules/` and `.agents/skills/` for lines related to the root cause. - **Classify each hit:** - **Misleading** — the rule directly caused or encouraged the wrong behavior → recommend **delete** or **rewrite**. - **Overly broad** — correct in spirit but its wording invites misapplication → recommend **narrow** (add scope qualifier or exception). - **Outdated** — was once valid but the codebase or to..."
  - id: learn.i9
    kind: instruction
    text: "2. Form the lesson: - **Trigger:** When should the assistant remember this? - **Constraint:** What must it do or avoid? - **Scope:** One domain (e.g. migrations, React, Edge, structure validation). Merge near-duplicates; drop one-off noise."
  - id: learn.i10
    kind: instruction
    text: "3. Choose where it lives: Pick **one primary** location. Cross-link elsewhere in one line if needed — never paste the same paragraph in three files."
  - id: learn.c1
    kind: table
    text: "3. Choose where it lives — header: | Lesson type | Primary location (this repo) | (14 row lines)"
  - id: learn.i11
    kind: instruction
    text: "3. Choose where it lives: **Procedures vs rules:** Single-line constraints belong in the right `RULE.md`. Use a **skill** (this folder pattern or user skills) when the lesson is a reusable workflow the agent should follow step-by-step."
  - id: learn.i12
    kind: instruction
    text: "3. Choose where it lives: **Tiering:** Use `[CRITICAL]` / `[HINT]` only if the target file already uses that style; otherwise use clear “Always” / “Never” per `.agents/skills/rule-quality/SKILL.md`."
  - id: learn.i13
    kind: instruction
    text: "3. Choose where it lives: Confirm ownership via `.cursor/rules/INDEX.md`."
  - id: learn.i14
    kind: instruction
    text: "4. Apply the edit: - Read the target file (or section); match tone and structure. - **Imperatives:** Direct verbs (“Always…”, “Never…”). - **Examples:** Short `// BAD` / `// GOOD` only where this repo already uses code in that file (e.g. `debug.md` patterns). For `RULE.md` edits, prefer concise bullets; follow `.agents/skills/rule-quality/SKILL.md` when tightening prose. - **Minimal diff:** Small subsection or bullet group; merging duplicates in the same section is fine. Large rewrites need **explicit user confirmation**. - **Deletions & narrowing (from Step 1b):** When the Reverse Audit fl..."
  - id: learn.i15
    kind: instruction
    text: "5. Report: - **TL;DR:** What was learned (1–2 sentences). - **Location:** The exact file path and section heading where it was saved. - **Removals:** List any rules proposed for deletion or narrowing, with the user's decision (applied / deferred / rejected). If none, omit this line. - **Omissions:** Briefly list anything explicitly *not* saved and why. - **Stop.** Wait for next instructions. Do not print the whole file or long code blocks. ---"
  - id: learn.i16
    kind: instruction
    text: "Section heading: Anti-patterns"
  - id: learn.i17
    kind: instruction
    text: "Anti-patterns: - Pasting long SQL or stack traces into rules — summarize; reference migration filenames if useful. - Duplicating the same lesson across many files. - Putting secrets or new credentials in rules or skills. - Rewriting large rule sections without approval. - Deleting or silently rewriting existing rules without presenting the offending line and recommendation to the user first. - Adding files under `.agents/skills/` that are not allowed by `projectStructure.config.cjs` (each subfolder: `SKILL.md`, optional `patterns.md`, optional `references/*.md`)."

skill: optimize2
file: .agents/skills/optimize2/SKILL.md
units:
  - id: optimize2.t1
    kind: trigger
    text: "description: Analyzes code for optimization across design, approach, efficiency, and complexity so fixes happen at the right level. Use when the user asks to optimize, reduce complexity, refactor thoughtfully, or assess whether code should be rewritten vs tweaked."
  - id: optimize2.i1
    kind: instruction
    text: "Purpose: **Key Insight:** Fixing at the wrong level wastes effort. A complex function might need a design change (Level 1), not refactoring (Level 4). Always assess all levels before acting."
  - id: optimize2.i2
    kind: instruction
    text: "Purpose: **SSOT:** `.eslintrc.json` (lines 65-70) is the single source of truth for complexity thresholds."
  - id: optimize2.i3
    kind: instruction
    text: "Purpose: Systematically analyze code for optimization opportunities across four levels: Design, Approach, Efficiency, and Complexity. This command ensures fixes happen at the **right level** to avoid wasted work—don't refactor code that should be rewritten, don't optimize code that should be deleted."
  - id: optimize2.i4
    kind: instruction
    text: "Section heading: Workflow Overview"
  - id: optimize2.i5
    kind: instruction
    text: "Section heading: Core Principles"
  - id: optimize2.i6
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): **Don't extract/abstract until you have 3+ concrete use cases.** Two usages might be coincidental; wait for the third to prove the pattern."
  - id: optimize2.i7
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): **Why:** Every extraction adds indirection. Can you trace the feature without opening >5 files?"
  - id: optimize2.i8
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): **Exceptions (Rare - document why overriding):**"
  - id: optimize2.i9
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): 1. **Architectural Violation:** Code in wrong layer (e.g., business logic in component) → Extract to correct layer even if single-use"
  - id: optimize2.i10
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): 2. **Testability Critical:** Function untestable as-is → Extract enables isolated testing"
  - id: optimize2.i11
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): 3. **Extreme Complexity:** Cognitive >25 AND cyclomatic >15 AND >150 lines → Extraction improves readability"
  - id: optimize2.i12
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): 4. **Level 2 Rewrite Side Effect:** Helper functions emerge naturally from algorithmic rewrite (2A/2B/2C)"
  - id: optimize2.i13
    kind: instruction
    text: "Rule of Three (MANDATORY for Extractions): **Default:** When in doubt → Follow Rule of Three (use 4E)."
  - id: optimize2.i14
    kind: instruction
    text: "Indirection Red Flags: Signs of too much abstraction (see also: [Over-Engineering Indicators](#over-engineering-indicators)): - 🚩 **\"Util\" or \"Helper\" files growing endlessly** → Should stay inline or be colocated with feature - 🚩 **Files with 1-2 exported functions** → Extracted too early, consider inlining - 🚩 **Passthrough functions** → Functions that just call another function with same args - 🚩 **Abstract base classes with one implementation** → Premature abstraction - 🚩 **Interfaces with single implementers** → Abstraction without polymorphism - 🚩 **\"Future-proofing\" comments** → \"Ext..."
  - id: optimize2.i15
    kind: instruction
    text: "Over-Engineering Indicators: **Remember:** The cure should not be worse than the disease. Prefer inline code over scattered micro-files."
  - id: optimize2.i16
    kind: instruction
    text: "Over-Engineering Indicators: When NOT to refactor (accept complexity instead): - Creating files for single-use code (unless [exception](#rule-of-three-mandatory-for-extractions) applies) - Extracting helpers with <3 call sites (violates [Rule of Three](#rule-of-three-mandatory-for-extractions)) - Breaking up cohesive functions that do one thing - High statement count but low cognitive complexity - Verbose operations inflating metrics (style copying, config objects, DOM manipulation) - Abstraction layers with single implementations - \"Future-proofing\" for requirements that don't exist - Two ..."
  - id: optimize2.i17
    kind: instruction
    text: "Complexity Metrics: **SSOT:** `.eslintrc.json` (lines 65-70)"
  - id: optimize2.c1
    kind: table
    text: "Complexity Metrics — header: | Metric | Threshold | ESLint Rule | (8 row lines)"
  - id: optimize2.i18
    kind: instruction
    text: "Section heading: Phase 1: Analysis (All 4 Levels)"
  - id: optimize2.i19
    kind: instruction
    text: "Phase 1: Analysis (All 4 Levels): Analyze each hotspot through all four levels **before any changes**. This prevents fixing at the wrong level."
  - id: optimize2.i20
    kind: instruction
    text: "Level 1: Design Review: **⚠️ CRITICAL: Design issues are the most expensive to fix later. Be ruthless and question everything.**"
  - id: optimize2.i21
    kind: instruction
    text: "Level 1: Design Review: Ask these questions for each code area, using both **zoomed-out** (architectural) and **zoomed-in** (implementation) perspectives:"
  - id: optimize2.i22
    kind: instruction
    text: "Zoomed-Out Questions (Architectural): - **Does this code/feature need to exist?** - Is it used? Check for dead code with `grep`/`codebase_search`. - Could the requirement be eliminated entirely? - Is this solving the right problem, or a symptom? - **Is this in the right layer?** - Is UI doing business logic? (Components should be presentation-only) - Is business logic in services? (Should be in hooks/services layer) - Are concerns properly separated? (Single Responsibility Principle) - Should this be a hook, service, or utility? - **Note:** Moving code to the correct layer (1C) takes preced..."
  - id: optimize2.i23
    kind: instruction
    text: "Zoomed-In Questions (Implementation): - **Is the feature scope correct?** - Is this over-engineered for the actual need? - Are we handling edge cases that never occur? - Is there \"just in case\" code that adds complexity? - **Are responsibilities mixed?** - Does one function/component do multiple unrelated things? - Is validation mixed with business logic? - Is error handling mixed with happy path? - Should this be split into smaller, focused units? - **Is data flow correct?** - Is client-side validation duplicating server-side? (Server should be authoritative) - Are we fetching data that's ..."
  - id: optimize2.i24
    kind: instruction
    text: "Critical Red Flags: **Possible outcomes:**"
  - id: optimize2.i25
    kind: instruction
    text: "Critical Red Flags: **⚠️ Default to skepticism:** If you're not sure, dig deeper. Check if features are actually used, if abstractions save code, if hardcoded values should be configurable."
  - id: optimize2.i26
    kind: instruction
    text: "Critical Red Flags: **Investigation Techniques:**"
  - id: optimize2.i27
    kind: instruction
    text: "Critical Red Flags: Watch for these design smells that indicate deeper problems: - **Hardcoded values scattered across files** → Should be in config/database - **UI components doing API calls** → Should use hooks/services - **Business logic in components** → Should be in hooks/services - **Duplicate validation** → Server should be authoritative, client is UX-only - **No pagination for lists** → Will break at scale - **Synchronous operations blocking UI** → Should be async/fire-and-forget - **God functions/objects** → Doing too many things, split responsibilities - **Feature flags/config in ..."
  - id: optimize2.i28
    kind: instruction
    text: "Level 2: Approach Review: **Investigation Techniques:**"
  - id: optimize2.i29
    kind: instruction
    text: "Level 2: Approach Review: **Possible outcomes:**"
  - id: optimize2.i30
    kind: instruction
    text: "Level 2: Approach Review: Assuming design is sound, evaluate the algorithmic approach: - **Is the algorithm appropriate?** - O(n²) when O(n log n) exists? - Brute force when smarter solution available? - Recursive when iterative is simpler? - Sequential operations that could be parallelized? - Multiple passes over same data when single pass would work? - **Is the data structure appropriate?** - Array when Set/Map would be O(1)? - Nested objects when flat structure works? - Storing derived data that could be computed? - Using wrong data structure for access patterns? - Missing indexes for fr..."
  - id: optimize2.i31
    kind: instruction
