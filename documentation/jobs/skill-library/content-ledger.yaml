    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — No-loss verifier (runs AFTER edits — the critical pass): Orient (above). Inputs: the **pre-edit content ledger** (path given by main agent), the **git diff** of this change, and the current files. For **every unit id** in the pre-edit ledger, classify: - **PRESERVED** — still present in the same file. - **MOVED → `path`** — relocated to its named SSOT owner; verify a link remains at the original location. - **DROPPED (reason)** — intentionally removed; the reason must be present in the change notes / approved at the ..."
  - id: improve-skill-library.ref.c1
