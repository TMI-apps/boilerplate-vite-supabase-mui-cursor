skill: airtable-inspect
file: .agents/skills/airtable-inspect/SKILL.md
units:
  - id: airtable-inspect.t1
    kind: trigger
    text: "description: Inspect an Airtable base in two phases: (1) schema — tables, field ids/types, links via Meta API and repo SSOT, no row data; (2) sample — a few rows to see cell shapes (attachments, rich text, URLs, linked-record ids) with fld… keys. Always schema first, samples second. Safe defaults: low maxRecords, optional fields allowlist, redact PII. Triggers: Meta API, field id, linked tables, schema drift, sample rows, cell shape, returnFieldsByFieldId, wire JSON vs app normalization."
  - id: airtable-inspect.i1
    kind: instruction
    text: "Airtable: inspect (schema + sample): Two phases. **Always run Phase 1 (schema) before Phase 2 (sample)** — you need the `fld…` ids before fetching values."
  - id: airtable-inspect.i2
    kind: instruction
    text: "Section heading: Security (both phases)"
  - id: airtable-inspect.i3
    kind: instruction
    text: "Security (both phases): - Never print API keys or raw `.env` lines. - Meta responses contain **no row values**; still treat dumps as operational metadata — do not commit without review. - For samples: never paste full production rows if they may contain names, emails, or internal content. Prefer **1–3 records**, a `--fields` allowlist when possible, and **truncate or redact** in chat. Do not commit raw JSON samples without review. Requires `VITE_AIRTABLE_API_KEY` and `VITE_AIRTABLE_BASE_ID` in `.env` or `.env.local` (loaded by `scripts/load-airtable-env.js`). ---"
  - id: airtable-inspect.i4
    kind: instruction
    text: "Section heading: Phase 1 — Schema (what exists)"
  - id: airtable-inspect.i5
    kind: instruction
    text: "Goal: Answer **what exists** in the base: table ids (`tbl…`), field ids (`fld…`), types, linked targets — **without** loading record contents. Use this **before** writing mappers or debugging \"field not found\" when the app uses field ids."
  - id: airtable-inspect.i6
    kind: instruction
    text: "Layers (boilerplate vs fork): 1. **Airtable-agnostic:** Meta API `GET /v0/meta/bases/{baseId}/tables`; Data API field ids vs display names."
  - id: airtable-inspect.i7
    kind: instruction
    text: "Layers (boilerplate vs fork): 2. **This boilerplate:** Env `VITE_AIRTABLE_*`; runtime Meta usage and types in `src/shared/services/airtableService.ts`; onboarding task in dev backlog."
  - id: airtable-inspect.i8
    kind: instruction
    text: "Layers (boilerplate vs fork): 3. **Fork / product:** If you need a single SSOT for many `tbl`* / `fld`* constants, add a small module under `src/shared/` following `.cursor/rules/file-placement/RULE.md` and `.cursor/rules/architecture/RULE.md` (this repo does not ship one)."
  - id: airtable-inspect.c1
    kind: table
    text: "Commands (repo root) — header: | Command | Purpose | (4 row lines)"
  - id: airtable-inspect.i9
    kind: instruction
    text: "Commands (repo root): Forks may add their own drift-check script (compare a checked-in constants module to a saved Meta dump); this boilerplate does not ship one."
  - id: airtable-inspect.i10
    kind: instruction
    text: "Section heading: Workflow"
  - id: airtable-inspect.i11
    kind: instruction
    text: "Workflow: 1. Run `pnpm airtable:meta-dump -- --pretty` (or `--out <path>`) with valid env."
  - id: airtable-inspect.i12
    kind: instruction
    text: "Workflow: 2. For the relevant table, list **every** field: name, `id`, `type`, and link options if applicable."
  - id: airtable-inspect.i13
    kind: instruction
    text: "Workflow: 3. Cross-check with `src/shared/services/airtableService.ts` (and any fork-owned id constants): fields present in Airtable but absent in code often cause drift bugs."
  - id: airtable-inspect.i14
    kind: instruction
    text: "Section heading: Phase 2 — Sample (what values look like)"
  - id: airtable-inspect.i15
    kind: instruction
    text: "Goal: See **what values** look like: attachment arrays, rich text wrappers, URLs, linked record id lists — with **`fld…` keys** as returned when `returnFieldsByFieldId=true` (same style as id-based API consumers). Only meaningful once Phase 1 told you which `fld…` values to pass to `--fields`."
  - id: airtable-inspect.i16
    kind: instruction
    text: "Boilerplate vs wire shape: - `scripts/airtable-sample-records.js` hits the **public Airtable REST API** and prints JSON (`records[].fields`). - `src/shared/services/airtableService.ts` may normalize or select fields for the UI. For \"what does the REST API return today?\", **run the script** (or an equivalent fetch); reading the service alone shows app behavior, not necessarily the raw envelope."
  - id: airtable-inspect.i17
    kind: instruction
    text: "Commands (repo root): **Default table:** if you omit both `--table` and `--table-name`, the script uses `VITE_AIRTABLE_TABLE_ID` (same as the setup wizard primary table). If it is missing or still the placeholder, pass `--table` or `--table-name` explicitly."
  - id: airtable-inspect.i18
    kind: instruction
    text: "Commands (repo root): Output is JSON: `records[].fields` keyed by `fld…`."
  - id: airtable-inspect.i19
    kind: instruction
    text: "Section heading: Workflow"
  - id: airtable-inspect.i20
    kind: instruction
    text: "Workflow: 1. **Structure:** Full field list from Phase 1."
  - id: airtable-inspect.i21
    kind: instruction
    text: "Workflow: 2. **Pick fields:** Choose `fld…` ids for `--fields` when narrowing PII or payload size."
  - id: airtable-inspect.i22
    kind: instruction
    text: "Workflow: 3. Run `pnpm airtable:sample` or `node scripts/airtable-sample-records.js` with low `--max-records`."
  - id: airtable-inspect.i23
    kind: instruction
    text: "Workflow: 4. Relate shapes to helpers in `src/shared/services/airtableService.ts` (and fork code)."
  - id: airtable-inspect.i24
    kind: instruction
    text: "Related: - `README.md` — env vars and Airtable scripts (`pnpm airtable:meta-dump`, `pnpm airtable:sample`)"
  - id: airtable-inspect.c2
    kind: table
    text: "Fenced output/template block — ## Scope"

skill: bundle-ship
file: .agents/skills/bundle-ship/SKILL.md
units:
  - id: bundle-ship.t1
    kind: trigger
    text: "description: Bundles all uncommitted work from multiple Cursor agent threads on the same branch and checkout into one finish commit, then pushes. Use when the user runs /bundle-ship, /finish-all, or asks to finish and push everything across threads on one checkout."
  - id: bundle-ship.t2
    kind: trigger
    text: "Treat these as the same skill: `/bundle-ship`, `/finish-all`, “finish and push everything across threads.”"
  - id: bundle-ship.i1
    kind: instruction
    text: "bundle-ship: **SSOT for commit mechanics:** `.agents/skills/finish/SKILL.md` (bundle mode)."
  - id: bundle-ship.i2
    kind: instruction
    text: "bundle-ship: **SSOT for push mechanics:** `.agents/skills/push/SKILL.md`."
  - id: bundle-ship.i3
    kind: instruction
    text: "bundle-ship: Land **all** uncommitted changes on the current branch and checkout when multiple agent threads may have contributed — one bundled commit, then push."
  - id: bundle-ship.i4
    kind: instruction
    text: "Section heading: When to use"
  - id: bundle-ship.c1
    kind: table
    text: "When to use — header: | Use `bundle-ship` | Use plain `finish` → `push` instead | (5 row lines)"
  - id: bundle-ship.i5
    kind: instruction
    text: "When to use: **Skip gate:** Clean tree with nothing to commit → report and stop (do not invent work)."
  - id: bundle-ship.i6
    kind: instruction
    text: "What this skill owns: Orchestration and **bundle intent** only. It does not duplicate version rules, staging gates, changelog format, or push safety checks — those stay in `finish` and `push`."
  - id: bundle-ship.i7
    kind: instruction
    text: "Preconditions: 1. **Same branch, same checkout** — not worktrees, not per-thread branches."
  - id: bundle-ship.i8
    kind: instruction
    text: "Preconditions: 2. **Other threads idle** — user has paused or finished other agent chats on this checkout. This skill cannot stop other agents."
  - id: bundle-ship.i9
    kind: instruction
    text: "Preconditions: 3. User invoked bundle-ship (explicit combined finish + push intent)."
  - id: bundle-ship.i10
    kind: instruction
    text: "Preconditions: If `git status` or the full diff **changes between two fresh reads** without this thread editing those paths, **stop**. Tell the user the tree is still moving; wait until other threads are idle, then re-run."
  - id: bundle-ship.i11
    kind: instruction
    text: "Section heading: Workflow"
  - id: bundle-ship.i12
    kind: instruction
    text: "Workflow: Copy and track:"
  - id: bundle-ship.i13
    kind: instruction
    text: "Section heading: Step 1: Snapshot the full tree"
  - id: bundle-ship.i14
    kind: instruction
    text: "Step 1: Snapshot the full tree: 1. Run `git status -sb` and read the **full** diff from disk (`git diff` and `git diff --cached`; include untracked paths that belong in the release)."
  - id: bundle-ship.i15
    kind: instruction
    text: "Step 1: Snapshot the full tree: 2. Summarize **everything** that would land — by area/feature, not by which thread wrote it."
  - id: bundle-ship.i16
    kind: instruction
    text: "Step 1: Snapshot the full tree: 3. Do **not** filter to “this thread’s files.” The perimeter is the **entire** working tree."
  - id: bundle-ship.i17
    kind: instruction
    text: "Section heading: Step 2: Confirm bundle scope"
  - id: bundle-ship.i18
    kind: instruction
    text: "Step 2: Confirm bundle scope: **Task backlog:** If `src/config/app-tasks.json` has multiple `in-progress` rows from different threads, ask which task(s) to archive before commit — same as `finish`, but expect ambiguity more often in multi-thread landings."
  - id: bundle-ship.i19
    kind: instruction
    text: "Step 2: Confirm bundle scope: Tell the user: - What files and areas are included. - That version/changelog (if required) will describe **the full bundle**, per `finish` semver rules. - That other agent threads on this checkout should be **paused**. Ask once: **ready to bundle-finish and push this snapshot?** If the user declines, stop. If they want thread-scoped finish instead, route to plain `finish` (no push in that turn unless they ask)."
  - id: bundle-ship.i20
    kind: instruction
    text: "Section heading: Step 3: Run finish (bundle mode)"
  - id: bundle-ship.i21
    kind: instruction
    text: "Step 3: Run finish (bundle mode): Read `.agents/skills/finish/SKILL.md` and execute it with these overrides:"
  - id: bundle-ship.c2
    kind: table
    text: "Step 3: Run finish (bundle mode) — header: | `finish` default | `bundle-ship` override | (6 row lines)"
  - id: bundle-ship.i22
    kind: instruction
    text: "Step 3: Run finish (bundle mode): **One commit** for the full snapshot. Changelog and version bump (when required) must reflect **all** bundled changes."
  - id: bundle-ship.i23
    kind: instruction
    text: "Step 3: Run finish (bundle mode): Follow all other `finish` requirements: archive task when applicable, version/changelog gate, staging decision gate, ready-to-commit confirmation, commit message standards, protected files, feature-doc validation."
  - id: bundle-ship.i24
    kind: instruction
    text: "Section heading: Step 4: Run push"
  - id: bundle-ship.i25
    kind: instruction
    text: "Step 4: Run push: 1. Read `.agents/skills/push/SKILL.md` and execute it in this same turn."
  - id: bundle-ship.i26
    kind: instruction
    text: "Step 4: Run push: 2. User already asked for ship — push confirmation may be a single “ready to push this bundled commit?” (still required; do not push without confirmation)."
  - id: bundle-ship.i27
    kind: instruction
    text: "Step 4: Run push: 3. If push preconditions fail (dirty tree, behind remote), stop per `push` and report — do not commit-fix inside `push`."
  - id: bundle-ship.i28
    kind: instruction
    text: "Step 4: Run push: After a **successful** commit:"
  - id: bundle-ship.c3
    kind: table
    text: "Non-goals — header: | Will NOT do | Mark | (8 row lines)"
  - id: bundle-ship.i29
    kind: instruction
    text: "Section heading: Boundaries"
  - id: bundle-ship.c4
    kind: table
    text: "Boundaries — header: | Not `bundle-ship` | Use instead | (6 row lines)"
  - id: bundle-ship.i30
    kind: instruction
    text: "Invocation aliases: Treat these as the same skill: `/bundle-ship`, `/finish-all`, “finish and push everything across threads.”"
  - id: bundle-ship.c5
    kind: table
    text: "Fenced output/template block — Bundle-ship progress:"

skill: caveman
file: .agents/skills/caveman/SKILL.md
units:
  - id: caveman.t1
    kind: trigger
    text: "description: Ultra-compressed communication mode. Cuts token usage ~75% by dropping filler, articles, and pleasantries while keeping full technical accuracy. Use when user says \"caveman mode\", \"talk like caveman\", \"use caveman\", \"less tokens\", \"be brief\", or invokes /caveman."
  - id: caveman.i1
    kind: instruction
    text: "Persistence: ACTIVE EVERY RESPONSE once triggered. No revert after many turns. No filler drift. Still active if unsure. Off only when user says \"stop caveman\" or \"normal mode\"."
  - id: caveman.i2
    kind: instruction
    text: "Rules: Drop: articles (a/an/the), filler (just/really/basically/actually/simply), pleasantries (sure/certainly/of course/happy to), hedging. Fragments OK. Short synonyms (big not extensive, fix not \"implement a solution for\"). Abbreviate common terms (DB/auth/config/req/res/fn/impl). Strip conjunctions. Use arrows for causality (X -> Y). One word when one word enough. Technical terms stay exact. Code blocks unchanged. Errors quoted exact. Pattern: `[thing] [action] [reason]. [next step].` Not: \"Sure! I'd be happy to help you with that. The issue you're experiencing is likely caused by...\" Y..."
  - id: caveman.i3
    kind: instruction
    text: "Examples: **\"Why React component re-render?\"**"
  - id: caveman.i4
    kind: instruction
    text: "Examples: **\"Explain database connection pooling.\"**"
  - id: caveman.i5
    kind: instruction
    text: "Examples: > Inline obj prop -> new ref -> re-render. `useMemo`. > Pool = reuse DB conn. Skip handshake -> fast under load."
  - id: caveman.i6
    kind: instruction
    text: "Auto-Clarity Exception: Drop caveman temporarily for: security warnings, irreversible action confirmations, multi-step sequences where fragment order risks misread, user asks to clarify or repeats question. Resume caveman after clear part done. Example -- destructive op: > **Warning:** This will permanently delete all rows in the `users` table and cannot be undone. > > ```sql > DROP TABLE users; > ``` > > Caveman resume. Verify backup exist first."

skill: challenge
file: .agents/skills/challenge/SKILL.md
units:
  - id: challenge.t1
    kind: trigger
    text: "description: Challenges and simplifies a concrete feature to reduce steps, clicks, and cognitive load (flow and code modes by default). Use when the user targets a workflow and asks whether it is overbuilt, or runs /challenge."
  - id: challenge.i1
    kind: instruction
    text: "challenge: Challenge and simplify a specific feature to reduce steps, clicks, and cognitive load. Use this command when the user points to a concrete feature/workflow and wants to question whether it is overbuilt."
  - id: challenge.i2
    kind: instruction
    text: "Section heading: Modes"
  - id: challenge.i3
    kind: instruction
    text: "Modes: **Default behavior (mandatory):** When a feature is targeted, run **both modes** in one challenge pass."
  - id: challenge.i4
    kind: instruction
    text: "Modes: This command supports two analysis modes: - **Flow Mode:** Reduce user-facing steps and decisions in the feature workflow - **Code Mode:** Simplify implementation structure for readability and minimal transformations Only run a single mode if the user explicitly asks for mode scoping."
  - id: challenge.i5
    kind: instruction
    text: "Purpose: Find the shortest path to the same outcome by: - Removing unnecessary steps - Merging redundant steps - Reducing decisions and configuration burden - Leveraging existing behavior instead of adding new abstractions This command is intentionally narrow. It does not run broad repo optimization sweeps. ---"
  - id: challenge.i6
    kind: instruction
    text: "Required Input: 1. Target feature/workflow (required)"
  - id: challenge.i7
    kind: instruction
    text: "Required Input: 2. User goal/outcome (required)"
  - id: challenge.i8
    kind: instruction
    text: "Required Input: 3. Current pain (optional but recommended)"
  - id: challenge.i9
    kind: instruction
    text: "Required Input: 4. Constraints that must remain (required if known)"
  - id: challenge.i10
    kind: instruction
    text: "Required Input: Before analysis, confirm: If target or goal is unclear, ask concise clarifying questions and wait. ---"
  - id: challenge.i11
    kind: instruction
    text: "Section heading: Core Principle"
  - id: challenge.i12
    kind: instruction
    text: "Core Principle: **Simplify before optimizing.**"
  - id: challenge.i13
    kind: instruction
    text: "Core Principle: 1. Remove"
  - id: challenge.i14
    kind: instruction
    text: "Core Principle: 2. Merge"
  - id: challenge.i15
    kind: instruction
    text: "Core Principle: 3. Reorder"
  - id: challenge.i16
    kind: instruction
    text: "Core Principle: 4. Automate/default"
  - id: challenge.i17
    kind: instruction
    text: "Core Principle: 5. Refactor"
  - id: challenge.i18
    kind: instruction
    text: "Core Principle: 6. Add new code (last resort)"
  - id: challenge.i19
    kind: instruction
    text: "Core Principle: Prefer this order: Never code-golf for character count. Prefer linear readability and maintainability over brevity. ---"
  - id: challenge.i20
    kind: instruction
    text: "Challenge Lenses (Use all): 1. **Existence:** Does this step need to exist?"
  - id: challenge.i21
    kind: instruction
    text: "Challenge Lenses (Use all): 2. **Value:** What user value is gained by this step?"
  - id: challenge.i22
    kind: instruction
    text: "Challenge Lenses (Use all): 3. **Redundancy:** Is this duplicated elsewhere?"
  - id: challenge.i23
    kind: instruction
    text: "Challenge Lenses (Use all): 4. **Timing:** Can this happen later, lazily, or in background?"
  - id: challenge.i24
    kind: instruction
    text: "Challenge Lenses (Use all): 5. **Defaulting:** Can smart defaults remove choice?"
  - id: challenge.i25
    kind: instruction
    text: "Challenge Lenses (Use all): 6. **Combination:** Can two steps become one?"
  - id: challenge.i26
    kind: instruction
    text: "Challenge Lenses (Use all): 7. **Trust boundary:** Can server/source-of-truth eliminate client-side complexity?"
  - id: challenge.i27
    kind: instruction
    text: "Challenge Lenses (Use all): 8. **Failure mode:** If removed, what actually breaks?"
  - id: challenge.i28
    kind: instruction
    text: "Challenge Lenses (Use all): For the selected feature, challenge assumptions with these lenses:"
  - id: challenge.i29
    kind: instruction
    text: "Section heading: Code Audit Lenses (Mandatory in Code Mode)"
  - id: challenge.i30
    kind: instruction
    text: "Code Audit Lenses (Mandatory in Code Mode): 1. **Data Flow**"
  - id: challenge.i31
    kind: instruction
    text: "Code Audit Lenses (Mandatory in Code Mode): 2. **Control Flow**"
  - id: challenge.i32
    kind: instruction
    text: "Code Audit Lenses (Mandatory in Code Mode): 3. **Sparseness**"
  - id: challenge.i33
    kind: instruction
    text: "Code Audit Lenses (Mandatory in Code Mode): 4. **Abstraction**"
  - id: challenge.i34
    kind: instruction
    text: "Code Audit Lenses (Mandatory in Code Mode): When code is provided (or when challenging a feature implementation), run this internal audit: - Is data changing shape more times than necessary? - Are there redundant `map`/`filter`/`reduce` chains that can be consolidated? - Can the same intent be expressed in fewer transformations without reducing clarity? - Is logic deeply nested? - Can guard clauses (early returns) flatten indentation and clarify happy path? - Is there boilerplate or speculative generality (\"just in case\" logic)? - Can custom logic be replaced by standard language/runtime fe..."
  - id: challenge.i35
    kind: instruction
    text: "Section heading: Analysis Workflow"
  - id: challenge.i36
    kind: instruction
    text: "Section heading: Phase 1: Map the Current Feature (Flow + Code Surface)"
  - id: challenge.i37
    kind: instruction
    text: "Phase 1: Map the Current Feature (Flow + Code Surface): Produce a compact map: - Entry point - Ordered steps - Decision points - Exit/success state - Error paths - Primary files/functions implementing the flow Then report: - Total steps - Required user decisions count - Required inputs count"
  - id: challenge.i38
    kind: instruction
    text: "Section heading: Phase 2: Run Dual Audit"
  - id: challenge.i39
    kind: instruction
    text: "2A. Flow Audit: Apply challenge lenses to workflow steps."
  - id: challenge.i40
    kind: instruction
    text: "2B. Code Audit: Apply code audit lenses to key implementation files/functions. Check specifically: - unnecessary transformation chains - nesting that should become guard clauses - speculative/generalized code that can be removed - abstractions that should be inlined"
  - id: challenge.i41
    kind: instruction
    text: "Section heading: Phase 3: Identify Reduction Opportunities"
  - id: challenge.i42
    kind: instruction
    text: "Phase 3: Identify Reduction Opportunities: Tag each step with one action: - `[delete]` - `[merge-with:<step>]` - `[default]` - `[defer]` - `[automate]` - `[keep]` For code-level findings, tag each candidate: - `[prune]` - `[flatten]` - `[consolidate]` - `[inline]` - `[replace-with-standard]` - `[keep]`"
  - id: challenge.i43
    kind: instruction
    text: "Section heading: Phase 4: Propose Progressive Simplification Options"
  - id: challenge.i44
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: 1. Steps before -> after"
  - id: challenge.i45
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: 2. Code complexity before -> after (brief, qualitative)"
  - id: challenge.i46
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: 3. What is removed/merged/defaulted/pruned/flattened/consolidated"
  - id: challenge.i47
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: 4. Risks/regressions"
  - id: challenge.i48
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: 5. Estimated implementation scope"
  - id: challenge.i49
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: 6. Why this is better for the stated user goal"
  - id: challenge.i50
    kind: instruction
    text: "Phase 4: Propose Progressive Simplification Options: Always present options from least disruptive to most transformative: - **Option A - Trim:** Minimal edits, low risk, small step reduction - **Option B - Streamline:** Moderate edits, medium risk, meaningful reduction - **Option C - Reframe:** Strong simplification, higher impact, largest reduction If needed, include: - **Option D - Replace Flow:** New flow model only when A/B/C cannot meet goal Each option must include:"
  - id: challenge.i51
    kind: instruction
    text: "Section heading: Phase 5: Context Questions Gate (Mandatory)"
  - id: challenge.i52
    kind: instruction
    text: "Phase 5: Context Questions Gate (Mandatory): Before providing final refactor/implementation, ask **1 to 3** targeted business/edge-case questions when uncertainty exists. Examples: - \"Must this data shape remain stable for downstream consumers?\" - \"Can this validation be removed if upstream already guarantees it?\" - \"Can this derived state be calculated on demand instead of stored?\" Wait for user answers before final implementation when questions are asked."
  - id: challenge.i53
    kind: instruction
    text: "Section heading: Phase 6: User Decision Gate (Mandatory)"
  - id: challenge.i54
    kind: instruction
    text: "Phase 6: User Decision Gate (Mandatory): Stop and ask: \"Which option should I implement: A, B, C, or D?\" Do not implement until the user explicitly chooses."
  - id: challenge.i55
    kind: instruction
    text: "Section heading: Phase 7: Execute Chosen Option"
  - id: challenge.i56
    kind: instruction
    text: "Phase 7: Execute Chosen Option: Implementation rules: - Keep changes minimal and local - Reuse existing patterns and components - Avoid new abstraction unless clearly justified - Preserve required constraints from input - Prefer guard clauses over deep nesting when it improves clarity - Prefer fewer, clearer transformations when behavior stays equivalent After changes: - Run relevant project checks (lint/type/build/tests as applicable) - Report what changed and what was intentionally not changed - Request user validation of behavior Never claim success without user testing confirmation. ---"
  - id: challenge.i57
    kind: instruction
    text: "Output Template: Use this response format: ---"
  - id: challenge.i58
    kind: instruction
    text: "Section heading: Boundaries"
  - id: challenge.i59
    kind: instruction
    text: "Boundaries: **Next:** User picks option → **`quick-piv`** or **`implement`** for approved simplification; repo-wide patterns → **`consolidate`**; hotspot polish → **`optimize2`**."
  - id: challenge.i60
    kind: instruction
    text: "Boundaries: - Do not run repo-wide hotspot discovery unless user asks. - Do not convert this into a full architecture migration exercise. - Do not optimize for metrics first; optimize for fewer steps and clearer flow. - If simplification conflicts with security/compliance requirements, keep the requirement and simplify around it. - By default, challenge a feature through both Flow Mode and Code Mode in the same pass."
  - id: challenge.c1
    kind: table
    text: "Fenced output/template block — FEATURE CHALLENGE: <name>"

skill: consolidate
file: .agents/skills/consolidate/SKILL.md
units:
  - id: consolidate.t1
    kind: trigger
    text: "description: Systematically audit the codebase for consolidation, abstraction, and redundancy removal opportunities across features. Use when the user asks to find duplication, consolidate code, audit for redundancy, reduce repetition, or identify shared patterns that should be unified."
  - id: consolidate.t2
    kind: trigger
    text: "User asks to \"find duplication\", \"consolidate code\", \"audit for redundancy\", \"reduce repetition\""
  - id: consolidate.t3
    kind: trigger
    text: "User asks \"what can be shared/unified/abstracted?\""
  - id: consolidate.t4
    kind: trigger
    text: "Before a major refactor or architectural cleanup"
  - id: consolidate.t5
    kind: trigger
    text: "After multiple features have been built and the codebase has grown organically"
  - id: consolidate.i1
    kind: instruction
    text: "Purpose: **Scope:** Repo-wide pattern analysis. For per-hotspot optimization use `optimize2`. For single-feature simplification use `challenge`. For **semantic placement / wrong-layer repair** (after tooling is green), use this skill's **Semantic placement mode** below."
  - id: consolidate.i2
    kind: instruction
    text: "Purpose: Discover, classify, and prioritize opportunities to unify repeated code patterns across the codebase. This skill owns the **discovery** phase - systematically finding what is duplicated - and produces an actionable consolidation plan."
  - id: consolidate.i3
    kind: instruction
    text: "Section heading: Modes"
  - id: consolidate.i4
    kind: instruction
    text: "Modes: - **Default — Redundancy audit:** the discovery → classify → prioritize → present → execute workflow below (what repeats?). - **Semantic placement repair:** is code in the **wrong layer/feature**, or does it mix concerns? Moves and refactors behind a gate, **after** `validate` (gate depth)/tooling is green. Full procedure: [`references/semantic-placement.md`](references/semantic-placement.md). (Formerly the `architecture-repair2` skill.)"
  - id: consolidate.t6
    kind: trigger
    text: "User asks to \"find duplication\", \"consolidate code\", \"audit for redundancy\", \"reduce repetition\""
  - id: consolidate.t7
    kind: trigger
    text: "User asks \"what can be shared/unified/abstracted?\""
  - id: consolidate.t8
    kind: trigger
    text: "Before a major refactor or architectural cleanup"
  - id: consolidate.t9
    kind: trigger
    text: "After multiple features have been built and the codebase has grown organically"
  - id: consolidate.i5
    kind: instruction
    text: "Section heading: Core Principles"
  - id: consolidate.i6
    kind: instruction
    text: "Rule of Three (Inherited from optimize2): Do not extract/abstract until you have **3+ concrete use cases**. Full rule and exceptions: **`.agents/skills/optimize2/SKILL.md`** § Rule of Three."
  - id: consolidate.i7
    kind: instruction
    text: "Consolidation != Abstraction: Not every repeated pattern needs a shared abstraction. Sometimes the right answer is: - **Accept duplication** - the copies will diverge - **Standardize the pattern** - document it as a convention without extracting - **Extract a utility** - simple shared function - **Create a configurable abstraction** - parameterized hook/component (highest cost) Always prefer the lowest-cost option that solves the actual problem."
  - id: consolidate.i8
    kind: instruction
    text: "Indirection Budget: Every extraction adds indirection. Before proposing consolidation, answer: - Can a developer still trace a feature without opening >5 files? - Does the abstraction save more code than it adds? - Would a new developer understand the abstraction faster than the duplicated copies? If any answer is \"no\", reconsider. ---"
  - id: consolidate.i9
    kind: instruction
    text: "Section heading: Workflow"
  - id: consolidate.i10
    kind: instruction
    text: "Section heading: Phase 1: Discovery"
  - id: consolidate.i11
    kind: instruction
    text: "Phase 1: Discovery: Systematically scan the codebase using multiple lenses. Run all applicable scans - do not stop after finding the first pattern."
  - id: consolidate.i12
    kind: instruction
    text: "1A. Structural Similarity Scan: **What to look for:**"
  - id: consolidate.i13
    kind: instruction
    text: "1A. Structural Similarity Scan: Find files with similar names or roles across features: - Files with matching suffixes: `use*TableModel.ts`, `*Page.tsx`, `*Filters.tsx`, `*Service.ts` - Files with matching structure: similar exports, similar hook signatures, similar component props - Feature folders with parallel internal structure (same sub-files in each)"
  - id: consolidate.i14
    kind: instruction
    text: "1B. Import Cluster Analysis: **What to look for:**"
  - id: consolidate.i15
    kind: instruction
    text: "1B. Import Cluster Analysis: Find groups of imports that appear together repeatedly: - 3+ files importing the same 3+ modules together -> likely a shared pattern waiting to be extracted - Features importing the same set of shared utilities -> those utilities might need a higher-level wrapper"
  - id: consolidate.i16
    kind: instruction
    text: "1C. Pattern Repetition Scan: **What to look for:**"
  - id: consolidate.i17
    kind: instruction
    text: "1C. Pattern Repetition Scan: Search for repeated code shapes: - Functions with similar signatures doing similar things in different features - Hook patterns: fetch -> transform -> expose (repeated per feature) - Component patterns: loading/error/empty state handling repeated per page - Service patterns: Supabase query -> map -> return (repeated per entity)"
  - id: consolidate.i18
    kind: instruction
    text: "1D. Convention Inconsistency Scan: **What to look for:**"
  - id: consolidate.i19
    kind: instruction
    text: "1D. Convention Inconsistency Scan: Find places where the same logical operation is done differently: - Same concern handled by different mechanisms (e.g., two date-formatting approaches) - Same UI pattern built with different components (e.g., filter bars) - Same data transformation done inline in some files, via utility in others - Shared components/hooks that exist but are not used everywhere they could be"
  - id: consolidate.i20
    kind: instruction
    text: "1E. Git Churn Correlation: **What to look for:**"
  - id: consolidate.i21
    kind: instruction
    text: "1E. Git Churn Correlation: Files that change together often share a hidden coupling: - Feature files that always change in lockstep -> shared concern not yet extracted - Utility files that change whenever a feature changes -> leaky abstraction > Use PowerShell-compatible commands in this repo. Avoid Unix-only command idioms. ---"
  - id: consolidate.i22
    kind: instruction
    text: "Section heading: Phase 2: Classification"
  - id: consolidate.i23
    kind: instruction
    text: "Phase 2: Classification: Categorize every finding into one of four redundancy types:"
  - id: consolidate.c1
    kind: table
    text: "Phase 2: Classification — header: | Type | Definition | Example | Typical fix | (6 row lines)"
  - id: consolidate.i24
    kind: instruction
    text: "Phase 2: Classification: **For each finding, record:**"
  - id: consolidate.i25
    kind: instruction
    text: "Phase 2: Classification: 1. **What:** Description of the repeated pattern"
  - id: consolidate.i26
    kind: instruction
    text: "Phase 2: Classification: 2. **Where:** File paths (all occurrences)"
  - id: consolidate.i27
    kind: instruction
    text: "Phase 2: Classification: 3. **Type:** Literal / Structural / Conceptual / Inconsistent usage"
  - id: consolidate.i28
    kind: instruction
    text: "Phase 2: Classification: 4. **Frequency:** How many occurrences"
  - id: consolidate.i29
    kind: instruction
    text: "Phase 2: Classification: 5. **Variance:** What differs between occurrences (the parameterizable parts)"
  - id: consolidate.i30
    kind: instruction
    text: "Section heading: Phase 3: Analysis"
  - id: consolidate.i31
    kind: instruction
    text: "Phase 3: Analysis: For each classified finding, assess consolidation viability:"
  - id: consolidate.i32
    kind: instruction
    text: "3A. Divergence Likelihood: Ask: \"Will these copies need to evolve differently?\" - **High divergence** -> Accept duplication, document as intentional - **Low divergence** -> Strong consolidation candidate"
  - id: consolidate.i33
    kind: instruction
    text: "3B. Coupling Cost: Ask: \"What does the shared abstraction couple together?\" - If consolidation creates a dependency between features that were independent -> high cost - If consolidation only extracts to a lower shared layer -> low cost"
  - id: consolidate.i34
    kind: instruction
    text: "3C. Abstraction Complexity: Ask: \"How complex is the shared abstraction?\" - **Simple extraction** (copy to shared, update imports) -> low complexity - **Parameterized utility** (extract with config options) -> medium complexity - **Configurable factory/builder** (generate variants from config) -> high complexity Prefer simpler forms. If the abstraction needs 5+ parameters to cover all variants, it may not be worth it."
  - id: consolidate.i35
    kind: instruction
    text: "3D. Existing Shared Infrastructure: Check what already exists in `src/shared/`, `src/components/common/`, and `src/lib/`: - Is there already a utility that handles this concern partially? - Can an existing shared hook/component be extended rather than creating a new one? - Would the consolidation conflict with or duplicate existing shared code?"
  - id: consolidate.i36
    kind: instruction
    text: "3E. Ambiguity and Standards Check: Before recommending consolidation, ask: - Is it ambiguous whether these repeated implementations are meant to serve the same user journey or different app usage contexts? - Would the proposed consolidation diverge from industry standards, framework best practices, or established repo conventions? If usage intent is ambiguous, stop and ask the user a question about how the app will be used so the answer determines whether to consolidate, standardize, or intentionally keep duplication. If a recommendation would preserve or introduce a standards diversion, as..."
  - id: consolidate.i37
    kind: instruction
    text: "Section heading: Phase 4: Prioritization"
  - id: consolidate.i38
    kind: instruction
    text: "Phase 4: Prioritization: Score each candidate using this framework:"
  - id: consolidate.c2
    kind: table
    text: "Phase 4: Prioritization — header: | Factor | 0 (bad for consolidation) | 1 | 2 (good for consolidation) | (7 row lines)"
  - id: consolidate.i39
    kind: instruction
    text: "Phase 4: Prioritization: **Priority tiers:**"
  - id: consolidate.i40
    kind: instruction
    text: "Phase 4: Prioritization: **Additional priority boosters:**"
  - id: consolidate.i41
    kind: instruction
    text: "Phase 4: Prioritization: - **Score 6+:** Strong candidate - consolidate - **Score 3-5:** Moderate candidate - consolidate if convenient, otherwise document - **Score 0-2:** Weak candidate - accept duplication, document as intentional - Bug found in one copy but not another -> +3 (proves divergence is harmful) - Blocks other work (e.g., cannot add a feature to all tables without touching N files) -> +2 - Part of a critical user-facing path -> +1 ---"
  - id: consolidate.i42
    kind: instruction
    text: "Section heading: Phase 5: Present Findings"
  - id: consolidate.i43
    kind: instruction
    text: "Phase 5: Present Findings: **CRITICAL: Do not implement without user approval.**"
  - id: consolidate.i44
    kind: instruction
    text: "Phase 5: Present Findings: Present the audit as a consolidation map, organized by priority tier."
  - id: consolidate.i45
    kind: instruction
    text: "Output Format: **Decision gate:** Wait for user to choose which consolidations to execute."
  - id: consolidate.i46
    kind: instruction
    text: "Output Format: If any finding has unresolved usage ambiguity or an unconfirmed standards diversion, ask that question before asking which candidates to implement. ---"
  - id: consolidate.i47
    kind: instruction
    text: "Section heading: Phase 6: Execute"
  - id: consolidate.i48
    kind: instruction
    text: "Phase 6: Execute: For each approved consolidation:"
  - id: consolidate.i49
    kind: instruction
    text: "6.1 Pre-flight: - [ ] Verify target location against `architecture/RULE.md` layer rules"
  - id: consolidate.i50
    kind: instruction
    text: "6.1 Pre-flight: - [ ] Check `projectStructure.config.cjs` whitelist for target folder"
  - id: consolidate.i51
    kind: instruction
    text: "6.1 Pre-flight: - [ ] Verify no circular dependencies would be created"
  - id: consolidate.i52
    kind: instruction
    text: "6.1 Pre-flight: - [ ] All imports will use path aliases (`@/` prefix)"
  - id: consolidate.i53
    kind: instruction
    text: "6.1 Pre-flight: - [ ] If any protected file must be changed (`.cursor/**`, `projectStructure.config.cjs`, lint/ts config, etc.), stop and get explicit user approval first"
  - id: consolidate.i54
    kind: instruction
    text: "6.2 Implementation: 1. **Create the shared abstraction** in the correct layer"
  - id: consolidate.i55
    kind: instruction
    text: "6.2 Implementation: 2. **Migrate consumers one at a time** - each migration is a self-contained change"
  - id: consolidate.i56
    kind: instruction
    text: "6.2 Implementation: 3. **Verify after each migration** - run lint and type-check"
  - id: consolidate.i57
    kind: instruction
    text: "6.2 Implementation: 4. **Remove old copies** only after all consumers are migrated"
  - id: consolidate.i58
    kind: instruction
    text: "6.3 Post-flight: - [ ] `pnpm validate:all` passes"
  - id: consolidate.i59
    kind: instruction
    text: "6.3 Post-flight: - [ ] `pnpm lint` passes"
  - id: consolidate.i60
    kind: instruction
    text: "6.3 Post-flight: - [ ] `pnpm validate:structure` passes"
  - id: consolidate.i61
    kind: instruction
    text: "6.3 Post-flight: - [ ] `pnpm lint:arch` passes (layer boundaries)"
  - id: consolidate.i62
    kind: instruction
    text: "6.3 Post-flight: - [ ] No new circular dependencies"
  - id: consolidate.i63
    kind: instruction
    text: "6.3 Post-flight: - [ ] All imports use `@/` path aliases"
  - id: consolidate.i64
    kind: instruction
    text: "6.3 Post-flight: - [ ] Feature traceability preserved (can trace any feature in <=5 files)"
  - id: consolidate.i65
    kind: instruction
    text: "6.3 Post-flight: - [ ] Feature README updated when any `src/features/*` code changed; `pnpm validate:feature-docs:staged` passes for staged changes"
  - id: consolidate.i66
    kind: instruction
    text: "6.4 Documentation: - Update `CHANGELOG.md` if consolidation changes public API or behavior - Update `ARCHITECTURE.md` if new shared patterns are introduced ---"
  - id: consolidate.i67
    kind: instruction
    text: "Scoping Options: The user may request different scopes:"
  - id: consolidate.c3
    kind: table
    text: "Scoping Options — header: | Scope | What to scan | When to use | (6 row lines)"
  - id: consolidate.i68
    kind: instruction
    text: "Scoping Options: Default to **full audit** unless user specifies otherwise. ---"
  - id: consolidate.i69
    kind: instruction
    text: "Symbiotic Relationships: This skill is independently complete but works best in concert with sibling skills:"
  - id: consolidate.c4
    kind: table
    text: "Symbiotic Relationships — header: | Sibling | How it complements this skill | (6 row lines)"
  - id: consolidate.i70
    kind: instruction
    text: "Symbiotic Relationships: **Recommended workflow for major cleanup:**"
  - id: consolidate.i71
    kind: instruction
    text: "Symbiotic Relationships: 1. `challenge` individual features (simplify each)"
  - id: consolidate.i72
    kind: instruction
    text: "Symbiotic Relationships: 2. `consolidate` across features (unify patterns) <- this skill"
  - id: consolidate.i73
    kind: instruction
    text: "Symbiotic Relationships: 3. Semantic placement mode (verify everything is in the right place — `references/semantic-placement.md`)"
  - id: consolidate.i74
    kind: instruction
    text: "Symbiotic Relationships: 4. `optimize2` on any remaining hotspots (per-function polish)"
  - id: consolidate.i75
    kind: instruction
    text: "Section heading: Anti-Patterns"
  - id: consolidate.i76
    kind: instruction
    text: "Anti-Patterns: - **Premature abstraction:** Extracting after seeing only 2 occurrences without checking if they will diverge - **God utilities:** Creating a single shared file with 20+ exports - keep shared code focused - **Abstraction for abstraction's sake:** If the shared version is harder to understand than the copies, keep the copies - **Ignoring variance:** Forcing different things into one abstraction by adding flags/modes - creates complexity - **Big-bang consolidation:** Migrating all consumers at once - migrate one at a time, verify each step - **Skipping the discovery phase:** Ju..."
  - id: consolidate.i77
    kind: instruction
    text: "Section heading: Boundaries"
  - id: consolidate.i78
    kind: instruction
    text: "Boundaries: **Next:** Approved refactors → **`implement`** or **`quick-piv`** → **`validate`** → **`finish`**; hotspot follow-up → **`optimize2`**."
  - id: consolidate.i79
    kind: instruction
    text: "Boundaries: - This skill **discovers and plans** consolidation. It does not run broad performance optimization (use `optimize2`). - For architectural *location* correctness beyond placement of new shared code, use this skill's **Semantic placement mode** (`references/semantic-placement.md`). - This skill does not simplify individual feature workflows (use `challenge`). - Never claim success without user testing confirmation."
  - id: consolidate.l1
    kind: link
    text: "`references/semantic-placement.md` -> references/semantic-placement.md"
  - id: consolidate.l2
    kind: link
    text: "semantic placement mode -> references/semantic-placement.md"
  - id: consolidate.ref.i1
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Section heading: Semantic placement repair (consolidate mode)"
  - id: consolidate.ref.i2
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Semantic placement repair (consolidate mode): **Prerequisite:** Run **`.agents/skills/validate/SKILL.md`** (gate depth) first (or confirm `pnpm validate:structure`, `pnpm lint:arch`, `pnpm arch:check` are green). This mode assumes tool-caught violations are already fixed; it focuses on what tools miss."
  - id: consolidate.ref.i3
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Semantic placement repair (consolidate mode): Complement automated architecture enforcement by identifying **semantic** violations and code-organization issues that scripts cannot detect, and by guiding refactoring **moves**. Focuses on architectural intent and refactoring execution, not duplicate checks already covered by tooling. (Formerly the `architecture-repair2` skill.) ---"
  - id: consolidate.ref.i4
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Section heading: Phase A: Semantic analysis (what tools miss)"
  - id: consolidate.ref.i5
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase A: Semantic analysis (what tools miss): After automated checks pass, analyze violations that require human judgment:"
  - id: consolidate.ref.i6
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — A.1 Misplaced concerns (code organization): - **Business logic in UI components:** components containing API calls, complex calculations, or data transformations. - **UI logic in utilities:** utils containing React-specific code or DOM manipulation. - **Service logic in hooks:** hooks containing business rules instead of orchestration. - **Detection:** read file contents; analyze imports and function complexity. Tools check import paths, not semantic content."
  - id: consolidate.ref.i7
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — A.2 Missing abstractions (code duplication): - Duplicated logic across files; functions that should live in `shared/utils/`; API/data access duplicated across features. - **Detection:** pattern matching / similarity. (This overlaps the main consolidate discovery phases — reuse them; tools don't detect semantic duplication.)"
  - id: consolidate.ref.i8
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — A.3 Feature boundary violations: - Cross-feature dependencies (features importing other features' internals); shared code placed in a single feature. - **Detection:** analyze import paths between features. ESLint boundaries catch some, not all."
  - id: consolidate.ref.i9
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — A.4 Architectural intent violations: - Files in technically valid but semantically wrong locations (e.g. utility in `components/helpers/` instead of `shared/utils/`; feature-specific hook in `shared/hooks/` instead of `features/[feature]/hooks/`). - **Detection:** analyze file purpose vs location and import patterns. Tools validate structure, not semantic correctness. ---"
  - id: consolidate.ref.i10
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Section heading: Phase B: Refactoring impact analysis"
  - id: consolidate.ref.i11
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase B: Refactoring impact analysis: For each violation:"
  - id: consolidate.ref.i12
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — B.1 Dependency analysis: - Count dependents (how many files import this); list import locations; check whether a move would create circular dependencies (complement dependency-cruiser). Use grep / codebase search."
  - id: consolidate.ref.i13
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — B.2 Move complexity: - **Simple:** file move only, no import updates (rare). - **Medium:** file move + import path updates (most common). - **Complex:** file move + import updates + refactoring (extract logic, split files). - **Risk:** Low (few dependents, isolated) / Medium (moderate dependents, cross-cutting) / High (many dependents, core functionality, or needs refactoring)."
  - id: consolidate.ref.i14
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — B.3 Path alias compliance: - All imports use `@/` prefix (ESLint-enforced; verify during move). Convert relative imports to aliases during the move. ---"
  - id: consolidate.ref.i15
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Section heading: Phase C: Prioritization"
  - id: consolidate.ref.i16
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase C: Prioritization: Rank by: - **Impact score:** (dependency count × risk level) − move complexity. - **Quick wins:** low complexity, high architectural benefit. - **Foundation fixes:** core structural issues blocking other improvements. - **Group related moves:** files that should move together to minimize import updates. ---"
  - id: consolidate.ref.i17
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Section heading: Phase D: Recommendations (chat output, no files)"
  - id: consolidate.ref.i18
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase D: Recommendations (chat output, no files): For each top priority (top 5–10): - **Current location:** full path. - **Intended location:** per architecture (must exist in `projectStructure.config.cjs` whitelist). - **Reason:** why it violates architectural intent (semantic). - **Impact:** files importing it, import statements to update, risk, complexity. - **Recommended approach:** - **Option A — Manual move (preferred if Cursor auto-updates imports):** move in IDE; verify imports; run `pnpm validate:structure && pnpm ..."
  - id: consolidate.ref.i19
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Section heading: Phase E: Move execution"
  - id: consolidate.ref.i20
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase E: Move execution: **When the user requests a move:**"
  - id: consolidate.ref.i21
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase E: Move execution: 1. **Pre-flight:** intended location in whitelist; no new cycles; imports will use `@/`; confirm with user."
  - id: consolidate.ref.i22
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase E: Move execution: 2. **Manual (Option A):** give exact \"move file X to Y\"; after move run `pnpm validate:structure`, `pnpm lint:arch`, `pnpm arch:check`; if imports not auto-updated, switch to Option B."
  - id: consolidate.ref.i23
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase E: Move execution: 3. **Agent (Option B):** move file; grep all imports; update paths to `@/` aliases (never relative parent), update barrel `index.ts`, preserve `import type`; verify with `validate:structure`, `lint:arch`, `arch:check`, and type-check (`tsc --noEmit`)."
  - id: consolidate.ref.i24
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase E: Move execution: **Batch moves:** group by domain/feature; move dependencies before dependents; update all imports; run all validation after the batch."
  - id: consolidate.ref.i25
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Phase E: Move execution: **Documentation after significant changes:** update `ARCHITECTURE.md` if present; record refactoring in `CHANGELOG.md` (via `finish`); update path references only in affected contract docs; do not create new deep docs without explicit user approval."
  - id: consolidate.ref.i26
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Important notes: - **Complementary, not duplicate:** semantic violations tools cannot detect. - **Run tools first:** `pnpm validate:structure`, `pnpm lint:arch`, `pnpm arch:check` before this mode. - **Path aliases required** (`@/`); **whitelist compliance** — never modify the whitelist to accommodate a violation. - **Baseline respect:** existing violations in `.dependency-cruiser-baseline.json` are ignored; focus on new ones. - **Architecture rules immutable:** violations mean code is wrong, not the rules. - **Cursor IDE:*..."
  - id: consolidate.ref.i27
    kind: instruction
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Already automated (do not re-report): Folder/file location, layer boundaries, relative imports, circular deps, orphaned modules, file naming — covered by `project-structure-validator.js`, ESLint boundaries, and dependency-cruiser."
  - id: consolidate.ref.c1
    kind: table
    text: "file: .agents/skills/consolidate/references/semantic-placement.md — Fenced output/template block — # Architecture Repair Analysis"

skill: debug
file: .agents/skills/debug/SKILL.md
units:
  - id: debug.t1
    kind: trigger
    text: "description: Structured scientific debugging for runtime bugs, regressions, flaky behavior, frontend/backend failures, Supabase/RLS/Auth/Storage issues, and user-reported errors. Use when the user invokes /debug, asks to debug, reports an error, or describes inconsistent behavior."
  - id: debug.i1
    kind: instruction
    text: "debug: Use **Scientific Method Debugging**. The goal is to reduce uncertainty with evidence, not to patch around symptoms. The user does **not** edit code. The user only: - Performs actions in the app. - Filters console logs if needed (when not in Cursor Debug Mode). - Copies and pastes console logs (when not in Cursor Debug Mode; in Debug Mode the **agent** reads logs directly). - Performs actions in external dashboards when the agent cannot. Never claim the issue is fixed. Only the user decides when the issue is resolved. ---"
  - id: debug.i2
    kind: instruction
    text: "Section heading: 0. Mandatory Preflight"
  - id: debug.i3
    kind: instruction
    text: "0. Mandatory Preflight: 1. **Environment frozen:** Which app runtime, branch, deployed build, Supabase/project ref, user/account, browser/session, and feature flag state is being exercised? If unknown, state how you will prove it first."
  - id: debug.i4
    kind: instruction
    text: "0. Mandatory Preflight: 2. **Recent-change audit:** Which recent files, migrations, PRs, config changes, deploys, or dashboard edits touched the failing surface or shared dependency?"
  - id: debug.i5
    kind: instruction
    text: "0. Mandatory Preflight: 3. **Event-chain draft:** What is the shortest user action → app behavior → side effect/API/DB call → failure chain you can reconstruct from current evidence?"
  - id: debug.i6
    kind: instruction
    text: "0. Mandatory Preflight: 4. **Pattern lookup:** Search [`patterns.md`](patterns.md) for symptom tokens, error codes, subsystem names, and recent-change terms. Record matched pattern names or `no match for: <tokens>`."
  - id: debug.i7
    kind: instruction
    text: "0. Mandatory Preflight: 5. **Layer alignment:** Which layer does the best current evidence point to (UI state, client request, API/Edge, database/RLS, external service, deployment/config)? Is the next diagnostic step aimed at that same layer?"
  - id: debug.i8
    kind: instruction
    text: "0. Mandatory Preflight: Before forming hypotheses or editing code, fill these slots in your working notes and reflect them in the first debug response: If any slot is skipped, explicitly write `skipped because ...`. Do not silently omit a section. ---"
  - id: debug.i9
    kind: instruction
    text: "Section heading: 1. Process Guardrails"
  - id: debug.i10
    kind: instruction
    text: "1. Process Guardrails: Use these guardrails during every evidence loop: - **Environment first:** Before interpreting logs, prove which runtime environment, project/branch, and deployed build the user is exercising. Do not assume production, staging, local, or a branch from memory. - **One turn should narrow:** Each debug iteration must explicitly state what uncertainty was removed. If the next action does not plausibly cut the remaining probability space roughly in half, pause and choose a better diagnostic step. - **Cross-surface failures point down-stack:** When independent user actions f..."
  - id: debug.i11
    kind: instruction
    text: "2. Expected Input: Accept any of: - Error message + stack trace - Console output - Description of what the user did - Mention of external systems involved If information is missing, proceed with assumptions and state them. ---"
  - id: debug.i12
    kind: instruction
    text: "3. Component Nesting & Structure Analysis (React/UI Issues): 1. List the problematic component's full component/DOM hierarchy."
  - id: debug.i13
    kind: instruction
    text: "3. Component Nesting & Structure Analysis (React/UI Issues): 2. List relevant props, context values, refs, and derived state passed through that tree."
  - id: debug.i14
    kind: instruction
    text: "3. Component Nesting & Structure Analysis (React/UI Issues): 3. Identify likely structural culprits:"
  - id: debug.i15
    kind: instruction
    text: "3. Component Nesting & Structure Analysis (React/UI Issues): 4. Map any structural hypothesis back to the event chain."
  - id: debug.i16
    kind: instruction
    text: "3. Component Nesting & Structure Analysis (React/UI Issues): For UI/React issues, analyze component nesting **before** behavioral instrumentation: - CSS inheritance/overrides from parents - Global styles affecting layout context (`body`, `html`, `#root`) - Overflow/stacking context issues (any element with overflow other than `visible` creates a new stacking context) - Prop type mismatches or undefined props - Context/provider mismatch - Z-index/positioning conflicts from nesting Skip this section only when the bug is clearly not UI/React. ---"
  - id: debug.i17
    kind: instruction
    text: "4. Event Chain Reconstruction: 1. Reconstruct the chain from user action → app behavior → API calls/side effects → failure point."
  - id: debug.i18
    kind: instruction
    text: "4. Event Chain Reconstruction: 2. Present it as a numbered list."
  - id: debug.i19
    kind: instruction
    text: "4. Event Chain Reconstruction: 3. Identify the most suspicious link and why."
  - id: debug.i20
    kind: instruction
    text: "4. Event Chain Reconstruction: For each issue: All diagnostic steps must map back to **specific links in this chain**. If a diagnostic step cannot be mapped, choose a better step. ---"
  - id: debug.i21
    kind: instruction
    text: "5. Pattern Recognition: Known patterns live in [`patterns.md`](patterns.md). Use it as a searchable reference, not as prose to skim. Before forming hypotheses: - Search for exact symptoms/error codes (`08P01`, `42501`, `42703`, `42P10`, `CORS`, `Maximum update depth`, etc.). - Search for subsystem terms (`RLS`, `storage`, `JWT`, `Edge Function`, `stream`, `cache`, etc.). - Search for recent-change terms (migration/function/table/component names touched near the regression). If a pattern matches, promote it into the hypothesis set with a falsifier. If no pattern matches, record the searched ..."
  - id: debug.i22
    kind: instruction
    text: "6. Hypotheses (Scientific Method): For each issue propose **2–3 hypotheses**: - Each maps to a **specific event-chain step**. - Each predicts **specific observable outcomes**. - Each includes a **falsification condition**. - At least one involves **external configuration** when errors involve auth, permissions, RLS, API keys, service URLs, quotas, environment mismatch, or dev/prod differences. - At least one involves a **recent change** when the bug appeared after a refactor, migration, deploy, dashboard change, dependency bump, or environment split. Hypotheses must be designed so that logs..."
  - id: debug.i23
    kind: instruction
    text: "7. Instrumentation: **When Cursor Debug Mode is active** (system reminder contains \"DEBUG MODE\" with a provisioned server endpoint, log path, and session ID):"
  - id: debug.i24
    kind: instruction
    text: "7. Instrumentation: **When Cursor Debug Mode is NOT active** (default):"
  - id: debug.i25
    kind: instruction
    text: "7. Instrumentation: All hypotheses must be verifiable through evidence captured after reproducing the issue. Logs should include all information needed for falsification or verification. For API calls, raw API input and output can be needed; avoid exposing secrets. Place instrumentation at the layer the evidence currently points to: - UI symptoms with uncertain client state → instrument component state/events. - Correct client state but bad request/response → instrument service/request boundaries. - Cross-surface failures sharing DB/Auth/Storage/Edge → inspect server, database, dashboard, M..."
  - id: debug.i26
    kind: instruction
    text: "Section heading: 8. Unified Diagnostic Steps"
  - id: debug.i27
    kind: instruction
    text: "8. Unified Diagnostic Steps: Provide **one integrated numbered list** of user/agent actions. These may include in-app interactions, DevTools checks, network observations, dashboard inspections, MCP queries, log reads, or focused code edits. Each step must: - Correspond to a **specific location** in the event chain. - State **what observation supports or refutes each hypothesis**. - Aim to **cut the search space in half**. - Indicate precisely what the user should do or return only when the agent cannot perform the action. Avoid category labels; all steps belong to one ordered plan. ---"
  - id: debug.i28
    kind: instruction
    text: "9. Iterative Evidence Loop: 1. Update the event chain using the new evidence."
  - id: debug.i29
    kind: instruction
    text: "9. Iterative Evidence Loop: 2. Mark each hypothesis as **supported**, **refuted**, or **uncertain**, and briefly explain why with evidence."
  - id: debug.i30
    kind: instruction
    text: "9. Iterative Evidence Loop: 3. Re-check [`patterns.md`](patterns.md) using any newly discovered tokens."
  - id: debug.i31
    kind: instruction
    text: "9. Iterative Evidence Loop: 4. **Revert or remove code changes from rejected hypotheses.** Do not let defensive guards, speculative fixes, or unproven changes accumulate. Only keep modifications supported by runtime evidence."
  - id: debug.i32
    kind: instruction
    text: "9. Iterative Evidence Loop: 5. Form a smaller, more precise hypothesis set."
  - id: debug.i33
    kind: instruction
    text: "9. Iterative Evidence Loop: 6. Provide the next unified action list."
  - id: debug.i34
    kind: instruction
    text: "9. Iterative Evidence Loop: When new evidence is available (user returns with logs, or agent reads logs directly): When verifying a fix, compare **before and after** evidence for the same code path. Do not claim a fix works without user confirmation. Repeat until only the user declares the issue resolved. ---"
  - id: debug.i35
    kind: instruction
    text: "10. Output Structure for Debug Responses: Every substantive debug response must include these slots. Keep each concise; write `skipped because ...` when not applicable. For small follow-up turns, a compact version is fine, but it must still mention environment, pattern lookup, hypotheses/evidence status, and the next narrowing step. ---"
  - id: debug.i36
    kind: instruction
    text: "Next: When the user **confirms** the issue is resolved, optionally offer **`.agents/skills/learn/SKILL.md`** to persist reusable lessons. For commit/changelog, **`.agents/skills/finish/SKILL.md`** only when the user requests it. ---"
  - id: debug.i37
    kind: instruction
    text: "Section heading: Boundaries"
  - id: debug.c1
    kind: table
    text: "Boundaries — header: | Not `debug` | Use instead | (7 row lines)"
  - id: debug.c2
    kind: table
    text: "Fenced output/template block — ## Debug State"
  - id: debug.l1
    kind: link
    text: "`patterns.md` -> patterns.md"

skill: feature
file: .agents/skills/feature/SKILL.md
units:
  - id: feature.t1
    kind: trigger
    text: "description: Runs systematic new-feature engineering with mandatory decision stops; produces product/requirements artifacts, not DEVELOPMENT_PLAN.md (plan is SSOT for execution plans). Use for new feature requests before planning. Not implement, validate, or finish."
  - id: feature.i1
    kind: instruction
    text: "feature: **CRITICAL: At every 🔴 DECISION POINT, you MUST:**"
  - id: feature.i2
    kind: instruction
    text: "feature: 1. **STOP** all coding/implementation activities"
  - id: feature.i3
    kind: instruction
    text: "feature: 2. Present the question/decision clearly to the user"
  - id: feature.i4
    kind: instruction
    text: "feature: 3. **WAIT** for explicit user response before proceeding"
  - id: feature.i5
    kind: instruction
    text: "feature: 4. Document the user's answer in the implementation document"
  - id: feature.i6
    kind: instruction
    text: "feature: 5. Do NOT proceed to next phase until user confirms"
  - id: feature.i7
    kind: instruction
    text: "feature: **Violating decision points is a critical failure.**"
  - id: feature.i8
    kind: instruction
    text: "feature: Systematic engineering process for new feature requests. **Primary outcome:** product/requirements artifact with mandatory 🔴 decision stops — **not** the durable execution plan (`DEVELOPMENT_PLAN.md` is **`plan`** SSOT). Follow phases sequentially. ---"
  - id: feature.i9
    kind: instruction
    text: "Section heading: Phase 1: Pre-Development Analysis"
  - id: feature.i10
    kind: instruction
    text: "1.0 App vision (product SSOT): - [ ] Read `documentation/DOC_APP_VISION.md`. If vision status is **`DRAFT`**, **STOP** and direct the user to fill it (see `.agents/skills/start/SKILL.md` § App vision) or obtain explicit written deferral before Phase 1 coding. Feature specs must not invent product scope when this file is empty of real prose."
  - id: feature.i11
    kind: instruction
    text: "Section heading: 1.1 Branch & Workflow Check"
  - id: feature.i12
    kind: instruction
    text: "1.1 Branch & Workflow Check: - [ ] Verify current git branch. If on `main` or `develop`, **stop immediately** and instruct: `git switch develop` + `git pull origin develop`, then `git switch -c feature/<name>`"
  - id: feature.i13
    kind: instruction
    text: "1.1 Branch & Workflow Check: - [ ] Never commit directly to `main` or `develop`. Branch must be a `feature/*` branch (workflow/RULE.md § Branch Strategy)"
  - id: feature.i14
    kind: instruction
    text: "1.1 Branch & Workflow Check: - [ ] If starting new work, sync with latest `origin/develop` before creating `feature/*` to avoid stale-base conflicts"
  - id: feature.i15
    kind: instruction
    text: "1.2 Rule Decision Tree: **Backend/Secrets?**"
