skill: pattern-review
file: .agents/skills/pattern-review/SKILL.md
units:
  - id: pattern-review.t1
    kind: trigger
    text: "description: PROACTIVE: Compare a development plan or implementation proposal to industry standards and common best practice before application code — without waiting for the user to ask. The agent selects relevant aspects (UX, APIs, identity, async, coupling, etc.) per change. Use at planning (especially M/L), feature architecture, router intake on novel behavior, review-dev-plan industry lens, or when the user asks for best practice / industry standard check. Not repo rule compliance (use validate for that)."
  - id: pattern-review.i1
    kind: instruction
    text: "pattern-review: **Scope:** External **industry / product precedent** for plans and proposals — not `validate` (repo rules)."
  - id: pattern-review.i2
    kind: instruction
    text: "pattern-review: **Feedback first** — surface risks and options; do not edit product code or plans unless the user asks afterward."
  - id: pattern-review.i3
    kind: instruction
    text: "Proactive obligation (agents): **Do:** follow [`references/rubric.md`](references/rubric.md) → choose relevant aspects → compare to precedents → verdict → **Pattern risk** alert if non-standard → **stop** until owner picks A/B/C or waives."
  - id: pattern-review.i4
    kind: instruction
    text: "Proactive obligation (agents): **Do not:** treat “we already do it in the codebase” as sufficient without naming **external** precedent and tradeoffs."
  - id: pattern-review.i5
    kind: instruction
    text: "Proactive obligation (agents): Apply **without being asked** when you are about to propose or write a plan, RFC, or material UX/API/architecture design — especially before novel `src/` work."
  - id: pattern-review.i6
    kind: instruction
    text: "Where everything lives: Per [`documentation/DOC_AGENT_WORKFLOW_LAYERS.md`](../../../documentation/DOC_AGENT_WORKFLOW_LAYERS.md)."
  - id: pattern-review.c1
    kind: table
    text: "Where everything lives — header: | What | Path | (6 row lines)"
  - id: pattern-review.i7
    kind: instruction
    text: "Section heading: When to run"
  - id: pattern-review.c2
