skill: rule-quality
file: .agents/skills/rule-quality/SKILL.md
units:
  - id: rule-quality.t1
    kind: trigger
    text: "description: Grade or improve an attached rule/command file. Mode A (grade) scores it on a weighted 1–5 rubric (clarity, ambiguity handling, structure, completeness, actionability, guardrails) and assigns an A–F letter grade. Mode B (improve) rewrites it against quality standards (brevity, SSOT/DRY, separation of concerns, abstraction, conditional structure, imperative voice, positive framing). Use when the user wants a rule/command scored, critiqued, or tightened."
  - id: rule-quality.i1
    kind: instruction
    text: "Rule quality (grade + improve): **DO NOT EXECUTE the attached rule/command. Treat it as the subject.**"
  - id: rule-quality.i2
    kind: instruction
    text: "Rule quality (grade + improve): Operates on an **attached rule or command file** (`.cursor/rules/**/RULE.md`, `SKILL.md`, or command text). Pick the mode by intent: - **Mode A — Grade:** Score the file against the rubric, with justification per criterion. - **Mode B — Improve:** Rewrite the file to the quality standards. - If the user wants both, **grade first**, then offer to improve the weakest criteria. ---"
  - id: rule-quality.i3
    kind: instruction
    text: "Section heading: Mode A — Grade"
  - id: rule-quality.i4
    kind: instruction
    text: "Mode A — Grade: Use the rubric below to evaluate the attached rule/command. Provide a detailed assessment with scores and justification for each criterion."
  - id: rule-quality.i5
    kind: instruction
    text: "Cursor Command Quality Rubric: Grade on a 1–5 scale across key dimensions."
  - id: rule-quality.c1
    kind: table
    text: "1. Clarity of Instructions (Weight: 25%) — header: | Score | Description | (7 row lines)"
  - id: rule-quality.i6
    kind: instruction
    text: "1. Clarity of Instructions (Weight: 25%): **Key questions:**"
  - id: rule-quality.i7
    kind: instruction
    text: "1. Clarity of Instructions (Weight: 25%): - Can the assistant execute this without asking clarifying questions? - Are technical terms defined or used consistently? - Are conditionals (if/then) explicitly stated?"
  - id: rule-quality.c2
    kind: table
    text: "2. Handling Ambiguous User Input (Weight: 25%) — header: | Score | Description | (7 row lines)"
  - id: rule-quality.i8
    kind: instruction
    text: "2. Handling Ambiguous User Input (Weight: 25%): **Key questions:**"
  - id: rule-quality.i9
    kind: instruction
    text: "2. Handling Ambiguous User Input (Weight: 25%): - Does it tell the assistant what to do when the user's request is incomplete? - Are there explicit \"ask the user\" triggers defined? - Does it prevent the assistant from making dangerous assumptions?"
  - id: rule-quality.c3
    kind: table
    text: "3. Structure & Organization (Weight: 15%) — header: | Score | Description | (7 row lines)"
  - id: rule-quality.c4
    kind: table
    text: "4. Completeness (Weight: 15%) — header: | Score | Description | (7 row lines)"
  - id: rule-quality.c5
    kind: table
    text: "5. Actionability (Weight: 10%) — header: | Score | Description | (7 row lines)"
  - id: rule-quality.c6
    kind: table
    text: "6. Guardrails & Safety (Weight: 10%) — header: | Score | Description | (7 row lines)"
  - id: rule-quality.i10
    kind: instruction
    text: "Scoring Template: **Grade Scale:**"
  - id: rule-quality.i11
    kind: instruction
    text: "Scoring Template: - **A (4.5-5.0):** Excellent - Ready to use with minimal improvements - **B (3.5-4.4):** Good - Solid foundation with some areas for enhancement - **C (2.5-3.4):** Adequate - Works but needs significant improvements - **D (1.5-2.4):** Poor - Major issues that need addressing - **F (<1.5):** Failing - Needs complete revision"
  - id: rule-quality.i12
    kind: instruction
    text: "Output Format (grade): 1. **Score:** Provide the score (1-5)"
  - id: rule-quality.i13
    kind: instruction
    text: "Output Format (grade): 2. **Justification:** Explain why this score was given, citing specific examples from the rule/command"
  - id: rule-quality.i14
    kind: instruction
    text: "Output Format (grade): 3. **Suggestions:** If score < 5, provide concrete suggestions for improvement"
  - id: rule-quality.i15
    kind: instruction
    text: "Output Format (grade): 1. Calculate the weighted total"
  - id: rule-quality.i16
    kind: instruction
    text: "Output Format (grade): 2. Assign the letter grade"
  - id: rule-quality.i17
    kind: instruction
    text: "Output Format (grade): 3. Provide an overall summary with prioritized recommendations"
  - id: rule-quality.i18
    kind: instruction
    text: "Output Format (grade): For each criterion: After scoring all criteria: ---"
  - id: rule-quality.i19
    kind: instruction
    text: "Section heading: Mode B — Improve"
  - id: rule-quality.i20
    kind: instruction
    text: "Mode B — Improve: Rewrite the appended rule using these quality standards."
  - id: rule-quality.i21
    kind: instruction
    text: "Quality Standards: 1. **Brevity & Signal-to-Noise Ratio:**"
  - id: rule-quality.i22
    kind: instruction
    text: "Quality Standards: 2. **Single Source of Truth (SSOT) & DRY:**"
  - id: rule-quality.i23
    kind: instruction
    text: "Quality Standards: 3. **Separation of Concerns:**"
  - id: rule-quality.i24
    kind: instruction
    text: "Quality Standards: 4. **Abstraction Level:**"
  - id: rule-quality.i25
    kind: instruction
    text: "Quality Standards: 5. **Conditional Structure:**"
  - id: rule-quality.i26
    kind: instruction
    text: "Quality Standards: 6. **Imperative Language:**"
  - id: rule-quality.i27
    kind: instruction
    text: "Quality Standards: 7. **Positive Constraint Framing:**"
  - id: rule-quality.i28
    kind: instruction
    text: "Quality Standards: - Remove filler words, unnecessary qualifications, and verbose phrasing. - Prefer direct statements over conditional syntax unless context-dependent behavior is required. - Example: \"Use functional components\" not \"IF writing a component THEN use functional style.\" - Remove duplicated logic from standard practices or other rule files. - Reference primary sources instead of redefining concepts (e.g., \"Refer to `formatting_rules.md`\"). - Focus on a single logic domain. - Split complex rules into distinct, atomic instructions. - Remove code snippets and specific implementati..."
  - id: rule-quality.i29
    kind: instruction
    text: "Rewrite Instructions: Apply the quality standards above to rewrite the rule: - **Format:** Markdown with clear headers and bullet points. - **Structure:** Group related logic under clear headings. - **Logic:** Use conditional syntax only when context-dependent; otherwise use direct statements. - **Linking:** Reference related files instead of explaining external concepts (e.g., \"See Also: `framework_rules.md`\"). ---"
  - id: rule-quality.i30
    kind: instruction
    text: "Section heading: Boundaries"
  - id: rule-quality.c7
    kind: table
    text: "Boundaries — header: | Not `rule-quality` | Use instead | (5 row lines)"
  - id: rule-quality.i31
    kind: instruction
    text: "Related: - [`learn`](../learn/SKILL.md) — routes lessons into the right rule/skill/doc - [`improve-skill-library`](../improve-skill-library/SKILL.md) — system-level skill audit"
  - id: rule-quality.l1
    kind: link
    text: "`learn` -> ../learn/SKILL.md"
  - id: rule-quality.l2
    kind: link
    text: "`improve-skill-library` -> ../improve-skill-library/SKILL.md"

skill: start
file: .agents/skills/start/SKILL.md
units:
  - id: start.t1
    kind: trigger
    text: "description: Human onboarding: README Quick Start, dev task backlog (/tasks), gates, verification. Requires filling documentation/DOC_APP_VISION.md (problem, persona, app role) before fork/clone unless user defers. Use for first-time setup and /start-style requests."
  - id: start.i1
    kind: instruction
    text: "start: Guide a new user through first-time setup of this boilerplate by following the README flow end-to-end, working through the dev task backlog, validating each step, and only moving forward when each gate passes."
  - id: start.i2
    kind: instruction
    text: "Section heading: Core behavior"
  - id: start.i3
    kind: instruction
    text: "Core behavior: - Be careful, explicit, and beginner-friendly. - Follow the Quick Start flow from `README.md` in order. - Use the **dev task backlog** (`src/config/app-tasks.json`, UI at `/tasks` via DevTasksFab in local dev) as the onboarding checklist. - Validate every step before proceeding. - Never claim setup is complete without user confirmation and successful verification checks. - If a step requires a web interface or account action the assistant cannot do itself (GitHub, Supabase dashboard, browser auth prompts, settings pages, etc.), clearly hand it to the user with exact click-by-..."
  - id: start.i4
    kind: instruction
    text: "Template repo vs fork (read first): **Working on this boilerplate template** (improving the starter itself — not building an app from a fork):"
  - id: start.i5
    kind: instruction
    text: "Template repo vs fork (read first): **Working on a fork** (someone cloned this to build their own app): full backlog applies — Supabase, hosting, vision **`ACTIVE`**, etc."
  - id: start.i6
    kind: instruction
    text: "Template repo vs fork (read first): - **Skip Supabase (task #1)** and **Cloudflare hosting (task #2)**. No project, no Workers Builds link, no `.env` required for most template work. The app runs locally without auth configured. - **Skip Airtable (task #4)** unless you are testing that integration. - **App vision (task #3):** may stay **`DRAFT`** while exploring or contributing to the template; do not block template PRs on it unless the change is product-facing. - **Still do:** prerequisites, branch workflow (`feature/*` → `develop`), `pnpm dev`, and the verification checklist (§ Mandatory ..."
  - id: start.i7
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): 1. Configure Supabase"
  - id: start.i8
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): 2. Put your app online (Cloudflare hosting)"
  - id: start.i9
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): 3. Define app vision (`documentation/DOC_APP_VISION.md`)"
  - id: start.i10
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): 4. Configure Airtable (optional)"
  - id: start.i11
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): 5. Configure Theme"
  - id: start.i12
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): **Agent task sync (this skill + router + finish):**"
  - id: start.i13
    kind: instruction
    text: "Dev task backlog (onboarding SSOT): Fresh clones ship five pre-seeded tasks in priority order: - At session start: read `src/config/app-tasks.json`; set relevant task `in-progress` when picking up onboarding work. - After completing a step: archive completed tasks (move to `app-tasks-archive.json`) or update descriptions (e.g. note Airtable skipped). - Checks: Supabase env vars present; hosting configured per README; vision doc `ACTIVE`; optional Airtable/theme as applicable. - **Conflict:** `/tasks` UI disk-wins — reconcile with user edits; do not fight pending UI state. Configuration is v..."
  - id: start.i14
    kind: instruction
    text: "Section heading: 1) Prerequisites gate"
  - id: start.i15
    kind: instruction
    text: "1) Prerequisites gate: Run these commands first and inspect output: Required versions: - Node.js 20+ - pnpm 9.15.4+ - Git If versions are missing/too low: - Stop and do not continue setup - Provide install or upgrade instructions for the user's OS - Re-run the version-check commands until all pass Only continue when all three checks pass."
  - id: start.i16
    kind: instruction
    text: "Section heading: 2) App vision & goals gate (mandatory before fork/clone and setup)"
  - id: start.i17
    kind: instruction
    text: "2) App vision & goals gate (mandatory before fork/clone and setup): **Template repo:** skip this gate unless the user is preparing a fork or the work changes user-facing product behavior. Record in chat that vision can stay **`DRAFT`** for template-only work."
  - id: start.i18
    kind: instruction
    text: "2) App vision & goals gate (mandatory before fork/clone and setup): **Fork / app onboarding:** This fork's **product SSOT** is `documentation/DOC_APP_VISION.md` (problem statement, user persona, app's role)."
  - id: start.i19
    kind: instruction
    text: "2) App vision & goals gate (mandatory before fork/clone and setup): - Read that file **now**. - If the vision line still shows **`DRAFT`** (per the status callout at the top), **stop forward progress** on onboarding until task #3 (Define app vision) is addressed: walk the user through filling each section in their own words. Use the placeholders only as prompts; they must be **replaced** with real prose, then set the status token to **`ACTIVE`** on that same line. - **Do not** continue to **Fork + clone** (next gate) until either: - the vision status is **`ACTIVE`**, or - the user **explici..."
  - id: start.i20
    kind: instruction
    text: "Section heading: 3) Line endings gate (mandatory on Windows too)"
  - id: start.i21
    kind: instruction
    text: "3) Line endings gate (mandatory on Windows too): Guide user to set LF line endings: - VS Code/Cursor setting `files.eol` -> `\n` - Git: `git config core.autocrlf false` Verify by asking user to confirm they changed both."
  - id: start.i22
    kind: instruction
    text: "Section heading: 4) Fork + clone gate"
  - id: start.i23
    kind: instruction
    text: "4) Fork + clone gate: 1. Fork on GitHub"
  - id: start.i24
    kind: instruction
    text: "4) Fork + clone gate: 2. Clone their fork"
  - id: start.i25
    kind: instruction
    text: "4) Fork + clone gate: 3. `pnpm install`"
  - id: start.i26
    kind: instruction
    text: "4) Fork + clone gate: Guide user through README Option B: If assistant cannot perform the fork UI step, instruct user exactly what to click in GitHub and wait for confirmation before continuing."
  - id: start.i27
    kind: instruction
    text: "Section heading: 5) Branch workflow gate"
  - id: start.i28
    kind: instruction
    text: "5) Branch workflow gate: This repo uses **Model A** (`develop` staging + ff-only promotion to `main`). On a **fork**, create `develop` from `main` once (`git push origin main:develop`) and configure both branch rulesets. All work happens on short-lived `feature/*` branches off `develop`: Guide the user to configure GitHub rulesets (detail SSOT: `.cursor/rules/workflow/RULE.md` § Branch Protection and § Promote to production): - **`develop` protection:** PR required, `test` status check, squash merge, deletion + non-fast-forward. - **`main` protection:** **deletion + non-fast-forward only** ..."
  - id: start.i29
    kind: instruction
    text: "Section heading: 6) Dev server gate"
  - id: start.i30
    kind: instruction
    text: "6) Dev server gate: Run: Confirm app is reachable at the shown localhost URL. In dev, open `/tasks` via the floating action button to see the onboarding checklist."
  - id: start.i31
    kind: instruction
    text: "Section heading: 7) Configuration tasks gate (work through backlog)"
  - id: start.i32
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **Template repo:** skip tasks #1 (Supabase), #2 (Cloudflare), and #4 (Airtable) unless explicitly testing those paths. Archive or leave them `to-do`; do not treat missing `.env` as a failure."
  - id: start.i33
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **Fork onboarding:** walk through backlog tasks in order (skip or archive optional items the user declines):"
  - id: start.i34
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **Supabase (task #1):**"
  - id: start.i35
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **Hosting (task #2 — Put your app online):** Follow the **Agent one-shot brief** in `documentation/DOC_CLOUDFLARE_WORKERS.md`; the task description in `src/config/app-tasks.json` is the plain-language summary. Fork must add `account_id`/custom domain; template intentionally omits them."
  - id: start.i36
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **App vision (task #3):** Collaborate on `DOC_APP_VISION.md`; set status to **`ACTIVE`**."
  - id: start.i37
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **Airtable (task #4, optional):** Add `VITE_AIRTABLE_*` to `.env` or archive/skip with note."
  - id: start.i38
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): **Theme (task #5):** Customize `src/shared/theme/` or skip if defaults suffice."
  - id: start.i39
    kind: instruction
    text: "7) Configuration tasks gate (work through backlog): - If assistant cannot perform dashboard actions, instruct user exactly: - Open Supabase project - Go to Project Settings -> API - Copy Project URL + Publishable Key - Guide user to create `.env` in project root with `VITE_SUPABASE_*` vars (see README). - Remind user to restart dev server after `.env` changes. - For **Sign in with Google**, use **`documentation/DOC_SUPABASE_GOOGLE_OAUTH.md` as the SSOT**. Update `app-tasks.json` as each step completes."
  - id: start.i40
    kind: instruction
    text: "Section heading: 8) Route verification gate"
  - id: start.i41
    kind: instruction
    text: "8) Route verification gate: Verify routes from README: - `/` - `/tasks` (dev only, via FAB) - `/login` (when Supabase configured) If a route fails, troubleshoot before continuing."
  - id: start.i42
    kind: instruction
    text: "9) Physical device testing (optional): If the user needs mobile layout or mobile OAuth on local dev, link **`documentation/DOC_MOBILE_LOCAL_DEV.md`** (SSOT). Do not duplicate adb or redirect steps here."
  - id: start.i43
    kind: instruction
    text: "Mandatory verification checklist (\"test for everything\"): Run and verify all relevant checks: If any check fails: - Stop and fix in smallest safe steps - Re-run failed check(s) - Re-run full checklist before final confirmation"
  - id: start.i44
    kind: instruction
    text: "Communication rules during start: - Use short steps and numbered instructions. - After each gate, explicitly ask user for confirmation. - For any manual web-interface action, provide: - where to go - what to click - what value to copy/paste - what outcome to expect - Do not skip gates even if user is experienced, unless user explicitly asks to skip **or** context is **template repo** work (see § Template repo vs fork)."
  - id: start.i45
    kind: instruction
    text: "Completion criteria: **Template repo:** verification checklist passes and user confirms they are ready — Supabase/Cloudflare/vision **`ACTIVE`** not required."
  - id: start.i46
    kind: instruction
    text: "Completion criteria: **Fork / app onboarding:**"
  - id: start.i47
    kind: instruction
    text: "Completion criteria: 1. **`documentation/DOC_APP_VISION.md`** is **`ACTIVE`** (or user explicitly deferred with reason recorded)"
  - id: start.i48
    kind: instruction
    text: "Completion criteria: 2. User confirms configuration tasks they wanted are done (backlog archived or updated)"
  - id: start.i49
    kind: instruction
    text: "Completion criteria: 3. Route checks pass"
  - id: start.i50
    kind: instruction
    text: "Completion criteria: 4. Verification checklist passes"
  - id: start.i51
    kind: instruction
    text: "Completion criteria: 5. User confirms they are ready to proceed"
  - id: start.i52
    kind: instruction
    text: "Completion criteria: Only consider onboarding complete when: ---"
  - id: start.i53
    kind: instruction
    text: "Section heading: Boundaries"
  - id: start.c1
    kind: table
    text: "Boundaries — header: | Not `start` | Use instead | (4 row lines)"
  - id: start.i54
    kind: instruction
    text: "Boundaries: **App vision procedure SSOT:** § App vision in this skill; content SSOT: `documentation/DOC_APP_VISION.md`."
  - id: start.i55
    kind: instruction
    text: "Boundaries: **Onboarding checklist SSOT:** `src/config/app-tasks.json` + `src/features/tasks/README.md`."
  - id: start.i56
    kind: instruction
    text: "Boundaries: **Next:** Onboarding complete → **`prime`** for agent context; feature work → **`plan`** or **`feature`** per router gates."

skill: validate
file: .agents/skills/validate/SKILL.md
units:
  - id: validate.t1
    kind: trigger
    text: "description: Validates a plan or an implementation via parallel read-only rule-shaped audits, then synthesizes findings before any fixes. Auto-selects depth: plan review, full implementation review (rules + tooling + plan-compliance), or a lighter pre-merge architecture gate. Use when validating a plan/implementation, before merge/finish, or after large refactors."
  - id: validate.i1
    kind: instruction
    text: "validate: **Critical:** Validation does **not** edit anything in the audit/report steps. First synthesize and report, ask the user, then optionally act."
  - id: validate.i2
    kind: instruction
    text: "validate: **Mode is auto-selected — no user input required.** The agent picks depth from context (see § Mode auto-selection). The user may still force a mode by wording (e.g. \"just a quick architecture gate\", \"full validation\")."
  - id: validate.i3
    kind: instruction
    text: "validate: Validate either (1) a **plan document**, (2) the **implementation** of an executed plan, or (3) the **structural health** of a scope/diff before merge — via a **parallel rule-shaped audit**: one read-only subagent per relevant rule in `.cursor/rules/`, plus tooling and plan-compliance passes when an implementation is in scope. Synthesize findings, surface unresolved ambiguity, then report. ---"
  - id: validate.i4
    kind: instruction
    text: "Section heading: Mode auto-selection"
  - id: validate.i5
    kind: instruction
    text: "Mode auto-selection: Pick the mode from context. Resolve top-down; first match wins."
  - id: validate.c1
    kind: table
    text: "Mode auto-selection — header: | Signal in context | Mode | What runs | (5 row lines)"
  - id: validate.i6
    kind: instruction
    text: "Mode auto-selection: **Disambiguation cues:**"
  - id: validate.i7
    kind: instruction
    text: "Mode auto-selection: - **plan-review vs impl-full** — is there code to audit yet? No code → plan-review. Code exists for the plan → impl-full. - **impl-full vs gate** — is there a `DEVELOPMENT_PLAN.md` whose phases/gates this scope must match? Yes → impl-full (adds plan-compliance). No plan, just \"is this structurally sound before I merge?\" → gate. - **When ambiguous between impl-full and gate, prefer impl-full** (superset; plan-compliance returns `applicable:false` cheaply if no plan is found). State the chosen mode in one line at the top of the report (e.g. `Mode: gate — pre-merge archite..."
  - id: validate.i8
    kind: instruction
    text: "Section heading: Mode rule sets"
  - id: validate.c2
    kind: table
    text: "Mode rule sets — header: | Mode | Always-spawn rule subagents | Conditional subagents | Plan-compliance | (5 row lines)"
  - id: validate.i9
    kind: instruction
    text: "Mode rule sets: Err toward inclusion in all modes — `applicable: false` is cheap. ---"
  - id: validate.i10
    kind: instruction
    text: "Input & scope: **Plan location:** `documentation/jobs/temp_job_<name>/DEVELOPMENT_PLAN.md`"
  - id: validate.i11
    kind: instruction
    text: "Input & scope: **Scope:**"
  - id: validate.i12
    kind: instruction
    text: "Input & scope: - User states what to validate (e.g. \"validate the plan\", \"validate the implementation\", \"check before merge\"). Mode is inferred per § Mode auto-selection. - **Context-based:** infer the job from job name, open file, or recent discussion. - If ambiguous which `temp_job_<name>/` applies, **stop** and ask. - **plan-review** — the plan path. - **impl-full / gate** — explicit files/feature/branch if named; otherwise recent changes (`git diff --name-only` or `--cached`). If unclear, ask."
  - id: validate.i13
    kind: instruction
    text: "Section heading: Branch verification (impl-full / gate)"
  - id: validate.i14
    kind: instruction
    text: "Branch verification (impl-full / gate): Verify not on `main` or `develop`. If on either, **stop** — instruct `git switch develop` + `git pull origin develop`, then `git switch -c feature/<name>` (see `.cursor/rules/workflow/RULE.md` § Branch Strategy). ---"
  - id: validate.i15
    kind: instruction
    text: "Subagent contract: **Allowed reads:** the rule file, the scope, and configs the rule itself references (e.g. `projectStructure.config.cjs`, `.dependency-cruiser.cjs`, `ARCHITECTURE.md`, `documentation/DOC_TANSTACK_QUERY.md`, `documentation/DOC_FEATURE_LOCAL_README.md`, `documentation/DOC_APP_VISION.md`). Do **not** read other rule files; cross-rule overlap is handled by the parent."
  - id: validate.i16
    kind: instruction
    text: "Subagent contract: **Output schema (required):**"
  - id: validate.i17
    kind: instruction
    text: "Subagent contract: **Standards diversion** — any deviation from industry standards, framework best practices, or established repo conventions becomes a finding with `ambiguity: \"user-question-needed\"` and a concrete question."
  - id: validate.i18
    kind: instruction
    text: "Subagent contract: **Applicability:** spawn a subagent for every rule plausibly relevant to the scope. Err toward inclusion — `applicable: false` is cheap and explicit."
  - id: validate.i19
    kind: instruction
    text: "Subagent contract: Every rule subagent is invoked the same way. The parent calls `Task` with `subagent_type: explore` and `readonly: true`, passing: - **Mode** — `plan-review`, `impl-full`, or `gate`. - **Scope** — plan path for plan review; changed paths or unified diff otherwise. - **Rule file** — exactly one (e.g. `.cursor/rules/architecture/RULE.md`). - **Output schema** — every subagent returns the structure below. If the rule does not apply to the scope, return `{ \"applicable\": false, \"findings\": [] }`. If the subagent fails, return the same shape with an additional `\"error\"` field de..."
  - id: validate.i20
    kind: instruction
    text: "Section heading: Tooling pass (impl-full and gate)"
  - id: validate.i21
    kind: instruction
    text: "Tooling pass (impl-full and gate): **impl-full (full list):**"
  - id: validate.i22
    kind: instruction
    text: "Tooling pass (impl-full and gate): **gate (lighter list):**"
  - id: validate.i23
    kind: instruction
    text: "Tooling pass (impl-full and gate): The parent runs these directly, in parallel with the subagent fan-out (deterministic shell, no value in delegating). Summarize failures only. - `pnpm validate:structure` - `pnpm validate:feature-size` - `pnpm validate:feature-docs:strict` - `pnpm lint` - `pnpm type-check` - `pnpm arch:check` - `pnpm test:run` — when the change touches tested logic or the plan requires tests - `pnpm format:check` — optional, if style drift is in scope - `pnpm validate:structure` - `pnpm validate:feature-size` - `pnpm lint` - `pnpm type-check` - `pnpm arch:check` - `pnpm tes..."
  - id: validate.i24
    kind: instruction
    text: "Plan-compliance subagent (impl-full only): **Plan-compliance is intentionally excluded from `gate`.** Use impl-full when you need the plan-vs-code comparison."
  - id: validate.i25
    kind: instruction
    text: "Plan-compliance subagent (impl-full only): One additional read-only subagent compares the code against `DEVELOPMENT_PLAN.md`: - Phases marked done vs actual code. - Gates implied by the plan vs reality. - Feature `README.md` content alignment the plan required (`pnpm validate:feature-docs:strict` covers presence; this covers content). Same output schema, with `rule: \"plan-compliance\"`. ---"
  - id: validate.i26
    kind: instruction
    text: "Flow: 1. **Determine mode** (§ Mode auto-selection) and state it in the report header."
  - id: validate.i27
    kind: instruction
    text: "Flow: 2. **Compute scope** — plan path for plan review; `git diff` paths / unified diff otherwise. Run branch verification for impl-full / gate."
  - id: validate.i28
    kind: instruction
    text: "Flow: 3. **Fan out in parallel:**"
  - id: validate.i29
    kind: instruction
    text: "Flow: 4. **Aggregate** when everything returns."
  - id: validate.i30
    kind: instruction
    text: "Flow: 5. **Synthesize:**"
  - id: validate.i31
    kind: instruction
    text: "Flow: 6. **Ambiguity gate** — collect every finding with `ambiguity: \"user-question-needed\"` and ask all questions in **one batch** before the report. Record answers alongside the affected findings."
  - id: validate.i32
    kind: instruction
    text: "Flow: 7. **Report** — see format below. No edits in this step."
  - id: validate.i33
    kind: instruction
    text: "Flow: 8. **Ask:** \"What should I do with these findings — fix all, specific items, or nothing?\" Wait for the user."
  - id: validate.i34
    kind: instruction
    text: "Flow: 9. **Optionally act** — only if the user requests fixes; apply changes (plan markdown and/or source) while still following `.cursor/rules/` and the structure whitelist. Changelog remains the responsibility of `.agents/skills/finish/SKILL.md` unless the user explicitly includes it."
  - id: validate.i35
    kind: instruction
    text: "Flow: **Next:**"
  - id: validate.i36
    kind: instruction
    text: "Flow: - One subagent per applicable rule in `.cursor/rules/` (rule set per § Mode rule sets). - impl-full / gate: also run the tooling pass. impl-full: also run the plan-compliance subagent. - Deduplicate findings that overlap across rules (e.g. file-placement and architecture flagging the same path). - Group by category, sort by severity. - Surface any subagent that returned an `error` as **\"not audited — rerun recommended\"** rather than silently dropping it. - **impl-full / gate, no blockers (or user waived):** offer **`.agents/skills/finish/SKILL.md`** when the user wants to commit. - **..."
  - id: validate.i37
    kind: instruction
    text: "Report format: Open the report with: **Mode**, total findings, counts by severity, and any rules listed as **not audited**. Group findings by category (Architecture, File placement, Code style, … — plus Tooling, and Plan vs code in impl-full). For each finding: - **Finding** — what is wrong, missing, or risky - **Suggestion** — concrete improvement - **Rule** — `.cursor/rules/<name>/RULE.md` § section - **Severity** — Blocker | Warning | Suggestion - **Source** — `file:line` for impl/gate, plan section for plan review - **Ambiguity answer** — when the finding had a `user-question-needed` fl..."
  - id: validate.c3
    kind: table
    text: "Report format — header: | Severity | Meaning | (5 row lines)"
  - id: validate.i38
    kind: instruction
    text: "Rules reference (subagent registry): Spawn one subagent per applicable rule. Registry SSOT: [`.cursor/rules/INDEX.md`](../../../.cursor/rules/INDEX.md) and [`.agents/skills/plan/references/rules-registry.md`](../plan/references/rules-registry.md). Other rule files in `.cursor/rules/` (e.g. `debugging/`, `cloud-functions/`, `project-specific/`) are spawned when the scope touches them. ---"
  - id: validate.c4
    kind: table
    text: "Not in scope (use other skills) — header: | Topic | Use instead | (6 row lines)"
  - id: validate.i39
    kind: instruction
    text: "Not in scope (use other skills): For Complexity **M/L** plans, run **`review-dev-plan`** before implementation when the plan requires it; **`validate`** does not replace industry-precedent review. ---"
  - id: validate.i40
