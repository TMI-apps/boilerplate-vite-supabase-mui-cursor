  - id: improve-skill-library.ref.i2
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Section heading: Phase 0 — Registry"
  - id: improve-skill-library.ref.i3
    kind: instruction
