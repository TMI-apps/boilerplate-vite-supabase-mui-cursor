    text: "Section heading: Phase 5: Architecture Compliance (For Refactoring)"
  - id: optimize2.i127
    kind: instruction
    text: "Phase 5: Architecture Compliance (For Refactoring): **⚠️ All code extractions during refactoring MUST comply with architecture rules.**"
  - id: optimize2.i128
    kind: instruction
    text: "Code Placement (Layer Rules): When extracting code, place in correct layer: - **Pure calculation/logic?** → Extract to `@/utils/` (no React lifecycle) - **API/data fetching?** → Extract to `@/services/` (business logic) - **React lifecycle needed?** → Extract to `@/hooks/` (orchestration layer) - **UI component?** → Keep in `@/components/` (but extract logic to hooks/services) - **Never extract from components directly to services** - use hooks as bridge if React state/effects needed"
  - id: optimize2.i129
    kind: instruction
    text: "Path Aliases (REQUIRED): - **Always use path aliases** (`@/utils/`, `@/services/`, `@/hooks/`) - NEVER relative parent imports (`../`) - Example: `import { calculatePrice } from '@/utils/pricing'` ✅ - Example: `import { calculatePrice } from '../../utils/pricing'` ❌"
  - id: optimize2.i130
    kind: instruction
    text: "Folder Structure: - **Prefer existing folders** when extracting code - **If new folder needed:** Update `projectStructure.config.cjs` FIRST - **Never create unauthorized folders** - ESLint will error - **Validate structure:** Run `pnpm validate:structure` to verify folder structure compliance"
  - id: optimize2.i131
    kind: instruction
    text: "Import Direction (Downward Only): - `pages` → `components` → `hooks` → `services` → `utils` → `types` - **Never create upward imports** (e.g., hooks cannot import from components)"
  - id: optimize2.i132
    kind: instruction
    text: "Architecture Checklist: - [ ] Code placed in correct layer"
