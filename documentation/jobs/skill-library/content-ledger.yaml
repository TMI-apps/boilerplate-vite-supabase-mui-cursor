  - id: optimize2.i35
    kind: instruction
    text: "Level 3: Efficiency Review: **Possible outcomes:**"
  - id: optimize2.i36
    kind: instruction
    text: "Level 3: Efficiency Review: Assuming approach is sound, evaluate runtime efficiency: - Missing `useMemo`/`useCallback` causing re-renders? - Unnecessary re-renders from unstable references? - Large component trees re-rendering unnecessarily? - Missing React.memo on expensive child components? - N+1 query problems? - Missing caching strategies? - Duplicate API calls? - Fetching more data than needed? - Missing cleanup in useEffect? - Event listener leaks? - Large objects retained unnecessarily? - Subscriptions not unsubscribed? - Large dependencies that could be smaller? - Missing code split..."
