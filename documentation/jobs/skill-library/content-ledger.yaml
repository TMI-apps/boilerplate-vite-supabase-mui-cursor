  - id: feature.i47
    kind: instruction
    text: "2.1.1 User Journey & State Transition Mapping (MANDATORY): - What triggers each transition? - Where does user go after each action? - What happens on errors during transitions? - Entry → Feature → Exit - Error recovery paths - Back/forward navigation behavior - What happens if user navigates away mid-action? - What happens if session expires during feature use? - What happens on logout/logout from different states? - What happens if user loses network connectivity? - What happens if user refreshes page mid-flow? - Authentication state changes - Other features that might trigger navigation -..."
