  - id: feature.i159
    kind: instruction
    text: "Key Principles: - **MANDATORY:** Stop at every 🔴 decision point - Present questions clearly and wait for explicit user response - Document all user answers before proceeding - Never skip decision points or assume answers - User journey mapping (2.1.1) is mandatory before implementation - Ambiguity must be cleared with app-usage or product-vision questions before planning proceeds ---"
  - id: feature.i160
    kind: instruction
    text: "Problem This Strategy Alleviates: Prevents: - \"Assistant adds features without analyzing existing code\" - \"Doesn't seek simpler alternatives\" - \"Ignores rules\" - \"Makes subjective choices without user input\" - \"Asks user about things already established in codebase\" - **\"Continues coding without stopping at decision points\"** - **\"Doesn't map user journeys, causing broken navigation flows\"** - **\"Implements features without gathering required user input\"** Ensures: - Systematic analysis - Simplification-first approach - Leveraging existing functionality even for new implementations - Follow..."
