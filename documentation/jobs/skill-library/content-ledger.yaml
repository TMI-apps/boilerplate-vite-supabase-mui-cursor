    kind: instruction
    text: "Decision Point Enforcement: 5. Only then proceed to next step"
  - id: feature.i167
    kind: instruction
    text: "Decision Point Enforcement: **Violating this process is a critical failure.** If you find yourself coding past a 🔴 marker without user input, you have made an error."
