    kind: instruction
    text: "Priority Scoring: Higher-level issues get priority because fixing them may eliminate lower-level issues. - High churn (>10 commits/month) suggests problematic code - High dependencies (>5 files) means changes have wide impact - Critical path code (used in hot paths) gets higher priority - User-facing code gets higher priority than internal utilities ---"
