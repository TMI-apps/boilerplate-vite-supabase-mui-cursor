    text: "2.5 Decision Point Matrix: Identify **subjective** choices requiring user input. - Choices where NO codebase precedent exists - Business logic decisions (what should happen) - Feature scope decisions - New interaction patterns not yet in app - Risk/complexity tradeoffs - **User journey decisions** (where users go after actions, error recovery paths) - Choices where codebase standards already exist - Design system elements (spacing, colors, typography, shadows) - Component patterns already used in app - State management patterns already established - Error handling patterns already establish..."
