    text: "When to run — header: | Situation | Mode | (7 row lines)"
  - id: pattern-review.i8
    kind: instruction
    text: "Section heading: Procedure"
  - id: pattern-review.i9
    kind: instruction
    text: "Procedure: 1. Read [`references/rubric.md`](references/rubric.md)."
  - id: pattern-review.i10
    kind: instruction
    text: "Procedure: 2. Gather context: plan path, proposal, or changed scope."
  - id: pattern-review.i11
    kind: instruction
    text: "Procedure: 3. **Classify** the capability; **pick precedents**; **select dimensions** that matter for this change (agent judgment — not a fixed checklist)."
  - id: pattern-review.i12
    kind: instruction
    text: "Procedure: 4. If review is **not needed** (trivial / no new behavioral contract) → one short paragraph and stop."
  - id: pattern-review.i13
    kind: instruction
    text: "Procedure: 5. If **aligned** or **acceptable product-specific** with documented tradeoffs → short summary; proceed under normal gates."
  - id: pattern-review.i14
    kind: instruction
    text: "Procedure: 6. If **non-standard** → post alert from [`references/alert-template.md`](references/alert-template.md); **stop** until owner decides."
  - id: pattern-review.i15
    kind: instruction
    text: "Procedure: 7. For `plan-section`, record in `DEVELOPMENT_PLAN.md` § **Pattern & precedent**."
  - id: pattern-review.i16
    kind: instruction
    text: "Section heading: Modes"
  - id: pattern-review.i17
    kind: instruction
    text: "`scan` (default): Full lens: precedents → chosen aspects → verdict → alert if needed."
  - id: pattern-review.i18
    kind: instruction
    text: "`plan-section`: Write § **Pattern & precedent** in the plan (see template)."
  - id: pattern-review.i19
    kind: instruction
    text: "`lite`: Rubric § Lite pass; escalate to full alert if material divergence. ---"
  - id: pattern-review.c3
    kind: table
    text: "Integration — header: | Caller | How | (7 row lines)"
  - id: pattern-review.i20
    kind: instruction
    text: "Output (chat): If non-standard, include **Pattern risk** block, then: ---"
  - id: pattern-review.i21
    kind: instruction
    text: "Related: - [`review-dev-plan`](../review-dev-plan/SKILL.md) - [`plan`](../plan/SKILL.md) - [`validate`](../validate/SKILL.md)"
  - id: pattern-review.l1
    kind: link
    text: "`references/rubric.md` -> references/rubric.md"
