  - id: feature.i77
    kind: instruction
    text: "3.2 Cloud Functions Planning (if backend needed): - [ ] Use decision framework (`cloud-functions/RULE.md`): security, secrets, testability"
  - id: feature.i78
    kind: instruction
    text: "3.2 Cloud Functions Planning (if backend needed): - [ ] Decide: Edge Function vs frontend logic"
