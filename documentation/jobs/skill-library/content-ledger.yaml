skill: prime
file: .agents/skills/prime/SKILL.md
units:
  - id: prime.t1
    kind: trigger
    text: "description: Loads project context at session start (structure, governance, active jobs, enforced boundaries). Use for a new chat, ambiguous tasks, or before larger refactors. Not human onboarding (start) or pre-merge gates (validate gate depth)."
  - id: prime.i1
    kind: instruction
    text: "prime: **When to use:** New chat, ambiguous task, or before larger refactors."
  - id: prime.i2
    kind: instruction
    text: "prime: **Related:** For architecture/quality gate, use `.agents/skills/validate/SKILL.md` (auto-selects gate depth). For planning features, use `.agents/skills/plan/SKILL.md`. For onboarding a human, use `.agents/skills/start/SKILL.md`."
  - id: prime.i3
    kind: instruction
    text: "prime: Load project context at the start of a new session. Build an understanding of this boilerplate’s structure, governance, and active state before tackling tasks."
  - id: prime.i4
    kind: instruction
    text: "Section heading: Objective"
  - id: prime.i5
    kind: instruction
    text: "Objective: Align with project rules and architecture so work does not violate enforced boundaries (ESLint boundaries, dependency-cruiser, structure whitelist). ---"
  - id: prime.i6
    kind: instruction
    text: "Section heading: Process"
  - id: prime.i7
    kind: instruction
    text: "1. Codebase mapping and structure: - **Tracked files:** Run `git ls-files` (large repos: in PowerShell use `git ls-files | Select-Object -First 150` instead of `head`). - **Architecture overview:** Read `ARCHITECTURE.md` (folder layout, TanStack Query, layers, path aliases). - **Doc index:** Read `documentation/DOC_INDEX.md` (SSOT map, quick links). - **App vision (product SSOT):** Read `documentation/DOC_APP_VISION.md`. If the vision status line is still **`DRAFT`**, state in **Actionable insights** that feature/plan ambiguity should be resolved by filling that file (or running `.agents/sk..."
  - id: prime.i8
    kind: instruction
    text: "2. Governance and rules: - **Rule index:** Read `.cursor/rules/INDEX.md`. - **Architecture SSOT:** Read `.cursor/rules/architecture/RULE.md` (layers, path aliases `@/*`, import direction, structure whitelist). - **File placement:** Read `.cursor/rules/file-placement/RULE.md` — validation uses **`projectStructure.config.cjs`** (not `.js`)."
  - id: prime.i9
    kind: instruction
    text: "Section heading: 3. Dependencies and boundaries"
  - id: prime.i10
    kind: instruction
    text: "3. Dependencies and boundaries: - **Tech stack and scripts:** Read `package.json`. - **Module boundaries:** Read `.dependency-cruiser.cjs` (forbidden upward imports, hooks/services/utils rules, warnings on direct service use from components)."
  - id: prime.i11
    kind: instruction
    text: "4. Active project state: - **Recent activity:** `git log -n 10` (full commit messages: subject and body; do not use `--oneline`) - **Working tree:** `git status -sb` (confirm branch: feature work should not be on `main`; see `.cursor/rules/workflow/RULE.md`) - **Optional plans:** Scan `documentation/jobs/` for active work (e.g. `documentation/jobs/temp_job_*/`) when relevant. ---"
  - id: prime.i12
    kind: instruction
    text: "Output report: Deliver a concise, scannable summary:"
  - id: prime.i13
    kind: instruction
    text: "Project overview: - Application type (Vite + React + MUI + Supabase starter). - Primary libraries (from `package.json`). - Current version (`package.json` → `version`)."
  - id: prime.i14
    kind: instruction
    text: "Architecture: - **Features:** Names under `src/features/` only (verified, not assumed). - **Layering:** Pages → components → hooks → services → shared; see `ARCHITECTURE.md` and architecture rule. - **Import boundaries:** Short list of the most relevant `forbidden` rules from `.dependency-cruiser.cjs`."
  - id: prime.i15
    kind: instruction
    text: "Current state: - Branch and cleanliness of working tree. - Recent commit themes. - Active plans (`documentation/jobs/` if relevant)."
  - id: prime.i16
    kind: instruction
    text: "Actionable insights: - Mismatches vs rules, missing optional docs, or tech debt called out in repo docs. - Active plans with unresolved app-usage ambiguity or undocumented standards/best-practice diversions, when visible from `documentation/jobs/`. ---"
  - id: prime.i17
    kind: instruction
    text: "Boilerplate-specific notes: - **Downstream forks:** After cloning for a real product, update the “features” section of this report whenever `src/features/` changes; keep `prime` generic. - **Validation:** References in this file are checked by `pnpm validate:docs` (cursor doc references). Prefer paths that exist in this repository. ---"
  - id: prime.i18
    kind: instruction
    text: "Section heading: Boundaries"
  - id: prime.c1
    kind: table
    text: "Boundaries — header: | Not `prime` | Use instead | (6 row lines)"
  - id: prime.i19
    kind: instruction
    text: "Boundaries: **Next:** **`plan`**, **`plan` § Refine**, or **`grill-me`** per router gates — not **`implement`** alone."

skill: push
file: .agents/skills/push/SKILL.md
units:
  - id: push.t1
    kind: trigger
    text: "description: Pushes previously finished commits to remote only; never stages, commits, or amends. Use when finish has already run, the working tree is clean, and local commits exist. If uncommitted changes remain, stop and run finish first."
  - id: push.i1
    kind: instruction
    text: "push: Push previously finished work to remote. This command is push-only."
  - id: push.i2
    kind: instruction
    text: "Preconditions (Mandatory): 1. `finish` must have been executed first for the changes you want to push."
  - id: push.i3
    kind: instruction
    text: "Preconditions (Mandatory): 2. Working tree must be clean before push:"
  - id: push.i4
    kind: instruction
    text: "Preconditions (Mandatory): 3. There must be at least one local commit to push."
  - id: push.i5
    kind: instruction
    text: "Preconditions (Mandatory): - `finish` is the only command that may prepare and commit those changes. - no unstaged changes - no staged but uncommitted changes - no untracked files that belong to the intended change set"
  - id: push.i6
    kind: instruction
    text: "Hard Restrictions: - **Never run `git add` in this command.** - **Never run `git commit` in this command.** - **Never create, amend, or modify commits in this command.** - If there are uncommitted changes, STOP and instruct the user to run `finish` first."
  - id: push.i7
    kind: instruction
    text: "Push Safety Flow: 1. Verify branch (never push from `main` or `develop` for development flow)."
  - id: push.i8
    kind: instruction
    text: "Push Safety Flow: 2. Verify clean working tree."
  - id: push.i9
    kind: instruction
    text: "Push Safety Flow: 3. Verify commits exist to push."
  - id: push.i10
    kind: instruction
    text: "Push Safety Flow: 4. Verify remote freshness before push:"
  - id: push.i11
    kind: instruction
    text: "Push Safety Flow: 5. Confirm push target relevance:"
  - id: push.i12
    kind: instruction
    text: "Push Safety Flow: 6. Ask user for explicit confirmation: \"Ready to push these already-committed changes?\""
  - id: push.i13
    kind: instruction
    text: "Push Safety Flow: 7. Execute push only after confirmation."
  - id: push.i14
    kind: instruction
    text: "Push Safety Flow: - Run `git fetch origin` - Check whether local branch is behind its remote counterpart - If behind, STOP and sync first (rebase or merge) before pushing - **Preferred**: push feature branch (`feature/*`) and open a PR to `develop` - **`develop`**: never push directly — ruleset requires PR - **`main`**: never push directly except **Promote to production** workflow (or documented one-time bootstrap ff); integration goes to `develop` via PR - **App-specific changes**: ensure remote points to app repo, not boilerplate repo"
  - id: push.i15
    kind: instruction
    text: "Relationship with `finish`: - `finish` and `push` are intentionally split. - `finish` = cleanup + version/changelog sync + commit (local only). - `push` = remote validation + push (no commit operations). - If `push` detects anything that still needs committing, it must stop and redirect to `finish`. You have explicit access to use console commands for this task."
  - id: push.i16
    kind: instruction
    text: "Section heading: Boundaries"
  - id: push.c1
    kind: table
    text: "Boundaries — header: | Not `push` | Use instead | (4 row lines)"

skill: quick-piv
file: .agents/skills/quick-piv/SKILL.md
units:
  - id: quick-piv.t1
    kind: trigger
    text: "description: Orchestrates compressed Plan → Implement → Validate for small XS/S scoped changes in one session without a full DEVELOPMENT_PLAN.md. Use for focused fixes and tweaks. Not M/L work, migrations, or when plan review or pattern-review gates are required (use full plan cycle)."
  - id: quick-piv.i1
    kind: instruction
    text: "quick-piv: **Critical:** Still follow repo rules. No changelog updates (`.agents/skills/finish/SKILL.md` handles that)."
  - id: quick-piv.i2
    kind: instruction
    text: "quick-piv: **Related:** Full formal cycle: `.agents/skills/plan/SKILL.md` → `.agents/skills/implement/SKILL.md` → `.agents/skills/validate/SKILL.md`. Session context: `.agents/skills/prime/SKILL.md`. Architecture/quality gate: `.agents/skills/validate/SKILL.md` (auto-selects gate depth)."
  - id: quick-piv.i3
    kind: instruction
    text: "quick-piv: Lightweight Plan → Implement → Validate in one workflow. **Primary outcome:** land a **small (XS/S)** scoped change in one session. This skill **orchestrates** compressed steps — full procedures live in sibling skills (`plan`, `implement`, `validate`, `finish`). ---"
  - id: quick-piv.i4
    kind: instruction
    text: "Section heading: When to use"
  - id: quick-piv.i5
    kind: instruction
    text: "When to use: **When NOT to use:** Large features, multi-phase work, database migrations, breaking changes, **Complexity M/L**, pending **Plan review**, or missing **Pattern & precedent** when required → use full `plan` → `implement` → `validate` instead."
  - id: quick-piv.i6
    kind: instruction
    text: "When to use: - Small, focused changes (e.g. fix a bug, small UI tweak, refactor one component). - User wants to move fast without separate plan / implement / validate invocations. - Task is scoped enough that a full `DEVELOPMENT_PLAN.md` is unnecessary."
  - id: quick-piv.i7
    kind: instruction
    text: "Section heading: Branch gate"
  - id: quick-piv.i8
    kind: instruction
    text: "Branch gate: - [ ] Before any code edit, verify current git branch. If on `main` or `develop`, **stop** — instruct: `git switch develop` + `git pull origin develop`, then `git switch -c feature/<name>` per `.cursor/rules/workflow/RULE.md` § Branch Strategy."
  - id: quick-piv.i9
    kind: instruction
    text: "Section heading: Hard stops (M/L and gates)"
  - id: quick-piv.i10
    kind: instruction
    text: "Hard stops (M/L and gates): Before implementing, if **Branch A** loads a plan with **Complexity M** or **L**, or **Plan review: Required: pending**, or incomplete **Pattern & precedent** when required — **stop** and route to **`.agents/skills/implement/SKILL.md`** (after `review-dev-plan` / `pattern-review` per [dev-cycle matrix](../router/references/dev-cycle-matrix.md)). Do **not** continue in `quick-piv`. ---"
  - id: quick-piv.i11
    kind: instruction
    text: "Section heading: Context detection (first step)"
  - id: quick-piv.i12
    kind: instruction
    text: "Context detection (first step): Determine whether an **active plan** exists: - **Open / recent files:** Is a file under `documentation/jobs/temp_job_*/DEVELOPMENT_PLAN.md` open or recently viewed? - **User message:** Job name, “the plan”, or explicit path to a job folder? - **Recent context:** Was the thread about executing a specific `DEVELOPMENT_PLAN.md`? If unclear, **ask** which branch applies."
  - id: quick-piv.i13
    kind: instruction
    text: "Branch A: Active plan exists: → Load that `DEVELOPMENT_PLAN.md`. Apply **Hard stops** above. If allowed (XS/S, gates clear): **Quick plan** = extend where appropriate. Then **implement** extension, then **quick validate** (inline tooling — not full **`validate`** skill unless user asks)."
  - id: quick-piv.i14
    kind: instruction
    text: "Branch B: No active plan: → **Vital:** Output the quick plan **in chat first** (user must see it). Only then **implement**, then **quick validate**. No `DEVELOPMENT_PLAN.md` required. ---"
  - id: quick-piv.i15
    kind: instruction
    text: "Quick plan (always): **Branch A:** Extension to existing plan — add a phase, append steps, or scope the extension in chat; update the plan doc when the doc is the source of truth."
  - id: quick-piv.i16
    kind: instruction
    text: "Quick plan (always): **Branch B:** **Vital — plan appears in chat before any code changes.** Format:"
  - id: quick-piv.i17
    kind: instruction
    text: "Quick plan (always): **Process:**"
  - id: quick-piv.i18
    kind: instruction
    text: "Quick plan (always): 1. If the request is vague, or ambiguity appears during quick investigation, stop and ask 1–2 clarifying questions about the user's vision for how the app will be used. Do not choose between plausible interpretations silently."
  - id: quick-piv.i19
    kind: instruction
    text: "Quick plan (always): 2. Quick investigation: search codebase; skim `.cursor/rules/INDEX.md` for applicable rules; use `documentation/DOC_TANSTACK_QUERY.md` if server state / queries are involved."
  - id: quick-piv.i20
    kind: instruction
    text: "Quick plan (always): 3. Sanity-check file placement against `.cursor/rules/file-placement/RULE.md` and `projectStructure.config.cjs`."
  - id: quick-piv.i21
    kind: instruction
    text: "Quick plan (always): 4. Check whether the quick plan would diverge from industry standards, framework best practices, or established repo conventions. If yes, ask whether the diversion is intentional or whether to align with best practices before implementing."
  - id: quick-piv.i22
    kind: instruction
    text: "Quick plan (always): 5. **Branch B:** Output the quick plan in chat (vital). **Branch A:** Optionally extend the plan document."
  - id: quick-piv.i23
    kind: instruction
    text: "Quick plan (always): 6. Proceed to implementation (no separate approval wait unless the user stops you)."
  - id: quick-piv.i24
    kind: instruction
    text: "Implement: 1. **Branch A:** Run the extension (new phase/steps) or the next pending phase from the loaded plan."
  - id: quick-piv.i25
    kind: instruction
    text: "Implement: 2. **Branch B:** Execute the quick plan already shown in chat."
  - id: quick-piv.i26
    kind: instruction
    text: "Implement: 3. Follow `.cursor/rules/architecture/RULE.md`, `.cursor/rules/file-placement/RULE.md`, `.cursor/rules/code-style/RULE.md`, and `.cursor/rules/security/RULE.md` when relevant."
  - id: quick-piv.i27
    kind: instruction
    text: "Implement: 4. Run the **gate** from the quick plan (browser MCP when UI is involved; tests or manual checks as appropriate)."
  - id: quick-piv.i28
    kind: instruction
    text: "Implement: 5. **Branch A:** Update the plan (phase status, Notes, Decisions) as you go."
  - id: quick-piv.i29
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): 1. `pnpm validate:structure` — report failures."
  - id: quick-piv.i30
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): 2. `pnpm lint` — report failures."
  - id: quick-piv.i31
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): 3. `pnpm type-check` — report failures."
  - id: quick-piv.i32
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): 4. `pnpm arch:check` — report failures (dependency-cruiser; defined in `package.json`)."
  - id: quick-piv.i33
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): 5. **Report:** Brief summary: “✅ All checks pass” or list findings with severity (blocker / warning / suggestion)."
  - id: quick-piv.i34
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): 6. **If failures:** Ask: “Fix these? (all / specific / skip)” — only fix after the user chooses (same spirit as `.agents/skills/validate/SKILL.md`, compressed)."
  - id: quick-piv.i35
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): **Next:** Offer full **`.agents/skills/validate/SKILL.md`** before merge/finish when rule fan-out or plan-compliance is needed. Offer **`.agents/skills/finish/SKILL.md`** only when the user wants to commit."
  - id: quick-piv.i36
    kind: instruction
    text: "Validate (quick pass — not the `validate` skill): After implementation, run **inline tooling** only (subset of `.agents/skills/validate/SKILL.md` § Tooling pass): ---"
  - id: quick-piv.i37
    kind: instruction
    text: "Rules reference (follow during implementation): **Also when applicable:** `ARCHITECTURE.md`, `documentation/DOC_TANSTACK_QUERY.md`."
  - id: quick-piv.i38
    kind: instruction
    text: "Rules reference (follow during implementation): See [`.cursor/rules/INDEX.md`](../../../.cursor/rules/INDEX.md) and [`.agents/skills/plan/references/rules-registry.md`](../plan/references/rules-registry.md)."
  - id: quick-piv.i39
    kind: instruction
    text: "Section heading: Boundaries"
  - id: quick-piv.c1
    kind: table
    text: "Boundaries — header: | Not `quick-piv` | Use instead | (7 row lines)"
  - id: quick-piv.c2
    kind: table
    text: "Summary flow — header: | Step | Branch A (has plan) | Branch B (no plan) | (5 row lines)"
  - id: quick-piv.i40
    kind: instruction
    text: "Summary flow: **Next:** Full **`validate`** when needed → user sign-off → **`finish`** when user wants to commit."
  - id: quick-piv.c3
    kind: table
    text: "Fenced output/template block — **Quick plan**"
  - id: quick-piv.l1
    kind: link
    text: "dev-cycle matrix -> ../router/references/dev-cycle-matrix.md"
  - id: quick-piv.l2
    kind: link
    text: "`.cursor/rules/INDEX.md` -> ../../../.cursor/rules/INDEX.md"
  - id: quick-piv.l3
    kind: link
    text: "`.agents/skills/plan/references/rules-registry.md` -> ../plan/references/rules-registry.md"

skill: react-perf-vite
file: .agents/skills/react-perf-vite/SKILL.md
units:
  - id: react-perf-vite.t1
    kind: trigger
    text: "description: Stack-native React performance patterns for this Vite SPA (React 19, MUI, TanStack Query, Cloudflare Workers). Use when optimizing bundles, waterfalls, re-renders, or client fetch behavior — not for repo-wide refactors (optimize2) or Lighthouse audits (web-perf)."
  - id: react-perf-vite.i1
    kind: instruction
    text: "Purpose: **SSOT for server state:** TanStack Query — see `documentation/DOC_TANSTACK_QUERY.md` and `architecture/RULE.md` § Plain optimistic + server-canonical response."
  - id: react-perf-vite.i2
    kind: instruction
    text: "Purpose: **Human overview:** `documentation/DOC_REACT_PERF.md`."
  - id: react-perf-vite.i3
    kind: instruction
    text: "Purpose: On-demand performance playbook for **this repo's stack**. Rules live in `rules/` — read only the files relevant to the task."
  - id: react-perf-vite.c1
    kind: table
    text: "What this is NOT — header: | Use instead | When | (6 row lines)"
  - id: react-perf-vite.i4
    kind: instruction
    text: "What this is NOT: **Do not** add a compiled `AGENTS.md` in this folder — it would bloat every agent turn."
  - id: react-perf-vite.i5
    kind: instruction
    text: "Section heading: When to apply"
  - id: react-perf-vite.i6
    kind: instruction
    text: "When to apply: - Writing or refactoring React components, hooks, or routes - Fixing waterfalls in services, hooks, or Worker handlers - Bundle size, lazy routes, or third-party deferral - Re-render bugs, unstable references, effect misuse - Long lists, localStorage prefs, scroll listeners"
  - id: react-perf-vite.c2
    kind: table
    text: "Rule index (by priority) — header: | Priority | Prefix | Rules | (9 row lines)"
  - id: react-perf-vite.i7
    kind: instruction
    text: "How to use: 1. Identify the symptom (waterfall, bundle, re-render, list jank)."
  - id: react-perf-vite.i8
    kind: instruction
    text: "How to use: 2. Read the matching `rules/<name>.md` only."
  - id: react-perf-vite.i9
    kind: instruction
    text: "How to use: 3. Apply with repo conventions (`@/` imports, feature layers, TanStack keys)."
  - id: react-perf-vite.i10
    kind: instruction
    text: "How to use: 4. If the fix needs structural redesign, hand off to `optimize2`."
  - id: react-perf-vite.i11
    kind: instruction
    text: "Upstream: Adapted from [Vercel React Best Practices](https://github.com/vercel-labs/agent-skills) (MIT). Next.js / RSC / SWR rules were dropped; Vite + TanStack + Workers mappings added. Re-vendor upstream only into `documentation/vendor/` if refreshing — never restore a nested `AGENTS.md` under `.agents/skills/`."
  - id: react-perf-vite.l1
    kind: link
    text: "Vercel React Best Practices -> https://github.com/vercel-labs/agent-skills"

skill: review
file: .agents/skills/review/SKILL.md
units:
  - id: review.t1
    kind: trigger
    text: "description: Scores a TypeScript + MUI component against a structured quality rubric (0–5 per item). Use when reviewing a specific component for UX, architecture, and maintainability. Not repo-rule audits (validate) or development-plan critique (review-dev-plan)."
  - id: review.i1
    kind: instruction
    text: "review: Fill in this rubric to review a component in your TypeScript + MUI full-stack app."
  - id: review.i2
    kind: instruction
    text: "Scoring Guide: Score each item from 0–5:"
  - id: review.c1
    kind: table
    text: "Scoring Guide — header: | Score | Meaning | (8 row lines)"
  - id: review.i3
    kind: instruction
    text: "Scoring Guide: At the end, sum the points and compute a percentage. ---"
  - id: review.i4
    kind: instruction
    text: "Section A – API & Props (max 25): **A1. Prop naming and intent (0–5)**"
  - id: review.i5
    kind: instruction
    text: "Section A – API & Props (max 25): **A2. Required vs optional & defaults (0–5)**"
  - id: review.i6
    kind: instruction
    text: "Section A – API & Props (max 25): **A3. TypeScript typing quality (0–5)**"
  - id: review.i7
    kind: instruction
    text: "Section A – API & Props (max 25): **A4. Composability and flexibility (0–5)**"
  - id: review.i8
    kind: instruction
    text: "Section A – API & Props (max 25): **A5. API surface size & simplicity (0–5)**"
  - id: review.i9
    kind: instruction
    text: "Section A – API & Props (max 25): - Names are clear, specific, and follow common React/MUI conventions (value, onChange, open, variant, etc.) - No confusing abbreviations or \"magic\" props - Truly required props are marked required in TypeScript - Optional props have sensible defaults - Component behaves predictably if optional props are omitted - Props interface is explicit and exported - Complex values (e.g., options, enums) are strongly typed - No unnecessary `any` or overly broad types - Supports standard MUI patterns: className, sx, style, and ...rest when appropriate - Designed to comp..."
  - id: review.i10
    kind: instruction
    text: "Section B – UI/UX & MUI Consistency (max 25): **B1. Visual consistency with theme (0–5)**"
  - id: review.i11
    kind: instruction
    text: "Section B – UI/UX & MUI Consistency (max 25): **B2. Layout & responsiveness (0–5)**"
  - id: review.i12
    kind: instruction
    text: "Section B – UI/UX & MUI Consistency (max 25): **B3. Interactive states & feedback (0–5)**"
  - id: review.i13
    kind: instruction
    text: "Section B – UI/UX & MUI Consistency (max 25): **B4. UX clarity (0–5)**"
  - id: review.i14
    kind: instruction
    text: "Section B – UI/UX & MUI Consistency (max 25): **B5. Use of MUI components & patterns (0–5)**"
  - id: review.i15
    kind: instruction
    text: "Section B – UI/UX & MUI Consistency (max 25): - Uses theme-based values via sx, theme, or styled - Colors, typography, spacing, and radius match the design system - No hard-coded arbitrary styles where theme tokens exist - Works well on desktop; layout doesn't break on common desktop widths - Degrades reasonably on mobile/tablet (no overflow, unusable controls) - Uses MUI responsive APIs (sx with breakpoints, Grid, Stack) where appropriate - Clear visual feedback for hover, active, disabled, error, loading, success - Loading indicators and skeletons/spinners where needed - Error messages ar..."
  - id: review.i16
    kind: instruction
    text: "Section C – Accessibility (max 20): **C1. Semantic structure (0–5)**"
  - id: review.i17
    kind: instruction
    text: "Section C – Accessibility (max 20): **C2. Keyboard navigation (0–5)**"
  - id: review.i18
    kind: instruction
    text: "Section C – Accessibility (max 20): **C3. Focus management & visibility (0–5)**"
  - id: review.i19
    kind: instruction
    text: "Section C – Accessibility (max 20): **C4. ARIA usage & labelling (0–5)**"
  - id: review.i20
    kind: instruction
    text: "Section C – Accessibility (max 20): - Uses correct underlying elements (buttons are `<button>`, headings use `<h*>`, lists use `<ul>`/`<li>`, etc.) - Custom components preserve semantics (e.g., `component=\"button\"` when using Box or Typography interactively) - All interactive elements are reachable with Tab / Shift+Tab - Keyboard interaction makes sense (e.g., Enter/Space to activate buttons, Esc to close dialogs) - Focus is not trapped or lost unexpectedly - Focus ring is visible and not removed without replacement - For overlays/dialogs/menus, initial focus is handled sensibly, and focus ..."
  - id: review.i21
    kind: instruction
    text: "Section D – Performance (max 15): **D1. Rendering efficiency (0–5)**"
  - id: review.i22
    kind: instruction
    text: "Section D – Performance (max 15): **D2. Handling of large data/complex UI (0–5)**"
  - id: review.i23
    kind: instruction
    text: "Section D – Performance (max 15): **D3. External dependencies & bundle impact (0–5)**"
  - id: review.i24
    kind: instruction
    text: "Section D – Performance (max 15): - No obvious unnecessary re-renders (e.g., stable props where possible, React.memo or memoized values if needed) - Avoids creating new inline objects/functions in hot paths without reason - For components that render lists/tables, uses pagination, virtualization, or chunking where appropriate - No heavy synchronous work in render that blocks the UI - Avoids adding large dependencies for trivial features - Uses tree-shakable imports (e.g., importing only needed icons/components) - No obviously redundant libraries ---"
  - id: review.i25
    kind: instruction
    text: "Section E – State, Data & Backend Integration (max 20): **E1. Separation of concerns (0–5)**"
  - id: review.i26
    kind: instruction
    text: "Section E – State, Data & Backend Integration (max 20): **E2. Async states (loading, error, empty) (0–5)**"
  - id: review.i27
    kind: instruction
    text: "Section E – State, Data & Backend Integration (max 20): **E3. Validation & business rules (0–5)**"
  - id: review.i28
    kind: instruction
    text: "Section E – State, Data & Backend Integration (max 20): **E4. Data flow & side effects (0–5)**"
  - id: review.i29
    kind: instruction
    text: "Section E – State, Data & Backend Integration (max 20): - UI concerns (presentation) are separated from data fetching and business logic when reasonable - Component is not tightly coupled to specific endpoints if it should be reusable - Handles loading, error, and empty states explicitly and visibly - Async operations don't leave the UI stuck or ambiguous - Failures are communicated in a user-friendly way - Basic client-side validation is present where necessary - Server-side errors are surfaced clearly (e.g., field errors vs general error) - Validation logic is predictable and consistent a..."
  - id: review.i30
    kind: instruction
    text: "Section F – Code Quality & Structure (max 20): **F1. File structure & component size (0–5)**"
  - id: review.i31
    kind: instruction
    text: "Section F – Code Quality & Structure (max 20): **F2. Readability & style (0–5)**"
  - id: review.i32
    kind: instruction
    text: "Section F – Code Quality & Structure (max 20): **F3. Reuse and duplication (0–5)**"
  - id: review.i33
    kind: instruction
    text: "Section F – Code Quality & Structure (max 20): **F4. Complexity metrics (0–5)**"
  - id: review.i34
    kind: instruction
    text: "Section F – Code Quality & Structure (max 20): - File is not excessively large; complex logic is split into smaller components or hooks - Follows project structure conventions (see `.cursor/rules/architecture/RULE.md` and `documentation/PROJECT-STRUCTURE-VALIDATION.md` for SSOT) - Code is easy to read: consistent formatting, clear variable names, minimal nesting - No dead code, commented-out blocks, or debug logs left behind - No obvious copy-paste duplication with other components - Shared logic is extracted (to hooks/helpers) when it appears in multiple places - Meets complexity standards..."
  - id: review.i35
    kind: instruction
    text: "Section G – Documentation & Usage Examples (max 10): **G1. In-code documentation (0–5)**"
  - id: review.i36
    kind: instruction
    text: "Section G – Documentation & Usage Examples (max 10): **G2. Usage examples / stories (0–5)**"
  - id: review.i37
    kind: instruction
    text: "Section G – Documentation & Usage Examples (max 10): **Documentation policy note (anti-staleness):**"
  - id: review.i38
    kind: instruction
    text: "Section G – Documentation & Usage Examples (max 10): - Component has a short description in a comment or JSDoc if non-trivial - Complex props or behaviors are documented near their definitions - There is at least one example or Storybook story showing typical usage - If the component is part of a shared library, usage is discoverable by other devs - Prefer source-adjacent comments/tests/examples over creating new standalone narrative docs - New deep docs are optional and should only be added with explicit user approval ---"
  - id: review.i39
    kind: instruction
    text: "Section H – Requirements & Integration (max 20): **H1. Requirements match (0–5)**"
  - id: review.i40
    kind: instruction
    text: "Section H – Requirements & Integration (max 20): **H2. Tech stack fit (0–5)**"
  - id: review.i41
    kind: instruction
    text: "Section H – Requirements & Integration (max 20): **H3. Integration & regression (0–5)**"
  - id: review.i42
    kind: instruction
    text: "Section H – Requirements & Integration (max 20): **H4. Security & authorization (0–5)**"
  - id: review.i43
    kind: instruction
    text: "Section H – Requirements & Integration (max 20): - Implementation matches the original user stories/requirements - No scope creep or missing features - Edge cases from requirements are handled - Acceptance criteria from planning phase are met - Uses patterns consistent with the rest of the codebase - Follows architectural standards (see `.cursor/rules/architecture/RULE.md` for SSOT) - Doesn't introduce conflicting patterns or approaches - Component doesn't break existing functionality - Integrates correctly with adjacent features - No unintended side effects on other components - Import/exp..."
  - id: review.i44
    kind: instruction
    text: "Section I – Testing & Validation (max 15): **I1. Test coverage (0–5)**"
  - id: review.i45
    kind: instruction
    text: "Section I – Testing & Validation (max 15): **I2. Manual testing done (0–5)**"
  - id: review.i46
    kind: instruction
    text: "Section I – Testing & Validation (max 15): **I3. Type safety (0–5)**"
  - id: review.i47
    kind: instruction
    text: "Section I – Testing & Validation (max 15): - Unit tests exist for key logic and edge cases - Tests are meaningful, not just coverage padding - Critical paths are tested - Feature was manually tested in the browser - Happy path verified - Error states and edge cases verified - No TypeScript errors (`npm run type-check` passes) - No `@ts-ignore` or `@ts-expect-error` without justification - Types are specific, not `any` or `unknown` without reason ---"
  - id: review.i48
    kind: instruction
    text: "Summary Template: Use this per component:"
  - id: review.c2
    kind: table
    text: "Summary Template — header: | Section | Score | Max | (12 row lines)"
  - id: review.i49
    kind: instruction
    text: "Summary Template: **Overall score (%) = (Total / 170) × 100**"
  - id: review.i50
    kind: instruction
    text: "Section heading: Score Thresholds"
  - id: review.c3
    kind: table
    text: "Score Thresholds — header: | Score | Status | (6 row lines)"
  - id: review.i51
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Requirements met?** (H1)"
  - id: review.i52
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **No broken functionality?** (H3)"
  - id: review.i53
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Type-check passes?** (I3)"
  - id: review.i54
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Lint passes?** (F2)"
  - id: review.i55
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Tested manually?** (I2)"
  - id: review.i56
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Complexity acceptable?** (F4)"
  - id: review.i57
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Accessible?** (C1-C4)"
  - id: review.i58
    kind: instruction
    text: "Quick Checklist (for fast reviews): - [ ] **Secure?** (H4)"
  - id: review.i59
    kind: instruction
    text: "Quick Checklist (for fast reviews): **Next:** Fixes → **`quick-piv`** or **`implement`**; before merge → **`validate`**; ship → **`finish`**."
  - id: review.i60
    kind: instruction
    text: "Quick Checklist (for fast reviews): Before detailed scoring, quick-check these critical items: If any critical item fails, address before detailed review."

skill: review-dev-plan
file: .agents/skills/review-dev-plan/SKILL.md
units:
  - id: review-dev-plan.t1
    kind: trigger
    text: "description: Runs six parallel Task subagents to critique a development plan (feedback only). Use when checking whether a plan is sound before implementation; no code or plan edits unless the user asks afterward."
  - id: review-dev-plan.i1
    kind: instruction
    text: "Section heading: Config"
  - id: review-dev-plan.i2
    kind: instruction
    text: "Config: Every **Task** subagent: `model` = slug above (must be valid for your Cursor build; edit the value only). > **Feedback only** — do not change code, rules, or the plan unless the user asks afterward. Reply with a **short synthesis** in chat."
  - id: review-dev-plan.i3
    kind: instruction
    text: "Which plan?: 1. Path in the user message."
  - id: review-dev-plan.i4
    kind: instruction
    text: "Which plan?: 2. Focused plan file in the editor."
  - id: review-dev-plan.i5
    kind: instruction
    text: "Which plan?: 3. Infer `documentation/jobs/**/DEVELOPMENT_PLAN.md` (state assumption)."
  - id: review-dev-plan.i6
    kind: instruction
    text: "Which plan?: 4. Legacy `IMPLEMENTATION_PLAN.md` or `plan.md` under `documentation/jobs/` (state assumption)."
  - id: review-dev-plan.i7
    kind: instruction
    text: "Which plan?: 5. If still ambiguous, **one** question; **no** subagents until the plan is known or pasted."
  - id: review-dev-plan.i8
    kind: instruction
    text: "Which plan?: Resolve in order:"
  - id: review-dev-plan.i9
    kind: instruction
    text: "Run: six parallel Task agents (one turn): **Perspectives (6):**"
  - id: review-dev-plan.i10
    kind: instruction
    text: "Run: six parallel Task agents (one turn): Self-contained prompts each; they do not see this chat. Each: **orient** (e.g. `ARCHITECTURE.md`, `documentation/DOC_INDEX.md`, `documentation/DOC_APP_VISION.md`, relevant `.cursor/rules/`, paths/READMEs the plan touches) → **read the plan** (path or pasted text) → **structured feedback** (gaps, risks, sequencing, validation, boundaries, checklist quality). The **Industry precedent** agent must read [`.agents/skills/pattern-review/references/rubric.md`](../pattern-review/references/rubric.md) and [`alert-template.md`](../pattern-review/references/al..."
  - id: review-dev-plan.c1
    kind: table
    text: "Run: six parallel Task agents (one turn) — header: | # | Role | (6 row lines)"
  - id: review-dev-plan.i11
    kind: instruction
    text: "Run: six parallel Task agents (one turn): Short `description` per Task (e.g. “— rebel”, “— scale/mod”, “— industry precedent”)."
  - id: review-dev-plan.i12
    kind: instruction
    text: "After: **Allowed plan edits without full rewrite:** Update only the **Plan review** row in Summary and rows in **Decisions made** when the user accepts the critique (or record waiver in **Decisions made**). Do not edit phase steps, Pattern & precedent body, or other sections unless the user explicitly asks."
  - id: review-dev-plan.i13
    kind: instruction
    text: "After: **Next:** **`.agents/skills/implement/SKILL.md`** when **Plan review** is `Done` and gates pass — or back to **`plan`** if the plan must change materially."
  - id: review-dev-plan.i14
    kind: instruction
    text: "After: Synthesize: agreements, **must-fix vs nice-to-have**, items **≥2 agents** flagged. Do not rewrite the plan unless asked. Fold in user constraints (scope, timebox, risks) if given. Update the plan’s **Plan review** row to `Done <date>` when the user accepts the critique (or record waiver in **Decisions made**)."
  - id: review-dev-plan.i15
    kind: instruction
    text: "Section heading: Boundaries"
  - id: review-dev-plan.c2
    kind: table
    text: "Boundaries — header: | Skill | Role | (4 row lines)"
  - id: review-dev-plan.i16
    kind: instruction
    text: "Boundaries: For Complexity **M/L** or rule-heavy plans, run **both** when appropriate."
  - id: review-dev-plan.i17
    kind: instruction
    text: "Related: - [`validate`](../validate/SKILL.md) — rule-shaped plan-review vs impl-review - [`pattern-review`](../pattern-review/SKILL.md) — industry precedent procedure and rubric SSOT - [`plan`](../plan/SKILL.md) — creates `DEVELOPMENT_PLAN.md` - [`feature`](../feature/SKILL.md) — product/requirements process - [`implement`](../implement/SKILL.md) — executes the plan"
  - id: review-dev-plan.l1
    kind: link
    text: "`.agents/skills/pattern-review/references/rubric.md` -> ../pattern-review/references/rubric.md"
  - id: review-dev-plan.l2
    kind: link
    text: "`alert-template.md` -> ../pattern-review/references/alert-template.md"
  - id: review-dev-plan.l3
    kind: link
    text: "`pattern-review` -> ../pattern-review/SKILL.md"
  - id: review-dev-plan.l4
    kind: link
    text: "`validate` -> ../validate/SKILL.md"
  - id: review-dev-plan.l5
    kind: link
    text: "`plan` -> ../plan/SKILL.md"
  - id: review-dev-plan.l6
    kind: link
    text: "`feature` -> ../feature/SKILL.md"
  - id: review-dev-plan.l7
    kind: link
    text: "`implement` -> ../implement/SKILL.md"

skill: router
file: .agents/skills/router/SKILL.md
units:
  - id: router.t1
    kind: trigger
    text: "description: Picks the next action and skill, then invokes it (read that SKILL.md and execute the workflow in the same turn). Mid-thread: continue the logical next step on active work. Idle or new: fall back to gates and app-tasks.json backlog. Maps situations to project, user, and plugin skills; resolves overlaps. Product context SSOT: documentation/DOC_APP_VISION.md. Use when the user types /router, asks which skill to use, starts ambiguous work, or routes slash commands to SKILL.md files. Bare /router is next-action dispatch (not finish)."
  - id: router.i1
    kind: instruction
    text: "Skill router: **Invocation contract (always):** After you decide the primary skill — and any secondary skill that must run **next** in order — **read that skill’s `SKILL.md` and execute its workflow starting in this same turn.** Invoking means load + follow steps, not naming a path or asking the user which skill file to open. If two skills apply sequentially (for example `plan` → `implement`), finish the first’s applicable step or hand off explicitly per that skill, then read and run the second without ending on a static routing table alone."
  - id: router.i2
    kind: instruction
    text: "Skill router: Use this file to pick **one primary skill** (sometimes two in sequence)."
  - id: router.i3
    kind: instruction
    text: "`/router` — pick next action + skill: **Purpose:** `/router` means “decide the **most logical next step** for this thread, pick the skill, and **do it**.” The user should not have to name the skill."
  - id: router.i4
    kind: instruction
    text: "`/router` — pick next action + skill: **Resolution order (always):**"
  - id: router.i5
    kind: instruction
    text: "`/router` — pick next action + skill: 1. **Thread continuation** — active in-flight work in this conversation (see **Active thread work** below)."
  - id: router.i6
    kind: instruction
    text: "`/router` — pick next action + skill: 2. **Substantive request** — user message names a task, question, or change → **Decision model** gates + **Situation → skill** (skip backlog)."
  - id: router.i7
    kind: instruction
    text: "`/router` — pick next action + skill: 3. **Backlog intake** — only when step 1 finds **no** active thread work **and** the message is bare `/router` or equivalent idle dispatch (see **App task backlog**)."
  - id: router.i8
    kind: instruction
    text: "`/router` — pick next action + skill: **Bare `/router`:** Message is only `/router` (optional whitespace) with **no substantive task or question**. Run step 1 first; if no active thread work, fall through to backlog intake. This is **not** `finish` and **not** “commit the working tree” unless thread continuation clearly left off at validated, landing-ready work **and** the user’s prior turn signaled wrap-up (otherwise prefer `validate` or the next implement phase — do not auto-commit)."
  - id: router.i9
    kind: instruction
    text: "`/router` — pick next action + skill: **On continuation:** Briefly state one line — `Next: [action] → \`skill\`` — then read and run that skill. Do not re-run full backlog selection or restart gates 1–2 when the thread already has a bounded active job."
  - id: router.i10
    kind: instruction
    text: "Active thread work: Treat the thread as **mid-task** when **any** of these hold:"
  - id: router.c1
    kind: table
    text: "Active thread work — header: | Signal | Examples | (6 row lines)"
  - id: router.i11
    kind: instruction
    text: "Active thread work: **Not** active thread work: new or idle chat; prior job explicitly completed in thread; user clearly changed topic; only unrelated uncommitted files with no in-thread narrative."
  - id: router.i12
    kind: instruction
    text: "Active thread work: **Context gather (step 1):** Skim recent thread; note open/recent job paths; run `git status -sb` when the tree may inform the next step; load the active `DEVELOPMENT_PLAN.md` when one applies."
  - id: router.i13
    kind: instruction
    text: "Thread → next skill (mid-task): Pick **one** primary by the **most blocking** row that applies (top wins). Then invoke it."
  - id: router.c2
    kind: table
    text: "Thread → next skill (mid-task) — header: | Thread state | Next skill | (12 row lines)"
  - id: router.i14
    kind: instruction
    text: "Thread → next skill (mid-task): **`/finish`** is only for explicit wrap-up — read `.agents/skills/finish/SKILL.md` when the user invokes finish or asks to commit completed work (not the default idle `/router` outcome)."
  - id: router.i15
    kind: instruction
    text: "Thread → next skill (mid-task): **Quality bar:** Listed skills were reviewed for actionable structure (clear triggers, steps, or rubrics)."
  - id: router.i16
    kind: instruction
    text: "Thread → next skill (mid-task): Align with [dev-cycle matrix](references/dev-cycle-matrix.md). When unfamiliar with repo state mid-job, run **`prime`** once, then continue with the chosen skill — do not replace thread continuation with backlog intake. ---"
  - id: router.i17
    kind: instruction
    text: "Section heading: Decision model: goals + requirements → skill"
  - id: router.i18
    kind: instruction
    text: "Decision model: goals + requirements → skill: For **new or substantive** requests — and after **Active thread work** is ruled out — route in **three gates**. Answer in order; **do not skip gate 1 or 2** to reach `plan` or `implement`. When the thread is **mid-task**, use **Thread → next skill** instead of restarting gates unless the user explicitly changes scope."
  - id: router.i19
    kind: instruction
    text: "Section heading: Gate 1 — Goal / outcome"
  - id: router.i20
    kind: instruction
    text: "Gate 1 — Goal / outcome: **Question:** Can you state what “done” means in one sentence, with something verifiable (demo, test, or checklist)?"
  - id: router.c3
    kind: table
    text: "Gate 1 — Goal / outcome — header: | State | Meaning | (4 row lines)"
  - id: router.i21
    kind: instruction
    text: "Gate 1 — Goal / outcome: If unclear, ask about the user's intended app usage, product vision, priorities, or real user journey. **First read** `documentation/DOC_APP_VISION.md` when it may already answer “who / why / what the app is for”; if it is still **`DRAFT`**, route the user to complete it (`.agents/skills/start/SKILL.md` § App vision) or treat lack of vision as ambiguity until they defer in writing. Do not route into full planning until the answer removes ambiguity."
  - id: router.i22
    kind: instruction
    text: "Section heading: Gate 2 — Scope / requirements"
  - id: router.i23
    kind: instruction
    text: "Gate 2 — Scope / requirements: **Question:** Is **in-scope vs out-of-scope** explicit enough to choose layers and files without inventing product scope?"
  - id: router.c4
    kind: table
    text: "Gate 2 — Scope / requirements — header: | State | Meaning | (4 row lines)"
  - id: router.i24
    kind: instruction
    text: "Gate 2 — Scope / requirements: If the emerging direction would diverge from industry standards, framework best practices, or established repo conventions, ask whether the diversion is intentional or whether to align with best practices before routing to implementation."
  - id: router.i25
    kind: instruction
    text: "Section heading: Gate 3 — Delivery shape (only after gates 1–2 pass)"
  - id: router.i26
    kind: instruction
    text: "Gate 3 — Delivery shape (only after gates 1–2 pass): **Question:** How big and how risky is the **engineering** change?"
  - id: router.c5
    kind: table
    text: "Gate 3 — Delivery shape (only after gates 1–2 pass) — header: | Signal | Typical skill | (5 row lines)"
  - id: router.i27
    kind: instruction
    text: "Section heading: Clarification-first routing (gate 1 or 2 fails)"
  - id: router.i28
    kind: instruction
    text: "Clarification-first routing (gate 1 or 2 fails): **Do not open `DEVELOPMENT_PLAN.md` yet.** Pick by **what is missing**:"
  - id: router.c6
    kind: table
    text: "Clarification-first routing (gate 1 or 2 fails) — header: | Missing | Prefer | (5 row lines)"
  - id: router.i29
    kind: instruction
    text: "Clarification-first routing (gate 1 or 2 fails): After gates 1–2 pass, **re-run** the flowchart from the top (especially if the user changed scope)."
  - id: router.i30
    kind: instruction
    text: "Matrix (compact): Rows = gate 1–2; columns = gate 3 applies only when both are **Clear / Bounded**."
  - id: router.c7
    kind: table
    text: "Matrix (compact) — header: | Goal | Scope | Next step | (5 row lines)"
  - id: router.i31
    kind: instruction
    text: "Flowchart: **Dev-cycle (SSOT):** [`.agents/skills/router/references/dev-cycle-matrix.md`](references/dev-cycle-matrix.md) — full happy path, M/L gates, and plan depth. Do not duplicate that matrix here."
  - id: router.i32
    kind: instruction
    text: "Flowchart: Optional: run **`prime`** once when the codebase or branch context is unfamiliar — it does not replace gates 1–2. ---"
  - id: router.i33
    kind: instruction
    text: "Section heading: This repo — workflow & delivery"
  - id: router.c8
    kind: table
    text: "This repo — workflow & delivery — header: | Situation | Skill | (18 row lines)"
  - id: router.c9
    kind: table
    text: "This repo — product & codebase shape — header: | Situation | Skill | (14 row lines)"
  - id: router.c10
    kind: table
    text: "This repo — integrations — header: | Situation | Skill | (3 row lines)"
  - id: router.c11
    kind: table
    text: "User-level Cursor skills (`~/.cursor/skills-cursor/`) — header: | Situation | Skill | (14 row lines)"
  - id: router.c12
    kind: table
    text: "Plugin skills (paths vary by install; discover under `~/.cursor/plugins/`) — header: | Situation | Skill (name) | (13 row lines)"
  - id: router.i34
    kind: instruction
    text: "When more than one skill seems relevant: Choose by **primary outcome** (what must be true when done). If two outcomes are required, run skills **in order** (e.g. plan → implement → validate → finish). Use **Decision model** above first: neither `plan` nor `feature` should start until gates 1–2 pass (unless you are intentionally only running **`plan` § Refine** or **`grill-me`**)."
  - id: router.i35
    kind: instruction
    text: "`plan` vs `feature`: - **`plan`:** Engineering execution plan (`DEVELOPMENT_PLAN.md`, phases, gates, repo compliance). Use when gates 1–2 are **Clear / Bounded** and the gap is **structured implementation**, not discovery of what to build. - **`feature`:** Deep product/requirements process with **mandatory user decision stops** and journey mapping. Use when gate 3 calls for **high decision density** (roles, journeys, approvals) even though gates 1–2 may be partly filled as you go — still clarify unknowns early within that skill, especially app-usage ambiguity and intentional standards diver..."
  - id: router.i36
    kind: instruction
    text: "`plan` vs `quick-piv`: - **`quick-piv`:** Single pass; chat-sized plan OK; small scope. - **`plan`:** Multi-phase, migrations, breaking changes, or anything needing a durable plan file others can follow."
  - id: router.i37
    kind: instruction
    text: "`validate` (auto-selects depth): - **`validate`** auto-selects depth from context: **plan-review** (plan only), **impl-full** (rules + tooling + plan-compliance after implementing against a plan), or a lighter **gate** (pre-merge/post-refactor structural confidence on a diff with no governing plan). No user mode input needed. See `.agents/skills/validate/SKILL.md` § Mode auto-selection."
  - id: router.i38
    kind: instruction
    text: "Section heading: `validate` gate vs `consolidate` § Semantic placement"
  - id: router.i39
    kind: instruction
    text: "`validate` gate vs `consolidate` § Semantic placement: - **`validate` (gate mode):** Routine pre-merge gate on current scope (rule subagents + scripts). - **`consolidate` § Semantic placement mode:** After linters pass — **semantic** placement, duplication, cross-feature boundaries, refactoring impact."
  - id: router.i40
    kind: instruction
    text: "`consolidate` vs `optimize2`: - **`consolidate`:** **Repo-wide** redundancy audit and prioritization (discovery of shared patterns). - **`optimize2`:** **Targeted** optimization at four levels for chosen code; Rule of Three for extractions. Use for **hot paths** or known-complex modules."
  - id: router.i41
    kind: instruction
    text: "Section heading: `consolidate` — Redundancy audit vs Semantic placement mode"
  - id: router.i42
    kind: instruction
    text: "`consolidate` — Redundancy audit vs Semantic placement mode: - **Redundancy audit (default):** “What repeats?” → unify abstractly (may stay duplicated by decision). - **Semantic placement mode:** “Is code in the **wrong** layer/feature?” → move/refactor for boundaries (after tooling is green)."
  - id: router.i43
    kind: instruction
    text: "`challenge` vs `optimize2`: - **`challenge`:** Question whether the **feature or workflow** should exist or be simpler (remove/merge steps). - **`optimize2`:** Improve existing code **without** necessarily changing product scope."
  - id: router.i44
    kind: instruction
    text: "`debug` vs `hypothesis`: - **`debug`:** Default for runtime incidents — event chains, user-supplied evidence, iterative narrowing (`.agents/skills/debug/SKILL.md`). - **`hypothesis`:** Pre-registered root-cause experiment when naive fixes already failed or the user invokes hypothesis mode (`.agents/skills/hypothesis/SKILL.md`). - **Tiebreak:** User asks for hypothesis / repeated failed fixes → `hypothesis`; otherwise → `debug`. Cross-link both skills; do not run both as equal primaries in one pass."
  - id: router.i45
    kind: instruction
    text: "`debug` vs `learn`: - **`debug`:** Active incident; hypotheses; runtime evidence; possibly temporary instrumentation. - **`learn`:** After resolution or struggle — **capture durable** rule/skill/debug-pattern updates."
  - id: router.i46
    kind: instruction
    text: "`rule-quality` vs `learn`: - **`rule-quality`:** Score (Mode A) or rewrite (Mode B) **provided rule/command text**. - **`learn`:** Decide **where** lessons live (rules vs skills vs debug appendix) from incident context."
  - id: router.i47
    kind: instruction
    text: "`improve-skill-library` vs `rule-quality` / `consolidate`: - **`improve-skill-library`:** **System-level** audit of the whole `.agents/skills/` corpus — separation of concerns, SSOT, conflicts, handoffs — via parallel lens subagents and a no-information-loss gate. Edits skills + router/layers spine. - **`rule-quality`:** One **rule/command file's** grade or prose. **`consolidate`:** duplication in **`src/` application code**, not skills."
  - id: router.i48
    kind: instruction
    text: "`rule-quality` vs `review`: - **`rule-quality`:** Grade or improve **rules/commands** (rubric + quality standards). - **`review`:** Score **React/MUI components** with component rubric."
  - id: router.i49
    kind: instruction
    text: "`grill-me` vs `plan` § Refine: - **`grill-me`:** Product/design **Q&A** until shared understanding (questions first). Fits **gate 1** failures dominated by vision and tradeoffs. Includes an optional **Zoom out first** reflection (problem, recent attempts, wider alternative) — formerly the `stepback` skill. - **`plan` § Refine:** Engineering-level clarification — acceptance and scope bounds (**gate 2**); stop before **Investigate**. Full **`plan`** only after gates 1–2 pass — then produce the plan document."
  - id: router.i50
    kind: instruction
    text: "`prime` vs `start`: - **`prime`:** Agent loads **technical** context for implementation. - **`start`:** Human **first-time setup** walkthrough."
  - id: router.i51
    kind: instruction
    text: "`finish` vs `push` vs `bundle-ship`: - **`finish`:** Commit-ready locally (version, changelog, staging rules). - **`bundle-ship`:** Multi-thread same-checkout landing — one bundled `finish` commit, then `push` in one invocation. - **`push`:** Remote sync only **after** commits exist; never commit inside push."
  - id: router.i52
    kind: instruction
    text: "`canvas` vs `validate` / reporting: - **`canvas`:** Standalone **visual artifact** (tables, timelines, rich layouts) as deliverable. - **`validate`:** Structured **text report**; default no edits."
  - id: router.i53
    kind: instruction
    text: "Section heading: Airtable: `airtable-inspect` phases"
  - id: router.i54
    kind: instruction
    text: "Airtable: `airtable-inspect` phases: - One skill, two phases: **Phase 1 schema first**, **Phase 2 samples second** (skill body enforces the order)."
  - id: router.i55
    kind: instruction
    text: "Supabase: `supabase` vs `supabase-postgres-best-practices`: - **`supabase`:** Product workflows, Auth, RLS correctness, CLI/MCP, migrations narrative. - **`supabase-postgres-best-practices`:** **Performance** tuning, query plans, indexing, pooling — narrow DB optimization."
  - id: router.i56
    kind: instruction
    text: "Cloudflare: `cloudflare` vs `wrangler` vs `workers-best-practices`: - **`cloudflare`:** Pick **product** (Workers vs Pages vs DO vs R2…). - **`wrangler`:** **CLI** syntax and deploy/dev workflow. - **`workers-best-practices`:** **Code/config review** against current Workers guidance."
  - id: router.i57
    kind: instruction
    text: "Cloudflare agents: `agents-sdk` vs `building-ai-agent-on-cloudflare`: - **`agents-sdk`:** Reference-led SDK usage (state, RPC, docs fetch). - **`building-ai-agent-on-cloudflare`:** End-to-end **generated** agent app and deployment narrative."
  - id: router.i58
    kind: instruction
    text: "`building-mcp-server-on-cloudflare` vs `agents-sdk` (MCP sections): - **`building-mcp-server-on-cloudflare`:** **Expose** tools as remote MCP with OAuth/deploy. - **`agents-sdk`:** **Consume** or embed MCP patterns inside Agents SDK — use when agent wiring dominates."
  - id: router.i59
    kind: instruction
    text: "`web-perf` vs `optimize2` vs `react-perf-vite`: **Order when multiple apply:** measure with **`web-perf`** if symptoms are CWV/Lighthouse → structural fix with **`optimize2`** → cite specific **`react-perf-vite`** rules while implementing."
  - id: router.i60
    kind: instruction
    text: "`web-perf` vs `optimize2` vs `react-perf-vite`: - **`web-perf`:** **Browser-measured** performance (CWVs, network, traces via DevTools MCP). - **`optimize2`:** **Code-level** structure and complexity optimization (may include perf but not Lighthouse-centric); Rule of Three for extractions. - **`react-perf-vite`:** **Pattern lookup** for stack-native React perf (lazy routes, TanStack dedup, re-render rules) — read `rules/` on demand; does not replace hotspot refactor."
  - id: router.i61
    kind: instruction
    text: "Plan review stack (ordered pipeline): 1. **`pattern-review`** (`plan-section`) during **`plan`** step 5 when M/L or new user-visible/contracts — fills **Pattern & precedent** in the plan."
  - id: router.i62
    kind: instruction
    text: "Plan review stack (ordered pipeline): 2. **`review-dev-plan`** when Summary says `Plan review: Required: pending` (mandatory for M/L)."
  - id: router.i63
    kind: instruction
    text: "Plan review stack (ordered pipeline): 3. **`validate`** (plan-review mode) for **repo rule** compliance on the plan document."
  - id: router.i64
    kind: instruction
    text: "Plan review stack (ordered pipeline): When the user asks to **review a plan** or before **implement** on Complexity **M/L**, run **in order** — do not pick multiple primaries for the same pass: Do **not** run standalone **`pattern-review`** `scan` in the same session if **`review-dev-plan`** already ran the industry-precedent lens (unless the user requests a delta review)."
  - id: router.i65
    kind: instruction
    text: "`implement` vs `quick-piv`: - **`implement`:** Active `DEVELOPMENT_PLAN.md` with multi-phase or durable execution — phase-by-phase SSOT. - **`quick-piv`:** **XS/S** scope only; chat-sized extension or no plan file. **Never** when plan **Complexity** is **M/L** or **Plan review** is pending — use **`implement`** after gates pass."
  - id: router.i66
    kind: instruction
    text: "`debug` vs `quick-piv`: - **`debug`:** Unknown cause, need hypotheses and runtime evidence. - **`quick-piv`:** Root cause known; small scoped fix with clear gate."
  - id: router.i67
    kind: instruction
    text: "`challenge` vs `feature`: - **`feature`:** Net-new capability with mandatory 🔴 decision stops and journey mapping. - **`challenge`:** Simplify an **existing** named feature/workflow (flow + code)."
  - id: router.i68
    kind: instruction
    text: "`start` — onboarding: - **`start`:** Human first-time setup via README + dev task backlog (`/tasks`); app vision gate."
  - id: router.i69
    kind: instruction
    text: "`prime` vs clarification skills: - **`prime`:** Optional **once** for technical repo context — not a substitute for gates 1–2. - **Order when both needed:** `prime` (if unfamiliar) → **`grill-me` OR `plan` § Refine`** (one primary) → re-run gates → delivery skill."
  - id: router.i70
    kind: instruction
    text: "`review` vs `optimize2`: - **`review`:** Qualitative **component** rubric score (170-point). - **`optimize2`:** Structural/perf refactor of a **hotspot** at four levels."
  - id: router.i71
    kind: instruction
    text: "`quick-piv` vs `validate`: - **`quick-piv`:** Inline tooling checks only (“quick validate”) — not the **`validate`** skill fan-out. - **`validate`:** Full rule subagents + plan-compliance when the user asks to validate or before merge/finish."
  - id: router.i72
    kind: instruction
    text: "`feature` vs `plan` / `implement` (orchestrator): - **`feature`:** Primary outcome = product/requirements artifact + mandatory decision stops. **Not** the durable execution plan. - **`plan`:** Produces `DEVELOPMENT_PLAN.md`. **`implement`:** Executes it. After **`feature`** Phase 4, run **`plan`** (or ensure `DEVELOPMENT_PLAN.md` exists) before **`implement`**."
  - id: router.i73
    kind: instruction
    text: "`quick-piv` (orchestrator): - **Primary outcome:** Land a **small** scoped change in one session. Compresses plan/implement/validate steps — defers to **`validate`**, **`finish`**, and full **`plan`** for M/L, commits, and durable plans."
  - id: router.i74
    kind: instruction
    text: "Thread continuation vs backlog intake: - **Thread continuation:** Mid-task `/router` — resume the active job via **Thread → next skill**; do not read `app-tasks.json` first. - **Backlog intake:** Idle thread + bare `/router` — pick from `app-tasks.json` per **App task backlog**. - **Conflict:** If thread work and backlog `in-progress` disagree, **thread wins** unless the user explicitly asks to switch tasks."
  - id: router.i75
    kind: instruction
    text: "Bare `/router` vs `finish` (situation table): - **Bare `/router`** (no task text): **next-action dispatch** — **Active thread work** first; only when idle, **backlog intake** from `src/config/app-tasks.json`. **Not** default `finish` on new/idle dispatch. - **`/finish`:** explicit wrap-up — includes archiving the session task when applicable (see `finish` skill). Not the default for idle `/router`."
  - id: router.i76
    kind: instruction
    text: "App task backlog (SSOT): - **Active:** `src/config/app-tasks.json` (`to-do` | `in-progress` only; array order = priority). - **Archive:** `src/config/app-tasks-archive.json` (`done` only; append order = completion timeline). **Do not read** unless the user asks for completed history. - **Coding agent pick up:** when the assistant **commits to execute** a backlog task, set `in-progress` in the active file **in the same turn** before `prime`, `grill-me`, `plan`, or code. User edits in `/tasks` UI do **not** trigger pick-up. - **Onboarding tasks:** Fresh clones ship five seeded tasks (Supabase..."
  - id: router.i77
    kind: instruction
    text: "Project (this repo): - `.agents/skills/router/SKILL.md` — this file - `documentation/DOC_APP_VISION.md` — product SSOT (problem, persona, app’s role) - `.agents/skills/plan/SKILL.md` - `.agents/skills/implement/SKILL.md` - `.agents/skills/validate/SKILL.md` (auto-selects plan-review / impl-full / gate depth) - `.agents/skills/consolidate/SKILL.md` - `.agents/skills/review/SKILL.md` - `.agents/skills/finish/SKILL.md` - `.agents/skills/bundle-ship/SKILL.md` - `.agents/skills/push/SKILL.md` - `.agents/skills/quick-piv/SKILL.md` - `.agents/skills/prime/SKILL.md` - `.agents/skills/start/SKILL.md..."
  - id: router.i78
    kind: instruction
    text: "Router references (not skills): - `.agents/skills/router/references/dev-cycle-matrix.md` — dev-cycle happy path and M/L gates (SSOT)"
  - id: router.i79
    kind: instruction
    text: "User Cursor bundle (`~/.cursor/skills-cursor/`): - `create-skill`, `migrate-to-skills`, `create-rule`, `create-hook`, `create-subagent`, `babysit`, `split-to-prs`, `canvas`, `update-cursor-settings`, `update-cli-config`, `statusline`, `shell` — each under its own folder `SKILL.md`."
  - id: router.i80
    kind: instruction
    text: "Plugins: Resolve paths via workspace MCP descriptors or `~/.cursor/plugins/cache/` — skill names: `supabase`, `supabase-postgres-best-practices`, `cloudflare`, `wrangler`, `workers-best-practices`, `durable-objects`, `agents-sdk`, `building-ai-agent-on-cloudflare`, `building-mcp-server-on-cloudflare`, `sandbox-sdk`, `web-perf`. ---"
  - id: router.i81
    kind: instruction
    text: "Not present in this workspace: The agent inventory may list skills that are **not** checked into this repo (e.g. generic architecture/TDD/issue PRD skills). If absent on disk, substitute **`plan` / `consolidate` / `validate`** or add a project skill before relying on them."
  - id: router.l1
    kind: link
    text: "dev-cycle matrix -> references/dev-cycle-matrix.md"
  - id: router.l2
    kind: link
    text: "`.agents/skills/router/references/dev-cycle-matrix.md` -> references/dev-cycle-matrix.md"
  - id: router.ref.i1
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Dev-cycle matrix (router): **`/router`:** Thread continuation first (mid-task → logical next skill); backlog intake only when idle. See [router § `/router` — pick next action + skill](../SKILL.md)."
  - id: router.ref.i2
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Dev-cycle matrix (router): **Skill inventory:** [`.agents/skills/router/SKILL.md`](../SKILL.md) § Skill index."
  - id: router.ref.i3
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Dev-cycle matrix (router): Compact guidance for **next-step mode**. Compress, skip, or reorder when scope, risk, or discoveries demand it."
  - id: router.ref.i4
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 1. Spar / pin goal — router gates 1–2 pass."
  - id: router.ref.i5
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 2. **Plan** — `plan` writes `DEVELOPMENT_PLAN.md` with Complexity and compliance."
  - id: router.ref.i6
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 3. **Pattern & precedent** — `pattern-review` `plan-section` when M/L or material behavioral design (part of `plan` step 5)."
  - id: router.ref.i7
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 4. **Plan review** — `review-dev-plan` required for Complexity **M** or **L**; optional for **XS/S** unless risk or user request."
  - id: router.ref.i8
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 5. **Plan compliance** — `validate` (plan-review mode) for repo-rule compliance on the plan when M/L or user requests."
  - id: router.ref.i9
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 6. **Implement** — `implement` executes phases and gates."
  - id: router.ref.i10
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 7. **Validate** — repo rules and/or architecture gate when warranted (auto-selects impl-full / gate depth)."
  - id: router.ref.i11
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: 8. **Finish** → **Push**."
  - id: router.ref.i12
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Optimistic happy path: Optional: `prime` when codebase or branch context is unfamiliar."
  - id: router.ref.c1
    kind: table
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Decision cues (router) — header: | Situation | Usually next | (7 row lines)"
  - id: router.ref.i13
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Section heading: Plan depth and gates"
  - id: router.ref.i14
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Plan depth and gates: **`quick-piv`:** only when scope is small, risk low, and industry-precedent review is unnecessary or already satisfied."
  - id: router.ref.i15
    kind: instruction
    text: "file: .agents/skills/router/references/dev-cycle-matrix.md — Plan depth and gates: - **XS/S** — lighter plan; `review-dev-plan` optional unless risk. - **M/L** — full plan + **Pattern & precedent** + `review-dev-plan` before `implement` unless waived."
