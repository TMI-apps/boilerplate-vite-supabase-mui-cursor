    kind: instruction
    text: "1.2 Rule Decision Tree: **Implementation details?**"
  - id: feature.i21
    kind: instruction
    text: "1.2 Rule Decision Tree: Check each rule category systematically: - YES → Check `cloud-functions/RULE.md` (decision framework: security, secrets, testability) - NO → Skip - YES → Check `database/RULE.md` (migration patterns: idempotent, IF EXISTS, safe for fresh/existing DBs) - NO → Skip - Check `file-placement/RULE.md` → `architecture/RULE.md` - Determine location BEFORE creating files - Check `architecture/RULE.md` (feature vs shared, layers, import direction, path aliases) - Check `security/RULE.md` (auth, RLS, validation, secrets management) - Check `code-style/RULE.md` (naming, formatti..."
  - id: feature.i22
    kind: instruction
    text: "1.3 Risk & Impact Assessment: - [ ] Identify breaking changes"
  - id: feature.i23
    kind: instruction
    text: "1.3 Risk & Impact Assessment: - [ ] Assess impact on existing functionality"
  - id: feature.i24
    kind: instruction
    text: "1.3 Risk & Impact Assessment: - [ ] Determine testability (feature-branch preview deploy? Edge functions backup? Database has staging?)"
  - id: feature.i25
    kind: instruction
    text: "1.3 Risk & Impact Assessment: - [ ] Flag high-risk decisions requiring user approval"
  - id: feature.i26
    kind: instruction
    text: "1.3 Risk & Impact Assessment: **🔴 DECISION POINT:**"
  - id: feature.i27
    kind: instruction
    text: "1.3 Risk & Impact Assessment: - If high-risk identified → **STOP** immediately - Present risk assessment to user - Ask: \"Should I proceed with this high-risk change?\" - **WAIT** for explicit user confirmation (yes/no) - Document user's decision before proceeding ---"
  - id: feature.i28
    kind: instruction
    text: "Section heading: Phase 2: Requirements & Design"
  - id: feature.i29
    kind: instruction
    text: "Section heading: 2.0 Ambiguity Elimination Gate"
  - id: feature.i30
    kind: instruction
    text: "2.0 Ambiguity Elimination Gate: - [ ] Identify every ambiguous product, UX, data, role, and workflow choice before planning implementation."
  - id: feature.i31
    kind: instruction
    text: "2.0 Ambiguity Elimination Gate: - [ ] For each ambiguity, ask a question about the user's vision for how the app will be used in real life."
  - id: feature.i32
    kind: instruction
    text: "2.0 Ambiguity Elimination Gate: - [ ] Do not choose between plausible interpretations silently."
  - id: feature.i33
    kind: instruction
    text: "2.0 Ambiguity Elimination Gate: - [ ] Document each answer in the implementation document."
  - id: feature.i34
    kind: instruction
    text: "2.0 Ambiguity Elimination Gate: **🔴 DECISION POINT:**"
  - id: feature.i35
    kind: instruction
    text: "2.0 Ambiguity Elimination Gate: - If any ambiguity remains → **STOP** - Ask a specific app-usage or product-vision question that clears the ambiguity - **WAIT** for explicit user response - Document the answer before proceeding"
  - id: feature.i36
    kind: instruction
    text: "2.1 User Stories: - [ ] Extract user stories with roles (unauthorized/free/premium/admin)"
