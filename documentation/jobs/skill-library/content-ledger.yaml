  - id: improve-skill-library.ref.i4
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Section heading: Phase 0 — Content ledger (ground truth for the no-loss pass)"
  - id: improve-skill-library.ref.i5
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Phase 0 — Content ledger (ground truth for the no-loss pass): Orient (above). For **each editable skill** emit a YAML block enumerating its **atomic units** — every distinct trigger, instruction, rule, table, and link the file carries. One stable id per unit so it can be tracked across edits. Return only the YAML blocks. This is captured **before** any edit; do not edit any file. ---"
  - id: improve-skill-library.ref.i6
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 1 — Separation / overlap (read-only): 1. **N×N overlap matrix:** mark every pair of skills that could correctly fire on the **same** user request. For each marked pair, state whether the router already has a tiebreak (cite the router subsection) or **MISSING tiebreak**."
  - id: improve-skill-library.ref.i7
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 1 — Separation / overlap (read-only): 2. **One-outcome violations:** skills whose description/body bundles two primary outcomes."
  - id: improve-skill-library.ref.i8
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 1 — Separation / overlap (read-only): 3. **Negative-space gaps:** skills lacking a clear \"what this is NOT / use sibling X\" statement."
  - id: improve-skill-library.ref.i9
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 1 — Separation / overlap (read-only): 4. **Same-cell collisions:** skills sharing the same (lifecycle × mutation × domain × scope) cell."
  - id: improve-skill-library.ref.i10
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 1 — Separation / overlap (read-only): Orient (above). Using the registry, produce: Return findings as a list: `severity (must-fix/nice) | skills involved | problem | suggested fix`. No edits. ---"
  - id: improve-skill-library.ref.i11
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 2 — SSOT / duplication (read-only): 1. **Concept-ownership map:** for each reusable concept (e.g. pattern rubric, pre-commit light path, changeset flow, layer model, no-loss ledger), the **single file** that should own it vs everywhere it currently appears. Flag concepts owned in >1 place."
  - id: improve-skill-library.ref.i12
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 2 — SSOT / duplication (read-only): 2. **Literal duplication:** identical/near-identical tables, checklists, or paragraphs appearing in 2+ files (cite paths + headings)."
  - id: improve-skill-library.ref.i13
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 2 — SSOT / duplication (read-only): 3. **Link integrity:** cross-links (`see X`, relative paths) that do not resolve, or that point at a non-owner copy."
  - id: improve-skill-library.ref.i14
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 2 — SSOT / duplication (read-only): Orient (above). Produce: Return findings: `concept | current owner(s) | proposed single owner | files that should link instead`. No edits. ---"
  - id: improve-skill-library.ref.i15
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 3 — Conflicts (read-only): 1. **Shared-action contradictions:** build an `action → permitted skill(s)` table for sensitive actions (commit, push, edit protected files, default read-only). Flag any skill instruction that contradicts it."
  - id: improve-skill-library.ref.i16
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 3 — Conflicts (read-only): 2. **Router collisions:** any situation the router maps to >1 primary skill, or any skill not listed / listed >1 time in the router."
  - id: improve-skill-library.ref.i17
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 3 — Conflicts (read-only): 3. **Handoff contract mismatches:** where skill A says \"hand to B\" but B's declared inputs do not accept A's output artifact (e.g. `plan` emits `DEVELOPMENT_PLAN.md` — does `implement` declare it as input?)."
  - id: improve-skill-library.ref.i18
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 3 — Conflicts (read-only): Orient (above). Produce: Return findings: `type | skills/files | contradiction | suggested resolution`. No edits. ---"
  - id: improve-skill-library.ref.i19
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 4 — Composition / handoffs (read-only): 1. **Handoff DAG:** list directed edges (A → B). For each edge, verify predecessor output = successor declared input; flag mismatches."
  - id: improve-skill-library.ref.i20
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 4 — Composition / handoffs (read-only): 2. **Orphans:** skills nothing routes to (unreachable from the router front door)."
  - id: improve-skill-library.ref.i21
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 4 — Composition / handoffs (read-only): 3. **Dead ends:** skills that never state \"what's next\" where a successor is expected."
  - id: improve-skill-library.ref.i22
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 4 — Composition / handoffs (read-only): 4. **Front-door check:** confirm the router is the only situation→skill map and that every skill is reachable and listed once."
  - id: improve-skill-library.ref.i23
    kind: instruction
    text: "file: .agents/skills/improve-skill-library/references/subagent-briefs.md — Lens 4 — Composition / handoffs (read-only): Orient (above). Using `links-to` from the registry: Return: the edge list + a findings list `issue | skill(s) | fix`. No edits. ---"
