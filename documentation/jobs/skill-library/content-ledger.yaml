  - id: feature.i96
    kind: instruction
    text: "3.6 Complexity Projection: **🔴 DECISION POINT:**"
  - id: feature.i97
    kind: instruction
    text: "3.6 Complexity Projection: - If projections exceed thresholds → **STOP** - Present complexity analysis to user - Ask: \"Complexity exceeds thresholds. Should I simplify the design, or proceed with your approval?\" - **WAIT** for user decision - Document decision before proceeding"
  - id: feature.i98
    kind: instruction
    text: "3.7 Integration Points Analysis: - [ ] Identify integration points with existing code"
  - id: feature.i99
    kind: instruction
    text: "3.7 Integration Points Analysis: - [ ] Assess impact on existing functionality"
  - id: feature.i100
    kind: instruction
    text: "3.7 Integration Points Analysis: - [ ] Plan backward compatibility if needed"
  - id: feature.i101
    kind: instruction
    text: "3.7 Integration Points Analysis: - [ ] Document dependencies"
  - id: feature.i102
    kind: instruction
    text: "3.8 Standards Divergence Check: - [ ] Identify any planned diversion from industry standards, framework best practices, or established repo conventions."
  - id: feature.i103
    kind: instruction
    text: "3.8 Standards Divergence Check: - [ ] Prefer alignment with standards unless the user intentionally wants the diversion."
