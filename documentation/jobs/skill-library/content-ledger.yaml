skill: finish
file: .agents/skills/finish/SKILL.md
units:
  - id: finish.t1
    kind: trigger
    text: "description: Completes implementation wrap-up: concurrent-agent smoke checks, version/changelog when required, commit, and coordination before push. Use when closing a job, after implement/validate, or when the user runs /finish. Not push-only (use push) and not planning (use plan)."
  - id: finish.i1
    kind: instruction
    text: "finish: Complete the implementation by doing what you haven't done yet of these tasks:"
  - id: finish.i2
    kind: instruction
    text: "App task backlog — archive before git (when applicable): **Same behavior as choosing `done` on `/tasks`:** remove the task from `src/config/app-tasks.json` and append `{ title, description, status: \"done\" }` to `src/config/app-tasks-archive.json`. Do **not** leave `done` rows in the active file."
  - id: finish.i3
    kind: instruction
    text: "App task backlog — archive before git (when applicable): **Always include task-list changes in the commit:** Whenever `src/config/app-tasks.json` or `src/config/app-tasks-archive.json` have pending changes, they **must** be staged in the commit you are about to make — no matter what else that commit contains. Never leave task-list updates out of a commit. This applies even when no archive ran this session (e.g. status edits made via `/tasks`)."
  - id: finish.i4
    kind: instruction
    text: "App task backlog — archive before git (when applicable): 1. Read **only** `src/config/app-tasks.json`."
  - id: finish.i5
    kind: instruction
    text: "App task backlog — archive before git (when applicable): 2. **Resolve which task to archive:** prefer the task this session executed (usually the single `in-progress` you picked up). If the user named a task for this finish, use that row. **Zero** `in-progress`: ask — skip archiving, archive a named task, or pause finish. **Multiple** `in-progress`: ask which to archive. **Already archived** (user set `done` in UI): do not duplicate; continue finish."
  - id: finish.i6
    kind: instruction
    text: "App task backlog — archive before git (when applicable): 3. **Archive** at the resolved **active index** (remove from active preserving order; append to archive on disk). Use the same semantics as `POST /__dev/tasks/archive` with `{ index }` when the dev server is available, or edit both JSON files directly with validated shapes."
  - id: finish.i7
    kind: instruction
    text: "App task backlog — archive before git (when applicable): 4. **Before `git add`:** when step 3 ran, the **same commit** must stage **both** backlog JSON files. Missing either after archiving is an error — fix before commit."
  - id: finish.i8
    kind: instruction
    text: "App task backlog — archive before git (when applicable): 5. Restore is **not** part of `/finish` unless the user explicitly asks."
  - id: finish.i9
    kind: instruction
    text: "App task backlog — archive before git (when applicable): Run this block **before** version/changelog edits and **before** any `git add` / `git commit`."
  - id: finish.i10
    kind: instruction
    text: "Onboarding task sync (when applicable): 1. Re-read `src/config/app-tasks.json` and check actual state (env vars, `DOC_APP_VISION.md` status)."
  - id: finish.i11
    kind: instruction
    text: "Onboarding task sync (when applicable): 2. Archive tasks that are truly done (same archive flow as above) — e.g. Supabase task after `VITE_SUPABASE_*` is set and verified."
  - id: finish.i12
    kind: instruction
    text: "Onboarding task sync (when applicable): 3. For declined optional tasks (Airtable), archive with a skip note in the description or leave as `to-do` per user intent."
  - id: finish.i13
    kind: instruction
    text: "Onboarding task sync (when applicable): 4. Do not add task-board UI complexity — file edits only; disk-wins if the user edited tasks in `/tasks` during the session."
  - id: finish.i14
    kind: instruction
    text: "Onboarding task sync (when applicable): When this session completed onboarding work (Supabase env, hosting, vision doc, optional Airtable/theme):"
  - id: finish.i15
    kind: instruction
    text: "Concurrent work / other agent threads (same branch, same checkout): **Smoke signals:** Before any mandatory version or changelog edit, `git commit`, or `git push` (including when running `.agents/skills/push/SKILL.md` after a local commit), treat the working tree as **unstable** if you observe **any** of:"
  - id: finish.i16
    kind: instruction
    text: "Concurrent work / other agent threads (same branch, same checkout): **When any smoke appears:** Do **not** silently bump the version, write or edit changelog entries for release, commit, or push until the user selects one option under **User choice** below."
  - id: finish.i17
    kind: instruction
    text: "Concurrent work / other agent threads (same branch, same checkout): - Unexpected modified or staged files, **or** a `git status` / diff that **shifts between two fresh reads** from disk without this thread having edited those paths. - Hunks or files that **do not match** this thread’s assumed scope for the current finish. - `package.json` or `CHANGELOG.md` behaving oddly (for example unexpected concurrent edits, conflicts or merge markers, or metadata that **no longer matches** the current full diff). - Husky / pre-commit hooks or commit failing due to files **outside** this thread’s stated..."
  - id: finish.i18
    kind: instruction
    text: "User choice (required when smoke is present): 1. **Pause finish —** Stop before version/changelog/commit/push. Tell the user what you observed; wait while they resolve concurrency; do **no** further finish steps until they explicitly ask you to continue."
  - id: finish.i19
    kind: instruction
    text: "User choice (required when smoke is present): 2. **Bundle finish —** Re-read `git status` and the **full** diff from disk. Treat the branch as **one** release increment. Widen changelog and commit scope (and the version bump per [Semantic Versioning](#semantic-versioning-ssot) here) so they accurately describe **everything** that will be included in the commit—**explicit joint ownership** of the snapshot. Then continue the normal finish flow from that baseline."
  - id: finish.i20
    kind: instruction
    text: "User choice (required when smoke is present): 3. **Stash lane (other thread paused) —** **Only** if the user **explicitly confirms** the other thread or agent is paused: run `git stash push` with flags appropriate so nothing important is left out of the stash (for example include untracked or explicit paths when needed); use a **clear stash message**. Run the remainder of finish on the cleaned tree, then commit and push per this skill (push via `.agents/skills/push/SKILL.md` when applicable). Then `git stash pop`, or `git stash apply` followed by `git stash drop`. If stash apply produces co..."
  - id: finish.i21
    kind: instruction
    text: "User choice (required when smoke is present): 4. **Wait and re-check —** Wait **~3 minutes once** for this selection (for example `sleep 180` in the shell—**no** tight polling loops). Then re-read status and full diff from disk. If smoke is **gone** and the tree **matches only this thread’s intended work**, continue finish **without** widening scope. If smoke remains or the diff still includes changes this thread does not own, **do not** commit or push—call **AskQuestion** again with the **same four** options. **Do not** run another automatic ~3 minute wait for Option 4 after one has alread..."
  - id: finish.i22
    kind: instruction
    text: "User choice (required when smoke is present): **Guardrails:** You cannot stop or suspend other agents. Options that depend on another thread being idle (**3**) or on time passing (**4**) rely on **user-stated truth** or on **clock time plus a clean re-read**, not on the assistant controlling other processes. For Option 4, claiming the tree is “only this thread’s work” **must** be justified by a **clean second read** of status and full diff from disk, **not** by assumption."
  - id: finish.i23
    kind: instruction
    text: "User choice (required when smoke is present): Call **AskQuestion** once with **exactly** these four options (you may shorten labels for the UI; keep the meanings intact): - remove temporary console logs - remove instrumentation - remove redundant/legacy code - **If this was a debugging session that resulted in a fix:** update `.agents/skills/debug/patterns.md` (the debug pattern library) **only** when the insight is reusable. - Capture the pattern at the level of a **bug class**, not a single incident. - Use format: **Symptom class -> Likely cause classes -> Discriminator question -> First ..."
  - id: finish.i24
    kind: instruction
    text: "Section heading: Version and changelog gate"
  - id: finish.i25
    kind: instruction
    text: "Version and changelog gate: Before editing `package.json` or `CHANGELOG.md`, classify staged changes per **`scripts/change-classify.cjs`** (matrix SSOT: `documentation/DOC_AGENT_WORKFLOW_LAYERS.md` § Local git)."
  - id: finish.c1
    kind: table
    text: "Version and changelog gate — header: | Class | Version + changelog | (4 row lines)"
  - id: finish.i26
    kind: instruction
    text: "Version and changelog gate: **Changesets (optional):** Add `.changeset/*.md` when the change should appear in release narrative across PRs — see **`documentation/DOC_CHANGESETS.md`**. `finish` still owns `package.json` + `CHANGELOG.md` on the feature branch."
  - id: finish.i27
    kind: instruction
    text: "Version and changelog gate: When skipping version/changelog: commit message uses `type: Subject` **without** `[VERSION]` prefix (still include required body). - **MANDATORY (when bump required):** Update version number in `package.json` to match changelog version - **MANDATORY (when bump required):** Update changelog (fetch date if unsure of date) — Keep a Changelog format; section list SSOT in `.agents/skills/finish/SKILL.md` § Semantic Versioning cross-ref - **MANDATORY:** If staged changes include `src/features/*` code, stage matching feature README updates (`src/features/*/README.md`) -..."
  - id: finish.i28
    kind: instruction
    text: "Ready to commit? (required): Before `git add` / `git commit`, match `.cursor/rules/workflow/RULE.md`: summarize what will be committed and ask whether the user is **ready to commit**. Do not proceed to version/changelog/commit until they confirm (unless they already explicitly invoked `finish` to commit this work)."
  - id: finish.i29
    kind: instruction
    text: "Semantic Versioning (SSOT): **Conventional Commit Types to Version Mapping:**"
  - id: finish.i30
    kind: instruction
    text: "Semantic Versioning (SSOT): All projects must follow semantic versioning (MAJOR.MINOR.PATCH): - **MAJOR (X.0.0):** Breaking changes - Major version bumps require explicit user confirmation before proceeding - Ask: \"This is a MAJOR version bump (breaking change). Do you want to proceed?\" - Only proceed after explicit user confirmation - **MINOR (0.X.0):** New features (backwards compatible) - **PATCH (0.0.X):** Bug fixes (backwards compatible) - `feat:` - New feature (bumps MINOR version) - `fix:` - Bug fix (bumps PATCH version) - `docs:` - Documentation only changes (no version bump) - `sty..."
  - id: finish.i31
    kind: instruction
    text: "Commit Message Standards (SSOT): **Format:** `[VERSION] type: Feature/Change Title`"
  - id: finish.i32
    kind: instruction
    text: "Commit Message Standards (SSOT): **Requirements:**"
  - id: finish.i33
    kind: instruction
    text: "Commit Message Standards (SSOT): **Example:**"
  - id: finish.i34
    kind: instruction
    text: "Commit Message Standards (SSOT): **Note:** Commit message must match changelog entry. Husky pre-commit hook runs automatically (see `.husky/pre-commit` for SSOT). See `.cursor/rules/workflow/RULE.md` for Keep a Changelog format details and version synchronization requirements."
  - id: finish.i35
    kind: instruction
    text: "Commit Message Standards (SSOT): - Version number must be first (e.g., `[3.19.0]`) - Use conventional commit types (see above) - Commit message subject must match changelog feature title (with type prefix) - **Commit body is REQUIRED** - must include details about what changed - Reference issue/ticket numbers when applicable"
  - id: finish.i36
    kind: instruction
    text: "Faster commit (pre-commit light path): After `git add`, expect hook behavior per **`documentation/DOC_AGENT_WORKFLOW_LAYERS.md`** § Local git (classifier SSOT: `scripts/change-classify.cjs`). Do not duplicate the matrix here. - Do **not** use `--no-verify` to avoid slow hooks on app-code commits; fix tests or split commits (docs/migrations separate from `src/`). - `git commit --amend` with an empty index may run the full hook; re-stage or accept. - Tests run on **push** (`.husky/pre-push`), not on commit."
  - id: finish.i37
    kind: instruction
    text: "Production promotion (separate from finish): - **`finish`** lands version + changelog on the feature branch; squash merge to **`develop`** updates staging. - **Do not** use `finish` or a squash PR to ship production. After the user confirms staging on `develop`, run **Promote to production** (`promote-to-production.yml`) per `.cursor/rules/workflow/RULE.md`."
  - id: finish.i38
    kind: instruction
    text: "Section heading: Boundaries"
  - id: finish.c2
    kind: table
    text: "Boundaries — header: | Not `finish` | Use instead | (5 row lines)"
  - id: finish.i39
    kind: instruction
    text: "Boundaries: You have explicit access to use console commands for this task."
  - id: finish.l1
    kind: link
    text: "Semantic Versioning -> #semantic-versioning-ssot"

skill: grill-me
file: .agents/skills/grill-me/SKILL.md
units:
  - id: grill-me.t1
    kind: trigger
    text: "description: Interview the user until scope edges and interaction boundaries are aligned and the decision tree is resolved. Focuses on where the feature stops, what it will NOT do or touch, and how it meets other functionality. Chat-only alignment — authors no artifact. Use to stress-test scope/boundaries before feature or plan, or when the user says \"grill me\"."
  - id: grill-me.i1
    kind: instruction
    text: "Grill me: Interview the user until there is shared understanding of the feature's **scope edges** and **interaction boundaries**, resolving the decision tree branch by branch. The goal is not to design the interior. It is to agree on **where the feature stops**, **what it will NOT do or touch**, and **how it meets the functionality around it**."
  - id: grill-me.i2
    kind: instruction
    text: "What this skill owns (SSOT): **Skip gate:** trivial/XS change with no real edges → don't grill; route to `quick-piv`."
  - id: grill-me.i3
    kind: instruction
    text: "What this skill owns (SSOT): `grill-me` owns **reaching alignment in chat** — not recording it. It produces shared understanding, **authors no file**, then hands the resolved tree to **`feature`** (to document as requirements) or **`plan` § Refine** (to turn into `DEVELOPMENT_PLAN.md`). Do not template user stories, journeys, or spec files here — if you are, you've left `grill-me`."
  - id: grill-me.i4
    kind: instruction
    text: "Interrogation priority (edges before interior): 1. **Problem + success** — one sentence each."
  - id: grill-me.i5
    kind: instruction
    text: "Interrogation priority (edges before interior): 2. **Perimeter (in scope)** — smallest set of capabilities that counts as this feature."
  - id: grill-me.i6
    kind: instruction
    text: "Interrogation priority (edges before interior): 3. **Non-goals (out of scope)** — what it will **NOT do** and **NOT touch** (see below)."
  - id: grill-me.i7
    kind: instruction
    text: "Interrogation priority (edges before interior): 4. **Neighbor map** — existing functionality this feature meets, by **user-visible name** (auth, settings, notifications, existing CRUD, admin, billing…), not by file. For each neighbor, resolve **ride vs new** (below)."
  - id: grill-me.i8
    kind: instruction
    text: "Interrogation priority (edges before interior): 5. **Edge decisions** — one question per boundary: handoff, ownership, atomicity, precedence vs existing behavior."
  - id: grill-me.i9
    kind: instruction
    text: "Interrogation priority (edges before interior): 6. **Interior** — only where an edge choice already constrains it."
  - id: grill-me.i10
    kind: instruction
    text: "Interrogation priority (edges before interior): Resolve in roughly this priority; follow dependencies where a branch opens another. Do not descend into interior behavior until the perimeter and edges are agreed."
  - id: grill-me.i11
    kind: instruction
    text: "Ride vs new (default-greenfield check): Agents tend to propose a new path for everything. Counter it: for each neighbor, ask whether this feature **rides the existing pipeline** (same flow/data path, extended) or runs a **parallel/new** one. **Burden of proof is on greenfield** — a new pipeline needs a stated reason the existing one can't absorb it (divergent product concept, incompatible constraints, unacceptable coupling), not just convenience. This is not a \"which file/mechanism\" question (that stays with the agent). It is a **scope/boundary** question because riding vs forking changes c..."
  - id: grill-me.i12
    kind: instruction
    text: "Non-goals are first-class: The most valuable output of edge-alignment is naming what the feature will **NOT** do and **NOT** touch. Push on two lists: - **Will NOT do** — capabilities a reasonable person might assume are included but are deferred or excluded (e.g. \"no digest scheduling\", \"no partial import\"). - **Will NOT touch** — existing functionality that stays unchanged, boundaries we refuse to cross (e.g. \"does not alter the existing success toast\", \"does not bypass RLS\"). For each, confirm it's intentional and mark **deferred** (\"not now\") vs **excluded** (\"not ever\"). Pair boundarie..."
  - id: grill-me.i13
    kind: instruction
    text: "Roles: The user keeps the app aligned with the vision: behavior, product feel, direction, priorities, risk, tradeoffs. The agent translates that into code. Don't ask the user to choose files, functions, layers, or mechanisms unless the choice changes product direction, scope, or a boundary with other functionality. **Note:** whether a feature *rides an existing pipeline or forks a new one* is such a boundary — surface it (see Ride vs new), even though the specific files/mechanism stay with the agent."
  - id: grill-me.i14
    kind: instruction
    text: "Question style: **Options must be Pareto-optimal.** Never include an option that is worse than another option on every axis the user cares about — if one choice dominates, don't ask; state it and move on. Each option must be the winner on a distinct, valuable dimension, e.g.:"
  - id: grill-me.i15
    kind: instruction
    text: "Question style: Ask one at a time. Use a question tool call when available so the user can click options; prefer multiple-choice when branches are clear. - Best performance (runtime speed) - Best code consistency (matches repo patterns) - Least code / fastest to implement - Most reusable or extensible (future features cheap) - Best UX - Best separation / easiest to cut later Label each option with the dimension it wins on, so the user is choosing between real tradeoffs, not spotting the obvious answer. Every multiple-choice question includes two omnipresent options: - **\"Explain the UX impa..."
  - id: grill-me.i16
    kind: instruction
    text: "Recommendation timing: No recommendations during grilling. Exception: for boundary questions touching existing code, you may state which option is most consistent with the codebase before asking — treat as evidence, not the final recommendation."
  - id: grill-me.i17
    kind: instruction
    text: "Ending the grill: **Next:** Re-run `.agents/skills/router/SKILL.md` gates 1–2 → `plan` § Refine or `feature` to record the resolved scope. Not `implement` until a `DEVELOPMENT_PLAN.md` exists."
  - id: grill-me.i18
    kind: instruction
    text: "Ending the grill: When there is shared understanding, close with a **chat summary** (not a file): - **Vision & constraints** — concise. - **In scope** — the agreed perimeter. - **Non-goals** — explicit \"will NOT do\" / \"will NOT touch\", each marked *deferred* or *excluded*. - **Neighbor/boundary map** — each existing feature it meets and the resolved edge (ride vs new, ownership, precedence, atomicity); note any greenfield path with its justification. - **Open tradeoffs** — product-framed. - **Recommended direction** — code left to the agent unless a technical choice materially affects the v..."
  - id: grill-me.i19
    kind: instruction
    text: "Section heading: Boundaries"
  - id: grill-me.c1
    kind: table
    text: "Boundaries — header: | Not `grill-me` | Use instead | (7 row lines)"
  - id: grill-me.i20
    kind: instruction
    text: "Boundaries: **SSOT note:** `grill-me` aligns on scope edges & the decision tree *in conversation*; `feature`/`plan` *record* the result."

skill: hypothesis
file: .agents/skills/hypothesis/SKILL.md
units:
  - id: hypothesis.t1
    kind: trigger
    text: "description: Debug by pre-registered hypothesis instead of guess-and-patch. Before touching code, the agent states what it believes the root cause is, predicts what a successful fix proves, and — critically — pre-registers what a FAILED fix would teach and how that narrows the space of remaining causes. Use this whenever debugging a bug, error, test failure, or \"why isn't this working\" issue, OR whenever the user explicitly invokes hypothesis mode (e.g. \"use the hypothesis skill\", \"debug this with hypotheses\", \"hypothesis debugging\"). Especially use it for non-obvious bugs where the cause i..."
  - id: hypothesis.i1
    kind: instruction
    text: "Hypothesis Debugging: The aim is not to fix the bug this turn. The aim is to shrink the set of possible causes every turn, so the bug has nowhere left to hide. A fix that lands is a bonus. A fix that fails is data — but only if you said in advance what its failure would mean."
  - id: hypothesis.i2
    kind: instruction
    text: "Section heading: Core idea"
  - id: hypothesis.i3
    kind: instruction
    text: "Core idea: Cheap superficial patches are bad experiments. If you patch a symptom and it doesn't work, you've only crossed out that one patch. You learned almost nothing. If you aim at the ROOT cause and it doesn't work, you've eliminated a whole region of the possibility space — that's a strong experiment that teaches a lot. So: prefer the hypothesis that, whether confirmed OR refuted, kills the most candidate causes. Spend your one experiment well."
  - id: hypothesis.i4
    kind: instruction
    text: "Section heading: The procedure"
  - id: hypothesis.i5
    kind: instruction
    text: "The procedure: Every iteration, before editing any code, write out the block below. Fill all five fields. Keep the language terse and direct — short phrases, no hedging, no filler. Caveman to-the-point-ness: \"Bug in cache, not DB. Fix: clear cache on write.\" not \"It seems plausible that the issue might possibly be related to the caching layer.\" Output exactly this, in a single code block: Then implement the fix and test it."
  - id: hypothesis.i6
    kind: instruction
    text: "Rules that make this work: **Pre-register before implementing.** Write the whole block first. The \"IF DISPROVED\" prediction must exist before you run the fix — otherwise it's post-hoc rationalization and worth nothing. A pre-registered failure is information; a story told after the fact is not."
  - id: hypothesis.i7
    kind: instruction
    text: "Rules that make this work: **Aim at root level.** Before committing to a FIX, sanity-check it on the ROOT-LEVEL CHECK line. If the fix only suppresses the symptom, a failure will teach you nothing and a success may mask the real bug. Go deeper. Ask what would have to be true upstream for this symptom to appear."
  - id: hypothesis.i8
    kind: instruction
    text: "Rules that make this work: **On disproof, recommend the next loop — don't stop and don't fix blind.** When the fix fails, the IF DISPROVED line already named what's eliminated and what to test next. Open the next iteration with a fresh block built on the narrowed space. Each loop should have fewer suspects than the last."
  - id: hypothesis.i9
    kind: instruction
    text: "Rules that make this work: **Track what's been ruled out.** Carry a running tally across iterations so the space visibly shrinks:"
  - id: hypothesis.i10
    kind: instruction
    text: "Rules that make this work: If STILL OPEN isn't shrinking, your hypotheses are too shallow — you're patching symptoms. Go deeper."
  - id: hypothesis.i11
    kind: instruction
    text: "Worked example: Bug: API returns stale user data after an update. Iteration 1: Fix fails. Data still stale. Iteration 2: Each failure cuts the space roughly in half. That's the point."
  - id: hypothesis.i12
    kind: instruction
    text: "When NOT to over-apply: For a one-line obvious typo or a clear stack trace pointing at a single line, just fix it — don't ceremony it up. This skill earns its keep when the cause is genuinely unclear or naive fixes have already failed."
  - id: hypothesis.i13
    kind: instruction
    text: "Section heading: Boundaries"
  - id: hypothesis.c1
    kind: table
    text: "Boundaries — header: | Not `hypothesis` | Use instead | (5 row lines)"
  - id: hypothesis.i14
    kind: instruction
    text: "Boundaries: **Router tiebreak:** `.agents/skills/router/SKILL.md` § `debug` vs `hypothesis`."
  - id: hypothesis.c2
    kind: table
    text: "Fenced output/template block — HYPOTHESIS: <what you think the root cause is. one or two lines.>"
  - id: hypothesis.c3
    kind: table
    text: "Fenced output/template block — HYPOTHESIS: Read path hits cache, never invalidated on write."
  - id: hypothesis.c4
    kind: table
    text: "Fenced output/template block — RULED OUT: Cache invalidation on write."

skill: implement
file: .agents/skills/implement/SKILL.md
units:
  - id: implement.t1
    kind: trigger
    text: "description: Executes DEVELOPMENT_PLAN.md phase by phase with gates, progress updates, and repo-rule compliance. Use when the user asks to implement a plan or continue a job. Not planning (plan), changelog (finish), or read-only audits (validate)."
  - id: implement.i1
    kind: instruction
    text: "implement: **Critical:** Follow the plan. Follow repo rules during implementation. No shortcuts."
  - id: implement.i2
    kind: instruction
    text: "implement: **Do NOT update the changelog.** Changelog updates are done in the finish command, not during implementation."
  - id: implement.i3
    kind: instruction
    text: "implement: **Related:** Create or refresh plans with `.agents/skills/plan/SKILL.md`. For small tasks in one pass, `.agents/skills/quick-piv/SKILL.md`. Before starting (when plan says so), run `.agents/skills/review-dev-plan/SKILL.md`. After phases, use `.agents/skills/validate/SKILL.md` for a rules-and-tooling review before finish. Industry precedent: `.agents/skills/pattern-review/SKILL.md`. For session context, `.agents/skills/prime/SKILL.md`. For commits and changelog, `.agents/skills/finish/SKILL.md`."
  - id: implement.i4
    kind: instruction
    text: "implement: Execute a development plan phase by phase. Use `DEVELOPMENT_PLAN.md` as the guide, run gates, and update the same document with progress, decisions, and notes. ---"
  - id: implement.i5
    kind: instruction
    text: "Input: **Plan location:** `documentation/jobs/temp_job_<name>/DEVELOPMENT_PLAN.md`"
  - id: implement.i6
    kind: instruction
    text: "Input: - User states what to implement (e.g. “implement the my-project redesign plan”). - **Context-based:** Infer which plan from job name, open file, or recent discussion. - If ambiguous which `temp_job_<name>/` folder applies, **stop** and ask. ---"
  - id: implement.i7
    kind: instruction
    text: "Section heading: 0. Branch gate"
  - id: implement.i8
    kind: instruction
    text: "0. Branch gate: - [ ] Verify current git branch (`git branch --show-current`). If on `main` or `develop`, **stop** — instruct: `git switch develop` + `git pull origin develop`, then `git switch -c feature/<name>` per `.cursor/rules/workflow/RULE.md` § Branch Strategy."
  - id: implement.i9
    kind: instruction
    text: "0. Branch gate: - [ ] Never commit directly to `main` or `develop` during implementation."
  - id: implement.i10
    kind: instruction
    text: "1. Load plan: - [ ] Read `DEVELOPMENT_PLAN.md` for the resolved job folder."
  - id: implement.i11
    kind: instruction
    text: "1. Load plan: - [ ] If the plan’s **Summary** or acceptance criteria imply user-facing product change, skim `documentation/DOC_APP_VISION.md` for consistency; if **`DRAFT`**, flag to the user before heavy implementation."
  - id: implement.i12
    kind: instruction
    text: "1. Load plan: - [ ] Verify mandatory sections exist: Summary, Phase overview, Conflict & compliance, Notes during development, Decisions made."
  - id: implement.i13
    kind: instruction
    text: "1. Load plan: - [ ] If Summary **Complexity** is **M** or **L**, or the plan changes user-visible behavior/contracts: verify **Pattern & precedent** is filled (or explicitly skipped with reason)."
  - id: implement.i14
    kind: instruction
    text: "1. Load plan: - [ ] If **Plan review** is `Required: pending`, **stop** and route to `.agents/skills/review-dev-plan/SKILL.md` (or record waiver in **Decisions made**)."
  - id: implement.i15
    kind: instruction
    text: "1. Load plan: - [ ] If **Pattern & precedent** is `Non-standard — waiver recommended` without an explicit waiver in **Decisions made**, **stop** and ask the owner."
  - id: implement.i16
    kind: instruction
    text: "1. Load plan: - [ ] Find the first phase in the overview that is not done (e.g. status `Pending`, empty, or not marked ✅)."
  - id: implement.i17
    kind: instruction
    text: "Section heading: 2. Per phase: execute"
  - id: implement.i18
    kind: instruction
    text: "2. Per phase: execute: 1. **Read** the phase: Goal, Steps, Gate."
  - id: implement.i19
    kind: instruction
    text: "2. Per phase: execute: 2. **Execute** the steps; match file layers, aliases, and patterns in `.cursor/rules/architecture/RULE.md` and `ARCHITECTURE.md`."
  - id: implement.i20
    kind: instruction
    text: "2. Per phase: execute: 3. **Run** the gate (see below). It must pass before continuing."
  - id: implement.i21
    kind: instruction
    text: "2. Per phase: execute: 4. **Update** `DEVELOPMENT_PLAN.md`:"
  - id: implement.i22
    kind: instruction
    text: "2. Per phase: execute: For each phase **in order** (one phase at a time unless the plan explicitly allows parallel work): - **Phase overview:** set this phase’s status to `Done` or `✅` (use the wording/style already used in the table). - **Notes during development:** add entries when something notable happened. - **Decisions made:** add rows when a choice was made (see below)."
  - id: implement.i23
    kind: instruction
    text: "Section heading: 3. Gate"
  - id: implement.i24
    kind: instruction
    text: "3. Gate: - **Frontend:** Run the checks described in the plan (UI present, interactions, loading/error states, responsive if specified). Use the IDE browser MCP when available: navigate → snapshot → interact; follow the lock/unlock workflow in the MCP instructions. - **Backend / Supabase:** As specified in the plan (e.g. migration applied, RLS checks, Edge Function invocation). - **Repo quality:** When the plan or phase implies it, run `pnpm lint`, `pnpm type-check`, and relevant tests (`pnpm test:run` or scoped files). For structural changes, `pnpm validate:structure` and/or `pnpm arch:che..."
  - id: implement.i25
    kind: instruction
    text: "Section heading: 4. Next phase"
  - id: implement.i26
    kind: instruction
    text: "4. Next phase: - Repeat until every phase in the overview is done. ---"
  - id: implement.i27
    kind: instruction
    text: "Rules reference (follow while coding): **Also:** `.dependency-cruiser.cjs` / `pnpm arch:check` for layer violations; `documentation/DOC_TANSTACK_QUERY.md` when changing server state or queries."
  - id: implement.i28
    kind: instruction
    text: "Rules reference (follow while coding): See [`.cursor/rules/INDEX.md`](../../../.cursor/rules/INDEX.md) and [`.agents/skills/plan/references/rules-registry.md`](../plan/references/rules-registry.md). ---"
  - id: implement.i29
    kind: instruction
    text: "Notes during development: **When to add:**"
  - id: implement.i30
    kind: instruction
    text: "Notes during development: **Format:** Chronological or by category."
  - id: implement.i31
    kind: instruction
    text: "Notes during development: **Example:**"
  - id: implement.i32
    kind: instruction
    text: "Notes during development: - Technical debt from current or prior code - Unexpected obstacles - Gaps not covered in the plan - Suggestions for later (refactor, cleanup) ---"
  - id: implement.i33
    kind: instruction
    text: "Decisions made: **When to add:**"
  - id: implement.i34
    kind: instruction
    text: "Decisions made: **Important choices:**"
  - id: implement.i35
    kind: instruction
    text: "Decisions made: 1. **STOP** implementation"
  - id: implement.i36
    kind: instruction
    text: "Decisions made: 2. **ASK** the user explicitly"
  - id: implement.i37
    kind: instruction
    text: "Decisions made: 3. If the issue is ambiguity, ask about the user's intended app usage or product vision so the answer determines the decision"
  - id: implement.i38
    kind: instruction
    text: "Decisions made: 4. If the issue is a diversion from industry standards, framework best practices, or repo conventions, ask whether that diversion is intentional or whether to align with best practices"
  - id: implement.i39
    kind: instruction
    text: "Decisions made: 5. **WAIT** for an answer"
  - id: implement.i40
    kind: instruction
    text: "Decisions made: 6. **DOCUMENT** in Decisions made"
  - id: implement.i41
    kind: instruction
    text: "Decisions made: **Format:**"
  - id: implement.i42
    kind: instruction
    text: "Decisions made: - Choices with no clear codebase precedent - Subjective choices (design, UX, business rules) ---"
  - id: implement.i43
    kind: instruction
    text: "Unexpected obstacles: If something is not covered by the plan: - Add an entry under **Notes during development** - **STOP** and ask the user: “I hit [X]. The plan does not cover this. How should we proceed?” - If the gap is unresolved ambiguity, ask a specific app-usage or product-vision question. - If the gap reveals an undocumented standards diversion, ask whether to keep the diversion or realign with best practices. - Wait for an answer, then continue and record any decision ---"
  - id: implement.i44
    kind: instruction
    text: "Documentation: If the plan requires doc updates (e.g. `src/features/<feature>/README.md`, `ARCHITECTURE.md`), do them in the phase that introduces the behavior. Follow the plan and `.cursor/rules/file-placement/RULE.md`. ---"
  - id: implement.i45
    kind: instruction
    text: "Section heading: Checklist per phase"
  - id: implement.i46
    kind: instruction
    text: "Checklist per phase: - [ ] Phase steps executed"
  - id: implement.i47
    kind: instruction
    text: "Checklist per phase: - [ ] Gate passed"
  - id: implement.i48
    kind: instruction
    text: "Checklist per phase: - [ ] Phase overview status updated"
  - id: implement.i49
    kind: instruction
    text: "Checklist per phase: - [ ] Notes updated (if applicable)"
  - id: implement.i50
    kind: instruction
    text: "Checklist per phase: - [ ] Decisions updated (if applicable)"
  - id: implement.i51
    kind: instruction
    text: "Completion: - [ ] Plan fully executed"
  - id: implement.i52
    kind: instruction
    text: "Completion: - [ ] All gates passed"
  - id: implement.i53
    kind: instruction
    text: "Completion: - [ ] Notes and Decisions sections are up to date"
  - id: implement.i54
    kind: instruction
    text: "Completion: **Tell the user:** “Implementation complete.”"
  - id: implement.i55
    kind: instruction
    text: "Completion: **Next (mandatory handoff):**"
  - id: implement.i56
    kind: instruction
    text: "Completion: 1. Run **`.agents/skills/validate/SKILL.md`** (impl review) on this job unless the user explicitly skips validation."
  - id: implement.i57
    kind: instruction
    text: "Completion: 2. After the user accepts validation (or waives in **Decisions made**), offer **`.agents/skills/finish/SKILL.md`** when they want to commit — do not commit without explicit request."
  - id: implement.i58
    kind: instruction
    text: "Completion: When all phases are done: Do **not** use **`quick-piv`** for remaining phases when a durable `DEVELOPMENT_PLAN.md` exists."
  - id: implement.i59
    kind: instruction
    text: "Section heading: Boundaries"
  - id: implement.c1
    kind: table
    text: "Boundaries — header: | Not `implement` | Use instead | (8 row lines)"
  - id: implement.l1
    kind: link
    text: "`.cursor/rules/INDEX.md` -> ../../../.cursor/rules/INDEX.md"
  - id: implement.l2
    kind: link
    text: "`.agents/skills/plan/references/rules-registry.md` -> ../plan/references/rules-registry.md"

skill: improve-skill-library
file: .agents/skills/improve-skill-library/SKILL.md
units:
  - id: improve-skill-library.t1
    kind: trigger
    text: "description: Audit and improve the .agents/skills library so the skills form a symbiotic whole: clear separation of concerns, single source of truth (SSOT), and no routing or instruction conflicts. Runs parallel Task subagents per lens (inventory, separation/overlap, SSOT/duplication, conflicts, composition/handoffs) and ends with a critical no-information-loss pass that must pass before any edit is kept. Use when the user asks to harmonize, consolidate, deduplicate, or de-conflict skills, fix router/skill overlaps, or improve the skill library as a whole."
  - id: improve-skill-library.t2
    kind: trigger
    text: "\"Make the skills a symbiotic whole / one system\", \"harmonize / de-conflict the skills\""
  - id: improve-skill-library.t3
    kind: trigger
    text: "\"Find duplication / overlap between skills\", \"fix router collisions\", \"which skills conflict?\""
  - id: improve-skill-library.t4
    kind: trigger
    text: "After adding several skills, or when routing feels ambiguous"
  - id: improve-skill-library.t5
    kind: trigger
    text: "Periodic health check of `.agents/skills/`"
  - id: improve-skill-library.i1
    kind: instruction
    text: "Section heading: Config"
  - id: improve-skill-library.i2
    kind: instruction
    text: "Config: Every **Task** subagent uses `model` = slug above (must be valid for your Cursor build; edit the value only). Subagents are **self-contained** — they do not see this chat. Each brief is in [`references/subagent-briefs.md`](references/subagent-briefs.md)."
  - id: improve-skill-library.i3
    kind: instruction
    text: "Purpose: Turn the skills corpus into one coherent system. This skill **discovers** structural problems (overlap, duplication, conflicts, broken handoffs), **proposes** fixes behind a decision gate, **executes** approved fixes, then runs a **critical no-information-loss pass** that blocks any change that silently drops content."
  - id: improve-skill-library.c1
    kind: table
    text: "Scope — header: | Set | Paths | Treatment | (5 row lines)"
  - id: improve-skill-library.t6
    kind: trigger
    text: "\"Make the skills a symbiotic whole / one system\", \"harmonize / de-conflict the skills\""
  - id: improve-skill-library.t7
    kind: trigger
    text: "\"Find duplication / overlap between skills\", \"fix router collisions\", \"which skills conflict?\""
  - id: improve-skill-library.t8
    kind: trigger
    text: "After adding several skills, or when routing feels ambiguous"
  - id: improve-skill-library.t9
    kind: trigger
    text: "Periodic health check of `.agents/skills/`"
  - id: improve-skill-library.i4
    kind: instruction
    text: "Section heading: Invariants (the testable definition of \"done\")"
  - id: improve-skill-library.i5
    kind: instruction
    text: "Invariants (the testable definition of \"done\"): The audit measures every skill against these. Each is falsifiable."
  - id: improve-skill-library.c2
    kind: table
    text: "Invariants (the testable definition of \"done\") — header: | Goal | Invariant | (6 row lines)"
  - id: improve-skill-library.i6
    kind: instruction
    text: "Section heading: Workflow"
  - id: improve-skill-library.i7
    kind: instruction
    text: "Section heading: Phase 0 — Inventory + content ledger (before any edit)"
  - id: improve-skill-library.i8
    kind: instruction
    text: "Phase 0 — Inventory + content ledger (before any edit): 1. **Registry** — one row per skill: `name | one-sentence outcome | lifecycle phase | mutates? | scope | inputs | outputs | owns-concepts | links-to`."
  - id: improve-skill-library.i9
    kind: instruction
    text: "Phase 0 — Inventory + content ledger (before any edit): 2. **Content ledger** — per skill, enumerate the **atomic units** it carries (each distinct trigger, instruction, rule, table, link). This ledger is the ground truth for the no-loss pass; it is captured **before** any edit."
  - id: improve-skill-library.i10
    kind: instruction
    text: "Phase 0 — Inventory + content ledger (before any edit): Run two subagents (briefs in references): Persist both under `documentation/jobs/skill-library/` (registry table + ledger) so the no-loss pass can diff against them. State the path you used."
  - id: improve-skill-library.i11
    kind: instruction
    text: "Section heading: Phase 1 — Concern-space axes"
  - id: improve-skill-library.i12
    kind: instruction
    text: "Phase 1 — Concern-space axes: Before judging, fix the axes separation is measured on (lifecycle phase, mutation posture, domain, scope). Each skill should occupy a **distinct cell**; same-cell skills are overlap candidates. (Axes are listed in the registry brief.)"
  - id: improve-skill-library.i13
    kind: instruction
    text: "Section heading: Phase 2 — Parallel lens subagents (one turn)"
  - id: improve-skill-library.i14
    kind: instruction
    text: "Phase 2 — Parallel lens subagents (one turn): Launch these **in parallel**, each with its self-contained brief from [`references/subagent-briefs.md`](references/subagent-briefs.md). Findings only — **no edits** in this phase."
  - id: improve-skill-library.c3
    kind: table
    text: "Phase 2 — Parallel lens subagents (one turn) — header: | # | Lens | Produces | (7 row lines)"
  - id: improve-skill-library.i15
    kind: instruction
    text: "Phase 2 — Parallel lens subagents (one turn): Give each Task a short `description` (e.g. \"— overlap\", \"— SSOT\", \"— conflicts\", \"— composition\")."
  - id: improve-skill-library.i16
    kind: instruction
    text: "Section heading: Phase 3 — Synthesis"
  - id: improve-skill-library.i17
    kind: instruction
    text: "Phase 3 — Synthesis: Merge lens outputs: deduplicate findings, mark **must-fix vs nice-to-have**, and flag any finding raised by **≥2 lenses**. Group by blast radius: routing collisions and contradictory commit/push instructions first; cosmetic duplication last."
  - id: improve-skill-library.i18
    kind: instruction
    text: "Section heading: Phase 4 — Decision gate"
  - id: improve-skill-library.i19
    kind: instruction
    text: "Phase 4 — Decision gate: **CRITICAL: do not edit before approval.** Present findings as a prioritized map (each finding: what, where, fix, target owner if moving a concept, risk). For any SSOT move, name the **single owner** the content will live in and which files will link to it. Wait for the user to choose which fixes to apply. If usage intent or an intentional divergence is ambiguous, ask before the gate."
  - id: improve-skill-library.i20
    kind: instruction
    text: "Section heading: Phase 5 — Execute (approved fixes only)"
  - id: improve-skill-library.i21
    kind: instruction
    text: "Phase 5 — Execute (approved fixes only): - Apply one finding at a time; each edit is self-contained. - When consolidating to a single owner, replace duplicates with a **link** to that owner — never delete content without a destination. - When a skill is added/removed/renamed, update `router/SKILL.md` (situation table + skill index) and the layers doc per its coupling table. - Touching protected files (`.cursor/**`, configs) requires explicit user approval first."
  - id: improve-skill-library.i22
    kind: instruction
    text: "Section heading: Phase 6 — Critical no-information-loss pass (hard gate)"
  - id: improve-skill-library.i23
    kind: instruction
    text: "Phase 6 — Critical no-information-loss pass (hard gate): After edits, run the **no-loss verifier** subagent (brief in references). It compares the **pre-edit content ledger** (Phase 0) against the **git diff + current files** and classifies every atomic unit:"
  - id: improve-skill-library.c4
    kind: table
    text: "Phase 6 — Critical no-information-loss pass (hard gate) — header: | Class | Meaning | Allowed? | (6 row lines)"
  - id: improve-skill-library.i24
    kind: instruction
    text: "Phase 6 — Critical no-information-loss pass (hard gate): Any **MISSING** unit fails the pass: restore it (or, with explicit user approval, reclassify as DROPPED) and re-run the verifier until zero MISSING. Output the coverage report (counts per class + every MOVED target and DROPPED reason)."
  - id: improve-skill-library.i25
    kind: instruction
    text: "Section heading: Phase 7 — Reconcile"
  - id: improve-skill-library.i26
    kind: instruction
    text: "Phase 7 — Reconcile: Confirm the router still lists every skill exactly once, all cross-links resolve, and the registry table is updated. Summarize what changed. **Do not claim success — the user confirms via their own review/test.**"
  - id: improve-skill-library.i27
    kind: instruction
    text: "Section heading: Boundaries"
  - id: improve-skill-library.c5
    kind: table
    text: "Boundaries — header: | Use this skill for | Use instead | (9 row lines)"
  - id: improve-skill-library.i28
    kind: instruction
    text: "Section heading: Anti-patterns"
  - id: improve-skill-library.i29
    kind: instruction
    text: "Anti-patterns: - Editing before the decision gate or skipping the no-loss pass. - Deleting a checklist/table without a named link target (SSOT move with no destination). - \"Consolidating\" two skills that occupy **different** concern-space cells (forces unrelated outcomes together). - Letting subagents edit — lens subagents are **read-only**; only the main agent edits after approval. - Adding/removing a skill without updating the router and layers-doc coupling."
  - id: improve-skill-library.i30
    kind: instruction
    text: "Related: - [`router`](../router/SKILL.md) — routing SSOT this skill validates and updates - [`DOC_AGENT_WORKFLOW_LAYERS.md`](../../../documentation/DOC_AGENT_WORKFLOW_LAYERS.md) — layer model + \"When you change something\" coupling - [`consolidate`](../consolidate/SKILL.md) — analogous audit for application code - [`rule-quality`](../rule-quality/SKILL.md) — per-file grade + improve - [`learn`](../learn/SKILL.md) — decides where durable knowledge lives - [`references/subagent-briefs.md`](references/subagent-briefs.md) — self-contained prompts for every subagent"
  - id: improve-skill-library.l1
    kind: link
    text: "`references/subagent-briefs.md` -> references/subagent-briefs.md"
  - id: improve-skill-library.l2
    kind: link
    text: "`router` -> ../router/SKILL.md"
  - id: improve-skill-library.l3
    kind: link
    text: "`DOC_AGENT_WORKFLOW_LAYERS.md` -> ../../../documentation/DOC_AGENT_WORKFLOW_LAYERS.md"
  - id: improve-skill-library.l4
