  - id: pattern-review.ref.i1
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/alert-template.md — Pattern risk alert template: Use when pattern review finds **material** divergence from common industry practice. Summarize the same substance in plan § **Pattern & precedent**. Do **not** add new structural coupling in application code until the owner decides (plan **Decisions made** or explicit chat waiver)."
  - id: pattern-review.ref.c1
    kind: table
    text: "file: .agents/skills/pattern-review/references/alert-template.md — Fenced output/template block — ### Pattern risk — review before implementing"
  - id: pattern-review.ref.i1
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Pattern review rubric (reference): Bundled reference for [`.agents/skills/pattern-review/SKILL.md`](../SKILL.md). Entry point: [`documentation/DOC_AGENT_WORKFLOW_LAYERS.md`](../../../../documentation/DOC_AGENT_WORKFLOW_LAYERS.md) § Pattern / industry-standard review. Do not duplicate this file elsewhere — link here."
  - id: pattern-review.ref.i2
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Purpose: **The agent chooses** which aspects matter for *this* change. There is no fixed checklist of UI shapes or domains."
  - id: pattern-review.ref.i3
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Purpose: Evaluate a **development plan** or **implementation proposal** against **industry standards** and **common best practice** for the kind of product behavior being built — not against this repo’s internal rules (`validate` does that)."
  - id: pattern-review.ref.c1
    kind: table
    text: "file: .agents/skills/pattern-review/references/rubric.md — Scope — header: | In scope | Out of scope | (5 row lines)"
  - id: pattern-review.ref.i4
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Review lens (how to think): 1. **Classify the change** — What user-facing capability is this (CRUD, workflow, settings, integration, dashboard, etc.)?"
  - id: pattern-review.ref.i5
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Review lens (how to think): 2. **Pick precedents** — Name 1–3 familiar products, frameworks, or patterns users would recognize (*not* this repo’s history)."
  - id: pattern-review.ref.i6
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Review lens (how to think): 3. **Select relevant dimensions** — From the pool below, include only what applies; add others if the plan demands it."
  - id: pattern-review.ref.i7
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Review lens (how to think): 4. **Compare** — For each chosen dimension: this design vs common practice vs cost of diverging."
  - id: pattern-review.ref.i8
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Review lens (how to think): 5. **Verdict** — See labels below; if non-standard, offer options and stop for owner choice before new structural coupling in `src/`."
  - id: pattern-review.ref.c2
    kind: table
    text: "file: .agents/skills/pattern-review/references/rubric.md — Dimension pool (use what applies — not a mandatory list) — header: | Dimension | Questions the agent may use | (10 row lines)"
  - id: pattern-review.ref.i9
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Dimension pool (use what applies — not a mandatory list): Add dimensions when the plan touches them (e.g. offline, multi-tenant, real-time). **Omit** dimensions that are irrelevant — say so briefly."
  - id: pattern-review.ref.c3
    kind: table
    text: "file: .agents/skills/pattern-review/references/rubric.md — Verdict labels — header: | Verdict | Meaning | (5 row lines)"
  - id: pattern-review.ref.i10
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Section heading: When to run (judgment, not a trigger table)"
  - id: pattern-review.ref.t1
    kind: trigger
    text: "file: .agents/skills/pattern-review/references/rubric.md — New or changed user flows, screens, or navigation"
  - id: pattern-review.ref.t2
    kind: trigger
    text: "file: .agents/skills/pattern-review/references/rubric.md — New persistence ↔ UI relationships"
  - id: pattern-review.ref.t3
    kind: trigger
    text: "file: .agents/skills/pattern-review/references/rubric.md — New public or cross-feature contracts (routes, APIs, events)"
  - id: pattern-review.ref.t4
    kind: trigger
    text: "file: .agents/skills/pattern-review/references/rubric.md — Complexity **M** or **L** plans (always document § Pattern & precedent)"
  - id: pattern-review.ref.t5
    kind: trigger
    text: "file: .agents/skills/pattern-review/references/rubric.md — User asks for best practice / industry standard / pattern review"
  - id: pattern-review.ref.i11
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — When to run (judgment, not a trigger table): **Skip** when the change is trivial, purely internal, or copies an existing pattern with no new coupling (state that in one line)."
  - id: pattern-review.ref.i12
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — When to run (judgment, not a trigger table): Run pattern review when the work could introduce **new behavioral or structural choices** that a senior engineer would compare to the market — especially:"
  - id: pattern-review.ref.i13
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Lite pass (no full plan): 1. What capability is this?"
  - id: pattern-review.ref.i14
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Lite pass (no full plan): 2. What precedents apply?"
  - id: pattern-review.ref.i15
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Lite pass (no full plan): 3. Any material divergence from common practice?"
  - id: pattern-review.ref.i16
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Lite pass (no full plan): 4. Verdict — or escalate to full **Pattern risk** block if non-standard."
  - id: pattern-review.ref.i17
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Lite pass (no full plan): Answer in prose (3–5 sentences):"
  - id: pattern-review.ref.i18
    kind: instruction
    text: "file: .agents/skills/pattern-review/references/rubric.md — Plan section (what to write in `DEVELOPMENT_PLAN.md`): Capture the agent’s chosen aspects — not a fixed form. Minimum: - **Capability & precedents** (what + 1–3 references) - **Aspects reviewed** (bullet list of dimensions you actually used) - **Findings** (short: align / diverge / risk per aspect) - **Verdict** + **Options A/B/C** if non-standard See [`../plan/references/implementation-plan-template.md`](../../plan/references/implementation-plan-template.md) § Pattern & precedent."
  - id: pattern-review.ref.l1
    kind: link
    text: "file: .agents/skills/pattern-review/references/rubric.md — `.agents/skills/pattern-review/SKILL.md` -> ../SKILL.md"
  - id: pattern-review.ref.l2
    kind: link
    text: "file: .agents/skills/pattern-review/references/rubric.md — `documentation/DOC_AGENT_WORKFLOW_LAYERS.md` -> ../../../../documentation/DOC_AGENT_WORKFLOW_LAYERS.md"
  - id: pattern-review.ref.l3
    kind: link
    text: "file: .agents/skills/pattern-review/references/rubric.md — `../plan/references/implementation-plan-template.md` -> ../../plan/references/implementation-plan-template.md"

skill: plan
file: .agents/skills/plan/SKILL.md
units:
  - id: plan.t1
    kind: trigger
    text: "description: Creates DEVELOPMENT_PLAN.md with repo-rule compliance researched first (file placement, architecture, patterns). Use for new features, M/L work, or /plan. Not XS/S quick changes (quick-piv), product-only requirements (feature), or changelog updates (finish)."
  - id: plan.i1
    kind: instruction
    text: "plan: **Critical:** Conflict and compliance is researched first; steps in each phase must reflect that (file placements, architecture, patterns). The plan documents *how* to implement according to repo rules."
  - id: plan.i2
    kind: instruction
    text: "plan: **Do NOT update the changelog.** Changelog updates are done in the finish command, not during planning."
  - id: plan.i3
    kind: instruction
    text: "plan: **Templates:** [`references/implementation-plan-template.md`](references/implementation-plan-template.md), [`references/complexity-rubric.md`](references/complexity-rubric.md)."
  - id: plan.i4
    kind: instruction
    text: "plan: **Related:** For session context, use `.agents/skills/prime/SKILL.md`. For architecture/quality gate before merging, use `.agents/skills/validate/SKILL.md` (auto-selects gate depth). For small scoped work without a full plan file, use `.agents/skills/quick-piv/SKILL.md`. To execute this plan phase by phase, use `.agents/skills/implement/SKILL.md`. For repo-rule plan/impl review, use `.agents/skills/validate/SKILL.md`. For multi-lens plan critique (including industry precedent), use `.agents/skills/review-dev-plan/SKILL.md`. For industry precedent on plans/proposals, use `.agents/skill..."
  - id: plan.i5
    kind: instruction
    text: "plan: Create a development plan for a feature or job. Research how best to implement it, check repo rules, and produce `DEVELOPMENT_PLAN.md` in `documentation/jobs/temp_job_<name>/`. ---"
  - id: plan.i6
    kind: instruction
    text: "Section heading: 0. Branch gate (when plan will lead to code)"
  - id: plan.i7
    kind: instruction
    text: "0. Branch gate (when plan will lead to code): - [ ] Verify current git branch. If on `main` or `develop`, **stop** — instruct: `git switch develop` + `git pull origin develop`, then `git switch -c feature/<name>` per `.cursor/rules/workflow/RULE.md` § Branch Strategy."
  - id: plan.i8
    kind: instruction
    text: "0. Branch gate (when plan will lead to code): - [ ] Planning may run on any branch; **do not** start file creation on `main` or `develop`."
  - id: plan.i9
    kind: instruction
    text: "1. Input: - User describes what they want (e.g. add a capability, migrate X to Y). - Optional: job name, reference to spec or ticket."
  - id: plan.i10
    kind: instruction
    text: "2. Refine (if needed): **If the request is vague or unclear, do NOT write a plan yet.**"
  - id: plan.i11
    kind: instruction
    text: "2. Refine (if needed): - Ask clarifying questions (scope, context, constraints). - Remove all ambiguity before planning. If multiple interpretations are possible, read **`documentation/DOC_APP_VISION.md`** first when the answer is about **who** the user is building for or **why** — if that file is still **`DRAFT`**, pause and have the user fill it (or confirm deferral) before locking scope. - Ask a question about the user's vision for how the app will be used, so the answer clears the ambiguity and drives the decision. - Continue until scope is clear. - Only proceed to investigation once sc..."
  - id: plan.i12
    kind: instruction
    text: "Optional: Requirements depth (complex or unfamiliar features): For features involving external APIs, database changes, auth, or novel logic, gather typed requirements before investigating:"
  - id: plan.c1
    kind: table
    text: "Optional: Requirements depth (complex or unfamiliar features) — header: | Feature type | Key info to confirm | (7 row lines)"
  - id: plan.i13
    kind: instruction
    text: "Optional: Requirements depth (complex or unfamiliar features): **Completeness gate:** Can you describe the exact expected behavior with concrete examples? If not, keep asking."
  - id: plan.i14
    kind: instruction
    text: "Section heading: 3. Investigate"
  - id: plan.i15
    kind: instruction
    text: "3. Investigate: - [ ] Search the codebase for existing functionality to reuse (features under `src/features/`, shared under `src/shared/`, `src/components/common/`)."
  - id: plan.i16
    kind: instruction
    text: "3. Investigate: - [ ] Identify relevant rules from `.cursor/rules/` (start at `.cursor/rules/INDEX.md`)."
  - id: plan.i17
    kind: instruction
    text: "3. Investigate: - [ ] Align narrative with **`documentation/DOC_APP_VISION.md`** when the plan changes user-facing behavior (problem, persona, app role); if **`DRAFT`**, pause for fill or explicit deferral."
  - id: plan.i18
    kind: instruction
    text: "3. Investigate: - [ ] For server-cached data, check `documentation/DOC_TANSTACK_QUERY.md` and existing `api/keys.ts` patterns in features."
  - id: plan.i19
    kind: instruction
    text: "3. Investigate: - [ ] Determine scope and boundaries (in-scope vs out-of-scope)."
  - id: plan.i20
    kind: instruction
    text: "3. Investigate: - [ ] **Feature decomposition self-check (mandatory):** Enumerate distinct domain concepts this work introduces. If more than one cohesive bounded context applies, or projected file count exceeds `featureBudgets.config.cjs` defaults, plan multiple features under `src/features/` before writing steps. Do not wait for the user to request architecture. See `.cursor/rules/architecture/RULE.md` § Feature granularity."
  - id: plan.i21
    kind: instruction
    text: "Optional: Foundation validation (high-risk features): 1. **Identify** the riskiest assumption — what could invalidate the entire approach?"
  - id: plan.i22
    kind: instruction
    text: "Optional: Foundation validation (high-risk features): 2. **Test** with a minimal POC (smallest possible proof: one API call, one query, one algorithm run)."
  - id: plan.i23
    kind: instruction
    text: "Optional: Foundation validation (high-risk features): 3. **Gate:** Foundation works → proceed to plan. Foundation fails → report to user, investigate alternatives before planning."
  - id: plan.i24
    kind: instruction
    text: "Optional: Foundation validation (high-risk features): If the feature depends on an unproven assumption (new API, untested algorithm, novel integration): Do **not** invest in full planning until the foundation is proven."
  - id: plan.i25
    kind: instruction
    text: "4. Create plan: - [ ] Run conflict and compliance analysis first (see below)."
  - id: plan.i26
    kind: instruction
    text: "4. Create plan: - [ ] Define phases in logical order (workable chunks)."
  - id: plan.i27
    kind: instruction
    text: "4. Create plan: - [ ] Write steps per phase aligned with compliance (concrete paths, layers, patterns)."
  - id: plan.i28
    kind: instruction
    text: "4. Create plan: - [ ] Add a gate for each phase."
  - id: plan.i29
    kind: instruction
    text: "4. Create plan: - [ ] Write `DEVELOPMENT_PLAN.md` to `documentation/jobs/temp_job_<name>/` using [`references/implementation-plan-template.md`](references/implementation-plan-template.md)."
  - id: plan.i30
    kind: instruction
    text: "4. Create plan: - [ ] Set **Complexity** (`XS` | `S` | `M` | `L`) in Summary per [`references/complexity-rubric.md`](references/complexity-rubric.md)."
  - id: plan.i31
    kind: instruction
    text: "5. Pattern & precedent: **Proactively** run [`.agents/skills/pattern-review/SKILL.md`](../pattern-review/SKILL.md) (`plan-section` mode) when Complexity is **M** or **L**, or the plan introduces new user-visible behavior/contracts (see [rubric](../pattern-review/references/rubric.md) — agent chooses relevant aspects)."
  - id: plan.i32
    kind: instruction
    text: "5. Pattern & precedent: Fill **Pattern & precedent** in the plan. If non-standard, **stop** for owner pick (A/B/C or waiver) before implementation. Industry / product precedent → **pattern-review**. Repo rules → **Conflict & compliance** and later **validate**."
  - id: plan.i33
    kind: instruction
    text: "Section heading: 6. Plan review gate"
  - id: plan.i34
    kind: instruction
    text: "6. Plan review gate: Set **Plan review** in Summary per [dev-cycle matrix](../router/references/dev-cycle-matrix.md) § Plan depth and gates — do not duplicate the M/L table here."
  - id: plan.i35
    kind: instruction
    text: "7. Present and iterate: **Chat footer (short):**"
  - id: plan.i36
    kind: instruction
    text: "7. Present and iterate: - Present the plan to the user. - Incorporate feedback and update the plan as needed. ---"
  - id: plan.i37
    kind: instruction
    text: "Output location: **Path:** `documentation/jobs/temp_job_<name>/DEVELOPMENT_PLAN.md`"
  - id: plan.i38
    kind: instruction
    text: "Output location: **Naming:** Follow `.cursor/rules/file-placement/RULE.md`: folder `temp_job_<descriptive-name>/` (kebab-case, descriptive). Allowed by `projectStructure.config.cjs` under `documentation/jobs/` (nested `*.md` files)."
  - id: plan.i39
    kind: instruction
    text: "Output location: **Note:** Older jobs in this repo may use other filenames (e.g. `IMPLEMENTATION_PLAN.md`); new plans from this command should standardize on **`DEVELOPMENT_PLAN.md`**."
  - id: plan.c2
    kind: table
    text: "Mandatory sections (always include) — header: | Section | Purpose | Content | (8 row lines)"
  - id: plan.i40
    kind: instruction
    text: "Section heading: Per phase (repeat for each phase)"
  - id: plan.i41
    kind: instruction
    text: "Per phase (repeat for each phase): Phases must be in logical order and split into workable chunks. **Each phase must have a gate.**"
  - id: plan.c3
    kind: table
    text: "Per phase (repeat for each phase) — header: | Subsection | Required? | Content | (5 row lines)"
  - id: plan.i42
    kind: instruction
    text: "Optional sections (include when relevant): - **Source/context** – Where the request came from (feedback, ticket, etc.). - **User stories** – For user-facing features. - **Existing functionality** – What we reuse. - **Scope / out-of-scope** – Explicit boundaries. ---"
  - id: plan.i43
    kind: instruction
    text: "Section heading: Rules reference (research before writing steps)"
  - id: plan.i44
    kind: instruction
    text: "Rules reference (research before writing steps): **Boilerplate docs:** `ARCHITECTURE.md`, `documentation/DOC_INDEX.md`, and for query-based data `documentation/DOC_TANSTACK_QUERY.md`."
  - id: plan.i45
    kind: instruction
    text: "Rules reference (research before writing steps): **Import boundaries:** `.dependency-cruiser.cjs` (and `pnpm arch:check`) for layer rules beyond ESLint."
  - id: plan.i46
    kind: instruction
    text: "Rules reference (research before writing steps): See [`.cursor/rules/INDEX.md`](../../../.cursor/rules/INDEX.md) and [`references/rules-registry.md`](references/rules-registry.md) — do not duplicate the full table here. ---"
  - id: plan.i47
    kind: instruction
    text: "Conflict & compliance checklist: **Purpose:** Ensure the plan complies with project rules and does not introduce unnecessary technical debt."
  - id: plan.i48
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Identify applicable rules (architecture, file-placement, database, security, code-style, testing, workflow, etc.)."
  - id: plan.i49
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Validate planned file paths against `projectStructure.config.cjs` (whitelist); run `pnpm validate:structure` after structural additions if unsure."
  - id: plan.i50
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Check architecture compliance: feature vs `src/shared/` vs `src/components/common/`, layer boundaries, import direction (pages → hooks → services)."
  - id: plan.i51
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] **Feature decomposition self-check:** List planned feature folder(s). If a single feature spans multiple domain concepts or exceeds `featureBudgets.config.cjs` budgets, split into separate features in the plan with narrow public APIs before listing file paths."
  - id: plan.i52
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Identify any planned diversion from industry standards, framework best practices, or established repo conventions. If found, ask the user whether the diversion is intentional or whether the plan should align with best practices."
  - id: plan.i53
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Estimate complexity (cyclomatic ≤10, cognitive ≤15, functions ≤100 lines per `.cursor/rules/code-style/RULE.md`); plan extractions if needed (see `.agents/skills/optimize2/SKILL.md` for refactoring workflow)."
  - id: plan.i54
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Note database impact if applicable (migrations under `supabase/migrations/`, idempotent, safe for fresh and existing DB)."
  - id: plan.i55
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Note security impact if applicable (auth, RLS, validation, secrets in `.env` only)."
  - id: plan.i56
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Document conflicts with existing code (pattern mismatches, breaking changes)."
  - id: plan.i57
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Consider testing: new or changed logic should have tests per `.cursor/rules/testing/RULE.md`."
  - id: plan.i58
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] Workflow: branch strategy per `.cursor/rules/workflow/RULE.md` (e.g. not developing on `main`). Changelog is updated in **finish**, not while planning."
  - id: plan.i59
    kind: instruction
    text: "Conflict & compliance checklist: - [ ] If a feature’s behavior changes: plan updates to `src/features/<feature>/README.md` in the same work as code (see file-placement rule)."
  - id: plan.i60
    kind: instruction
    text: "Conflict & compliance checklist: **Output inside `DEVELOPMENT_PLAN.md`:** A **Conflict & compliance** section with:"
  - id: plan.i61
    kind: instruction
    text: "Conflict & compliance checklist: During planning, work through (using the rules reference above): - Applicable rules (by name/path). - Planned file placements and validation status (confirmed vs needs config change — config changes require explicit approval per architecture rule). - Known risks / attention points. - Open questions for the user. - Confirmed standards diversions, including whether the user chose to keep the diversion or align with best practices. ---"
  - id: plan.i62
    kind: instruction
    text: "Section heading: Gate examples"
  - id: plan.i63
    kind: instruction
    text: "Gate examples: Each phase must have a gate."
  - id: plan.i64
    kind: instruction
    text: "Frontend (this stack: Vite + React + MUI): - Browser: expected UI present; primary flows work; loading/error states; responsive behavior where relevant."
  - id: plan.c4
    kind: table
    text: "Backend / Supabase — header: | Type | Gate | (4 row lines)"
  - id: plan.i65
    kind: instruction
    text: "Repo quality: - `pnpm lint`, `pnpm type-check`, and tests relevant to the change (`pnpm test:run` or targeted files) pass at phase boundaries when code exists. ---"
  - id: plan.i66
    kind: instruction
    text: "Notes during development (mandatory empty section): **Purpose:** Filled during implementation with technical debt, obstacles, gaps vs plan, follow-up ideas."
  - id: plan.i67
    kind: instruction
    text: "Notes during development (mandatory empty section): **Behavior:** Leave empty in the initial plan."
  - id: plan.i68
    kind: instruction
    text: "Decisions made (mandatory empty section): **Purpose:** Record choices; for important ones, ask the user."
  - id: plan.i69
    kind: instruction
    text: "Decisions made (mandatory empty section): **Format:**"
  - id: plan.i70
    kind: instruction
    text: "Decisions made (mandatory empty section): **Behavior:** Leave empty in the initial plan."
  - id: plan.i71
    kind: instruction
    text: "Section heading: Example phase overview table"
  - id: plan.i72
    kind: instruction
    text: "Key principles: 1. **Refine first:** If the request is vague, ask questions before writing the plan."
  - id: plan.i73
    kind: instruction
    text: "Key principles: 2. **Ambiguity is not allowed:** If ambiguity appears, ask about intended app usage or product vision before choosing."
  - id: plan.i74
    kind: instruction
    text: "Key principles: 3. **Standards diversions are explicit:** If a plan diverges from industry standards, best practices, or repo conventions, ask whether that is intentional before proceeding."
  - id: plan.i75
    kind: instruction
    text: "Key principles: 4. **Phases are workable:** Each phase is a logical, testable chunk."
  - id: plan.i76
    kind: instruction
    text: "Key principles: 5. **Gates are mandatory:** Every phase has a gate."
