    kind: instruction
    text: "Level 4: Complexity Review: Assuming efficiency is acceptable, evaluate structural complexity. - High cyclomatic complexity (many branches) - Deep nesting (pyramid of doom) - Long functions/methods - Long parameter lists - God objects (too many responsibilities) - High fan-in (many files depend on this) - High fan-out (depends on many files) - Circular dependencies"
