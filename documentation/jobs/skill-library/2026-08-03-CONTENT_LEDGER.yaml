skill: consolidate
file: .agents/skills/consolidate/SKILL.md
units:
  - id: consolidate.t1
    kind: trigger
    text: "find duplication, consolidate code, audit redundancy, reduce repetition, unify patterns"
  - id: consolidate.i1
    kind: instruction
    text: "Modes: default Redundancy audit; Semantic placement repair via references/semantic-placement.md after tooling green"
  - id: consolidate.i2
    kind: instruction
    text: "Rule of Three: no extract until 3+ use cases — SSOT optimize2"
  - id: consolidate.i3
    kind: instruction
    text: "Consolidation != abstraction: accept duplication, standardize, utility, or configurable abstraction"
  - id: consolidate.i4
    kind: instruction
    text: "Indirection budget: trace ≤5 files; abstraction saves more than adds; new dev understands faster"
  - id: consolidate.i5
    kind: instruction
    text: "Workflow: DISCOVER → CLASSIFY → ANALYZE → PRIORITIZE → PRESENT → (USER CHOOSES) → EXECUTE"
  - id: consolidate.c1
    kind: table
    text: "Discovery scans 1A–1E: structural similarity, import clusters, pattern repetition, convention inconsistency, git churn"
  - id: consolidate.c2
    kind: table
    text: "Classification types: Literal, Structural, Conceptual, Inconsistent usage"
  - id: consolidate.c3
    kind: table
    text: "Prioritization score = (Freq×2)+(Stability×2)+(Simplicity×2)−(Divergence×3)−(Coupling×2); tiers 6+/3–5/0–2"
  - id: consolidate.i6
    kind: instruction
    text: "Phase 5 CRITICAL: do not implement without user approval; present consolidation map"
  - id: consolidate.c4
    kind: table
    text: "Phase 6 pre-flight: architecture, whitelist, circular deps, @/ aliases, protected files"
  - id: consolidate.c5
    kind: table
    text: "Phase 6 post-flight: validate:all, lint, structure, arch, no cycles, feature README"
  - id: consolidate.c6
    kind: table
    text: "Scoping options: full audit, feature pair, layer audit, pattern audit — default full"
  - id: consolidate.c7
    kind: table
    text: "Symbiotic siblings: optimize2, semantic placement, challenge, standards-align, review"
  - id: consolidate.l1
    kind: link
    text: "-> references/semantic-placement.md"
