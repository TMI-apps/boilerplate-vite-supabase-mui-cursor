    text: "Prerequisite: validate gate green before semantic placement mode"
  - id: consolidate.ref.semantic-placement.u2
    kind: table
    text: "Phase A violations: misplaced concerns, missing abstractions, feature boundary, intent violations"
  - id: consolidate.ref.semantic-placement.u3
    kind: table
